[metadata]
name = nvidia-security-workflows-trufflehog
version = 3.95.9.0
description = NVIDIA Security Workflows' pre-commit-managed TruffleHog binary
license = Apache-2.0

[options]
python_requires = >=3.8

# `setuptools-download` verifies the complete archive before extracting the
# requested executable. Keep all version, URL, and SHA-256 updates together.
[setuptools_download]
download_scripts =
    [trufflehog]
    group = trufflehog-binary
    marker = sys_platform == "darwin" and platform_machine == "x86_64"
    url = https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_darwin_amd64.tar.gz
    sha256 = 4306a58d25b85aad7b5fb6f5732df77c50a9161db2746b56e196649072218691
    extract = tar
    extract_path = trufflehog

    [trufflehog]
    group = trufflehog-binary
    marker = sys_platform == "darwin" and platform_machine == "arm64"
    url = https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_darwin_arm64.tar.gz
    sha256 = 944c6ea3a2993a9f808d08107b40e03ba92bc75972876a1ee47d567bfd6fa1b5
    extract = tar
    extract_path = trufflehog

    [trufflehog]
    group = trufflehog-binary
    marker = sys_platform == "linux" and platform_machine == "x86_64"
    url = https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_linux_amd64.tar.gz
    sha256 = f6d1106b85107d79527ed7a5b98b592beadd8b770dc3c9e8c1ad99e1b2cf127e
    extract = tar
    extract_path = trufflehog

    [trufflehog]
    group = trufflehog-binary
    marker = sys_platform == "linux" and platform_machine == "aarch64"
    url = https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_linux_arm64.tar.gz
    sha256 = 9d9c2ec4ea36a089a9c5aaafe1969d176013ddf9f44d68e8cd75291aed8c83ed
    extract = tar
    extract_path = trufflehog

    [trufflehog.exe]
    group = trufflehog-binary
    marker = sys_platform == "win32" and platform_machine == "AMD64"
    url = https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_windows_amd64.tar.gz
    sha256 = 25cc731f678922c870edba49f19c324aa6c8e7190b551c4fbe49d0c4e1c5446a
    extract = tar
    extract_path = trufflehog.exe

    [trufflehog.exe]
    group = trufflehog-binary
    marker = sys_platform == "win32" and platform_machine == "ARM64"
    url = https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_windows_arm64.tar.gz
    sha256 = df982afbf72d1c1a125e4871b624b7f959b2f62caa40e4d14bf861fb93c237bb
    extract = tar
    extract_path = trufflehog.exe
