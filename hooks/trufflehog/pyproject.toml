[build-system]
# setuptools-download 1.0.1 has a legacy license classifier that Setuptools
# 77+ warns about; the smoke test treats Python warnings as errors.
requires = [
    "setuptools>=70.1,<77",
    "setuptools-download==1.0.1",
]
build-backend = "setuptools.build_meta"
