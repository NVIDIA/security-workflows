[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# `language: python` always installs the hook repository root. Keep this
# bridge empty; individual hooks declare their isolated dependencies in
# .pre-commit-hooks.yaml.
[project]
name = "nvidia-security-workflows-pre-commit-bridge"
version = "0"

[tool.setuptools]
packages = []
