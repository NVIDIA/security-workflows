# Pre-commit hook manifest. Consumed by downstream `.pre-commit-config.yaml` files.

- id: secret-scan-trufflehog
  name: check for leaked secrets (trufflehog)
  description: >-
    Scans uncommitted changes for verified secret leaks using the upstream
    TruffleHog pre-commit invocation. Pre-commit bootstraps Go and builds the
    pinned TruffleHog source in its isolated hook environment.
  entry: trufflehog git file://. --since-commit HEAD --results=verified --fail --trust-local-git-config
  language: golang
  additional_dependencies:
    - github.com/trufflesecurity/trufflehog/v3@v3.95.9
  pass_filenames: false
  require_serial: true   # one invocation per run
  stages: [pre-commit, pre-push]
