# Pre-commit hook manifest. Consumed by downstream `.pre-commit-config.yaml` files.

- id: secret-scan-trufflehog
  name: check for leaked secrets (trufflehog)
  description: >-
    Scans changed files for verified secret leaks using TruffleHog. On first
    installation, pre-commit creates an isolated Python environment and
    installs the platform-specific, SHA-256-pinned TruffleHog release there.
  # --exclude-detectors=lob: a Lob API key is `test_` followed by 35 characters, so the detector matches ordinary pytest function names
  #  e.g. test_gpu_conf_compute_attestation_report, and Lob's verifier reports them as verified — the one result class this hook fails on.
  entry: trufflehog filesystem --results=verified --fail --no-update --exclude-detectors=lob
  language: python
  additional_dependencies: [./hooks/trufflehog]
  pass_filenames: true
  require_serial: true
  stages: [pre-commit, pre-push]

- id: guardwords-scan-code-scanning
  name: check for guardwords (NVIDIA code-scanning)
  description: >-
    Sends the staged diff to NVIDIA's internal code-scanning service, which runs
    the GuardWords and secret scanners, and blocks the commit on blocking
    findings. For NVIDIA employees only: installation downloads nothing, and the
    hook skips with a notice wherever the client or service is unavailable.
    Setup: hooks/guardwords/README.md.
  # Arguments: --endpoint=HOST[:PORT] (used when git config code-scanning.endpoint is unset),
  #   --timeout=SECONDS (default 8), --on-unavailable=skip|fail (default skip).
  # Use --on-unavailable=fail only where every contributor is on the NVIDIA network: it fails every commit the service cannot scan.
  entry: guardwords-scan-code-scanning
  language: python
  additional_dependencies: [./hooks/guardwords]
  # The client diffs the index against HEAD itself; it accepts no file list.
  pass_filenames: false
  require_serial: true
  # Informational findings and skip notices are visible only when output is shown.
  verbose: true
  stages: [pre-commit]
