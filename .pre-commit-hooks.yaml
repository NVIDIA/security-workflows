# Pre-commit hook manifest. Consumed by downstream `.pre-commit-config.yaml` files.

- id: secret-scan-trufflehog
  name: check for leaked secrets (trufflehog)
  description: >-
    Scans changed files for verified secret leaks using TruffleHog. The wrapper
    downloads a pinned, checksum-verified TruffleHog release into a per-user
    cache on first use — no manual install required (see hooks/trufflehog.sh).
  entry: hooks/trufflehog.sh
  language: script       # self-installing wrapper
  pass_filenames: true   # scope scan to changed files
  require_serial: true   # one invocation per run
  stages: [pre-commit, pre-push]
