# Pre-commit hook manifest. Consumed by downstream `.pre-commit-config.yaml` files.

- id: secret-scan-trufflehog
  name: check for leaked secrets (trufflehog)
  description: >-
    Scans changed files for verified secret leaks using TruffleHog. On first
    installation, pre-commit creates an isolated Python environment and
    installs the platform-specific, SHA-256-pinned TruffleHog release there.
  # --exclude-detectors=lob: a Lob API key is `test_` followed by 35 characters, so the detector matches ordinary pytest function names
  #  e.g. test_gpu_conf_compute_attestation_report, and Lob's verifier reports them as verified — the one result class this hook fails on.
  entry: trufflehog filesystem --results=verified --fail --no-update --exclude-detectors=lob
  language: python
  additional_dependencies: [./hooks/trufflehog]
  pass_filenames: true
  require_serial: true
  stages: [pre-commit, pre-push]
