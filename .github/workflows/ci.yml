#
# CI + integration tests for this repository's own sources. The published
# workflows are `workflow_call` and never self-trigger, so this workflow is
# what exercises them:
#   - lint:      validates every workflow/configuration file (pre-commit stack).
#   - hook smoke: installs and runs published pre-commit-stage hooks on every
#                 supported OS/architecture.
#   - integration (Pulse): tests all three failure_policy scenarios with positive and negative cases.


name: CI (lint + scan self-tests)

on:
  push:
    branches:
      - main
      - "pull-request/[0-9]+"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-on-${{ github.event_name }}-from-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.x'
      - name: Run pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

  pre-commit-hooks-smoke:
    name: Published pre-commit hooks (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Pin labels with known architectures rather than relying on `-latest`.
        include:
          - target: Linux x86_64
            runner: ubuntu-24.04
            sys_platform: linux
            machine: x86_64
            python_architecture: x64
          - target: Linux ARM64
            runner: ubuntu-24.04-arm
            sys_platform: linux
            machine: aarch64
            python_architecture: arm64
          - target: macOS x86_64
            runner: macos-26-intel
            sys_platform: darwin
            machine: x86_64
            python_architecture: x64
          - target: macOS ARM64
            runner: macos-26
            sys_platform: darwin
            machine: arm64
            python_architecture: arm64
          - target: Windows x86_64
            runner: windows-2022
            sys_platform: win32
            machine: AMD64
            python_architecture: x64
          - target: Windows ARM64
            runner: windows-11-arm
            sys_platform: win32
            machine: ARM64
            python_architecture: arm64
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.x'
          architecture: ${{ matrix.python_architecture }}
      - name: Verify runner platform
        env:
          EXPECTED_SYS_PLATFORM: ${{ matrix.sys_platform }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: >-
          python -c "import os, platform, sys; actual = (sys.platform, platform.machine()); expected = (os.environ['EXPECTED_SYS_PLATFORM'], os.environ['EXPECTED_MACHINE']); print(f'actual={actual}, expected={expected}'); sys.exit(actual != expected)"
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run published pre-commit-stage hooks without Python warnings
        env:
          PYTHONWARNINGS: error
        run: pre-commit try-repo . --all-files

      # Regression: TruffleHog's Lob detector matched pytest function names (`test_` plus 35 characters) and its verifier reported them as verified.
      # failing the hook on every Python repository with long test names.
      # The fixture is written at run time rather than committed so the repository's own Pulse self-tests never scan it.
      - name: Regression — pytest function names must not trip a detector
        shell: bash
        run: |
          printf 'def test_gpu_conf_compute_attestation_report():\n    pass\n' > lob_false_positive_fixture.py
          pre-commit try-repo . secret-scan-trufflehog --files lob_false_positive_fixture.py
          rm -f lob_false_positive_fixture.py

  # ============================================================================
  # failure_policy: strict (strictest) — must fail on ANY finding
  # ============================================================================

  # POSITIVE (Pulse, policy=strict): clean repo should pass
  secret-scan-pulse-policy-strict-positive:
    name: Secret scan (Pulse, failure_policy=strict) — positive
    if: ${{ vars.ENABLE_PULSE_INTEGRATION == 'true' }}
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    uses: ./.github/workflows/secret-scan-pulse.yml
    with:
      failure_policy: strict

  # NEGATIVE (Pulse, policy=strict): a planted secret MUST be detected (exit 185),
  # which failure_policy=strict maps to a job failure.
  secret-scan-pulse-policy-strict-negative:
    name: Secret scan (Pulse, failure_policy=strict) — negative (assert exit 185)
    if: ${{ vars.ENABLE_PULSE_INTEGRATION == 'true' }}
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
      id-token: write
    env:
      PULSE_IMAGE: ${{ vars.SECRET_SCAN_PULSE_IMAGE }}:${{ vars.SECRET_SCAN_PULSE_IMAGE_TAG }}
      SCAN_RESULTS: verified,unknown,unverified
    steps:
      - name: Import nvcr.io credentials from Vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b  # v3.4.0
        with:
          url: ${{ vars.NV_VAULT_URL }}
          role: ${{ vars.NVCR_VAULT_ROLE }}
          method: jwt
          path: ${{ vars.NVCR_VAULT_JWT_PATH }}
          jwtGithubAudience: https://token.actions.githubusercontent.com
          namespace: ${{ vars.NVCR_VAULT_NAMESPACE }}
          secrets: |
            ${{ vars.NVCR_VAULT_SECRET_PATH }} username | NVCR_IO_USERNAME ;
            ${{ vars.NVCR_VAULT_SECRET_PATH }} password | NVCR_IO_PASSWORD

      - name: Log in to nvcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: nvcr.io
          username: ${{ env.NVCR_IO_USERNAME }}
          password: ${{ env.NVCR_IO_PASSWORD }}

      - name: Build fixture with unverified secret
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/dirty-strict"
          mkdir -p "$RUNNER_TEMP/dirty-strict"
          openssl genrsa -out "$RUNNER_TEMP/dirty-strict/id_rsa" 2048 2>/dev/null

      - name: Assert scanner returns exit 185 for the planted unverified finding
        run: |
          # Capture the exact exit code — do not treat "any non-zero" as success,
          # otherwise a Docker/scanner error would masquerade as a detection.
          set +e
          docker run --rm -v "$RUNNER_TEMP/dirty-strict:/scan:ro" \
            --entrypoint pulse-secret-scanner "$PULSE_IMAGE" \
            filesystem /scan "--results=${SCAN_RESULTS}" --fail \
            > "$RUNNER_TEMP/neg-strict.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 185 ]; then
            echo "::error::expected exit 185 (unverified finding), got ${code}"
            exit 1
          fi
          echo "✓ scanner returned 185; failure_policy=strict maps this to a job failure"

      - name: Log out of nvcr.io
        if: always()
        run: docker logout nvcr.io

  # ============================================================================
  # failure_policy: unverified (default) — fail only on verified secrets, warn on unverified
  # ============================================================================

  # POSITIVE (Pulse, policy=unverified): clean repo should pass
  secret-scan-pulse-policy-unverified-positive:
    name: Secret scan (Pulse, failure_policy=unverified) — positive
    if: ${{ vars.ENABLE_PULSE_INTEGRATION == 'true' }}
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    uses: ./.github/workflows/secret-scan-pulse.yml
    with:
      failure_policy: unverified

  # NEGATIVE (Pulse, policy=unverified) via the reusable workflow itself:
  # a planted unverified secret is detected (185) but failure_policy=unverified
  # keeps the job GREEN. Expected outcome is success, so it does not red the run.
  secret-scan-pulse-policy-unverified-negative:
    name: Secret scan (Pulse, failure_policy=unverified) — negative (must pass despite unverified finding)
    if: ${{ vars.ENABLE_PULSE_INTEGRATION == 'true' }}
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    uses: ./.github/workflows/secret-scan-pulse.yml
    with:
      failure_policy: unverified
      ci_test_setup: true

  # ============================================================================
  # failure_policy: all (most permissive) — warn only, never fail
  # ============================================================================

  # POSITIVE (Pulse, policy=all): clean repo should pass
  secret-scan-pulse-policy-all-positive:
    name: Secret scan (Pulse, failure_policy=all) — positive
    if: ${{ vars.ENABLE_PULSE_INTEGRATION == 'true' }}
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    uses: ./.github/workflows/secret-scan-pulse.yml
    with:
      failure_policy: all

  # NEGATIVE (Pulse, policy=all) via the reusable workflow itself:
  # findings are warn-only under failure_policy=all, so the job stays GREEN.
  secret-scan-pulse-policy-all-negative:
    name: Secret scan (Pulse, failure_policy=all) — negative (must pass despite findings)
    if: ${{ vars.ENABLE_PULSE_INTEGRATION == 'true' }}
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    uses: ./.github/workflows/secret-scan-pulse.yml
    with:
      failure_policy: all
      ci_test_setup: true

  # ============================================================================
  # Security suite — self test the fan-out and the enable-* gating.
  # It runs only when the Pulse integration environment is available.
  #
  # Only the secret scan is enabled here. sast-scan-codeql.yml uploads with the fixed
  # category "/language:<lang>", so enabling SAST here as well would publish a second
  # /language:actions analysis for the same commit as sast-codeql-dogfood below and the
  # two would race in code scanning. The SAST passthrough is covered by that job.
  # ============================================================================
  security-suite-dogfood:
    name: Security suite — self test
    if: ${{ vars.ENABLE_PULSE_INTEGRATION == 'true' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/security-suite.yml
    with:
      enable-secret-scan: true

  # NEGATIVE: a suite call that enables nothing must warn and stay GREEN, not fail.
  # Grants the union of every child job's permissions even though no scan will run:
  # a caller is validated against what the called workflow declares, not against the
  # subset its `if:` conditions will schedule. Granting less is a startup failure.
  security-suite-noop-dogfood:
    name: Security suite (no scans enabled) — negative (must pass with a warning)
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/security-suite.yml

  # SAST resolver — contract tests for the language matrix.
  #
  # Runs the resolver extracted from sast-scan-codeql.yml itself, so the tests exercise the shipped script rather than a copy that can drift.
  # Covers what a live scan cannot: build modes this repo has no sources for (go, rust, swift), and the rejection paths, whose expected outcome is a non-zero exit
  # Asserting them here keeps the run green, matching how the Pulse negatives above are shaped.
  # ============================================================================
  sast-resolver-contract:
    name: SAST resolver — contract tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.x'

      - name: Extract the resolver from sast-scan-codeql.yml
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python - <<'PY'
          import os, pathlib, yaml
          workflow = yaml.safe_load(pathlib.Path(".github/workflows/sast-scan-codeql.yml").read_text())
          script = workflow["jobs"]["resolve"]["steps"][0]["run"]
          pathlib.Path(os.environ["RUNNER_TEMP"], "resolve.sh").write_text(script)
          PY
          test -s "$RUNNER_TEMP/resolve.sh"

      - name: Assert resolved matrices and rejections
        env:
          RESOLVER: ${{ runner.temp }}/resolve.sh
        run: |
          set -uo pipefail
          failures=0

          # run <languages> <default-build-mode> -> sets $code and $matrix.
          # `|| code=$?` is required: Actions runs this step under `bash -e`, and the rejection
          # cases below expect the resolver to exit non-zero, which would otherwise abort the step.
          run_case() {
            : > "$RUNNER_TEMP/out.txt"
            code=0
            LANGUAGES="$1" DEFAULT_BUILD_MODE="$2" DEFAULT_RUNS_ON=ubuntu-latest \
              GITHUB_OUTPUT="$RUNNER_TEMP/out.txt" GITHUB_STEP_SUMMARY=/dev/null \
              bash "$RESOLVER" > "$RUNNER_TEMP/log.txt" 2>&1 || code=$?
            matrix=$(sed -n 's/^matrix=//p' "$RUNNER_TEMP/out.txt")
          }

          expect_ok() {
            local name="$1" langs="$2" mode="$3" want="$4"
            run_case "$langs" "$mode"
            if [ "$code" -ne 0 ]; then
              echo "::error::${name}: expected success, exited ${code}"; cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            if ! diff -q <(printf '%s' "$matrix" | jq -S .) <(printf '%s' "$want" | jq -S .) >/dev/null; then
              echo "::error::${name}: matrix mismatch"
              echo "  want: $(printf '%s' "$want" | jq -Sc .)"
              echo "  got:  $(printf '%s' "$matrix" | jq -Sc .)"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name}"
          }

          expect_rejected() {
            local name="$1" langs="$2" mode="$3"
            run_case "$langs" "$mode"
            if [ "$code" -eq 0 ]; then
              echo "::error::${name}: expected the resolver to reject this, but it succeeded"; failures=$((failures+1)); return
            fi
            if ! grep -q '::error::' "$RUNNER_TEMP/log.txt"; then
              echo "::error::${name}: failed without an actionable ::error:: message"; failures=$((failures+1)); return
            fi
            echo "✓ ${name} — $(grep -m1 '::error::' "$RUNNER_TEMP/log.txt" | sed 's/^::error:://')"
          }

          leg() { printf '{"language":"%s","buildMode":"%s","runsOn":"%s"}' "$1" "$2" "${3:-ubuntu-latest}"; }

          expect_ok "string array stays back-compatible" \
            '["actions","python"]' none \
            "{\"include\":[$(leg actions none),$(leg python none)]}"

          expect_ok "go is promoted to autobuild, rust stays none" \
            '["go","rust"]' none \
            "{\"include\":[$(leg go autobuild),$(leg rust none)]}"

          expect_ok "rust is demoted from a global autobuild preference" \
            '["c-cpp","rust"]' autobuild \
            "{\"include\":[$(leg c-cpp autobuild),$(leg rust none)]}"

          expect_ok "explicit per-language build-mode is honoured" \
            '[{"language":"c-cpp","build-mode":"autobuild"},"python"]' none \
            "{\"include\":[$(leg c-cpp autobuild),$(leg python none)]}"

          expect_ok "per-language runs-on reaches the leg" \
            '[{"language":"swift","runs-on":"macos-14"}]' none \
            "{\"include\":[$(leg swift autobuild macos-14)]}"

          expect_ok "java-kotlin defaults to none like GitHub default setup" \
            '["java-kotlin"]' none \
            "{\"include\":[$(leg java-kotlin none)]}"

          expect_rejected "unknown language"                  '["bash"]' none
          expect_rejected "rust with an explicit autobuild"    '[{"language":"rust","build-mode":"autobuild"}]' none
          expect_rejected "manual build-mode"                  '[{"language":"go","build-mode":"manual"}]' none
          expect_rejected "duplicate language"                 '["python","python"]' none
          expect_rejected "empty language list"                '[]' none
          expect_rejected "malformed JSON"                     '["python"' none
          expect_rejected "misspelled build-mode key"          '[{"language":"go","buildMode":"none"}]' none
          expect_rejected "misspelled runs-on key"             '[{"language":"swift","runsOn":"macos-14"}]' none

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} resolver contract case(s) failed"
            exit 1
          fi
          echo "All resolver contract cases passed."

  # SAST (CodeQL) — self test the reusable workflow on this repo's own sources.
  # This repo is workflows + shell, so the relevant CodeQL language is "actions".
  # Uses the object entry form so the parsing path a plain string array never reaches is covered end to end.
  # Only "actions" is analyzed: an org Security Configuration already runs CodeQL default setup for python on this repo, and analyzing it here too would
  # publish a second /language:python analysis for the same commit.
  # ============================================================================
  sast-codeql-dogfood:
    name: SAST (CodeQL) — self test
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/sast-scan-codeql.yml
    with:
      languages: '[{"language":"actions","build-mode":"none"}]'
      runs-on: ubuntu-latest

  # ============================================================================
  # Vulnerability scan (Pulse OSS) — contract tests.
  #
  # Runs the four gates extracted from vuln-scan-pulse-oss.yml itself, so the tests exercise
  # the shipped scripts rather than copies that can drift. Steps are located by name, so
  # renaming one fails the extraction loudly instead of silently testing nothing.
  #
  # These cover what a live scan cannot. The scan needs Vault, nvcr.io, a Charon tunnel and an
  # nSpect registration, so every rejection path is unreachable from a real run; and the
  # fail-on-vulnerability path's correct outcome is a FAILING job, which a reusable-workflow
  # call cannot mask (`continue-on-error` is not an accepted key). Asserting the exit codes
  # here keeps the run green, matching how the Pulse negatives above are shaped.
  #
  # Nothing credential-shaped is committed: the JWT and bearer fixtures the report validator
  # must reject are constructed at run time, so this repository's own strict secret scan
  # (secret-scan-pulse-policy-strict-positive) has nothing to find.
  # ============================================================================
  vuln-scan-contract:
    name: Vulnerability scan — contract tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.x'

      - name: Extract the gates from vuln-scan-pulse-oss.yml
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python - <<'PY'
          import os, pathlib, re, shlex, yaml
          workflow = yaml.safe_load(pathlib.Path(".github/workflows/vuln-scan-pulse-oss.yml").read_text())
          job = workflow["jobs"]["pulse-oss"]
          steps = {step["name"]: step for step in job["steps"]}
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          for filename, step_name in {
              "contract.sh": "Validate scan contract",
              "scan-path.sh": "Validate scan path",
              "log-sanitizer.py": "Pulse OSS vulnerability scan",
              "classify.sh": "Classify scan result",
              "report.sh": "Validate scan report",
              "enforce.sh": "Enforce scan result",
          }.items():
              # KeyError here is the point: a renamed step must fail loudly, not test nothing.
              script = steps[step_name]["run"]
              if filename == "log-sanitizer.py":
                  marker = "SENSITIVE_NSPECT_ID=\"$INPUT_NSPECT_ID\" SENSITIVE_SBOM_NAME=\"$INPUT_SBOM_NAME\""
                  start = script.index(marker)
                  start = script.index("python3 - <<'PY'\n", start) + len("python3 - <<'PY'\n")
                  end = script.index("\nPY", start)
                  script = script[start:end]
              (temp / filename).write_text(script)
          # Source the workflow-owned settings so the tests cannot drift from them.
          (temp / "job-env.sh").write_text("".join(
              "%s=%s\n" % (name, shlex.quote(str(job["env"][key]))) for name, key in (
                  ("ALLOWED_REGISTRY", "SCANNER_IMAGE_ALLOWED_REGISTRY"),
                  ("PINNED_IMAGE", "SCANNER_IMAGE_REF"),
                  ("DEFAULT_CHARON_PROXY", "CHARON_PROXY_SERVER"),
                  ("DEFAULT_CHARON_JOIN", "CHARON_JOIN_TOKEN"),
                  ("DEFAULT_CHARON_APP", "CHARON_APP_NAME"),
                  ("DEFAULT_CHARON_PORT", "CHARON_LOCAL_PORT"),
              )))
          PY
          for f in contract.sh scan-path.sh log-sanitizer.py classify.sh report.sh enforce.sh job-env.sh; do
            test -s "$RUNNER_TEMP/$f"
          done

      - name: Assert the scanner image and tunnel settings belong to the workflow
        run: |
          set -euo pipefail
          # The scanner receives the job's OIDC request credentials, so callers must not be able
          # to replace the image or redirect the tunnel through their own variables.
          if grep -nE 'vars\.(VULN_SCAN_PULSE_OSS_IMAGE|CHARON_)' .github/workflows/vuln-scan-pulse-oss.yml; then
            echo "::error::vuln-scan-pulse-oss.yml reads the scanner image or Charon settings from caller variables"
            exit 1
          fi
          echo "✓ the scanner image and Charon settings are owned by the workflow"

      - name: Assert the scan contract accepts and rejects the right inputs
        env:
          CONTRACT: ${{ runner.temp }}/contract.sh
        run: |
          set -uo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/job-env.sh"
          failures=0
          # A placeholder image keeps these cases independent of the pinned release.
          IMAGE_PATH="${ALLOWED_REGISTRY}/0000000000000000/pulse/pulse-oss-cli"
          DIGEST="$(printf 'a%.0s' $(seq 64))"
          GOOD_IMAGE="${IMAGE_PATH}@sha256:${DIGEST}"

          # Every case starts from a valid contract and overrides exactly what it tests, so a
          # rejection can only be caused by the field under test.
          reset_case() {
            EVENT=push; REF=refs/heads/main
            IMAGE_REF="$GOOD_IMAGE"; CLIENT_VERSION=auto
            OIDC_URL=https://oidc.example.invalid/token; OIDC_TOKEN=placeholder-not-a-real-token
            VAULT_URL=https://vault.example.invalid
            CHARON_PROXY="$DEFAULT_CHARON_PROXY"; CHARON_JOIN="$DEFAULT_CHARON_JOIN"
            CHARON_APP="$DEFAULT_CHARON_APP"; CHARON_PORT="$DEFAULT_CHARON_PORT"
            NSPECT_ID=NSPECT-ABCD-1234; REGISTERED_BRANCH=main; SBOM_NAME=
            SCAN_MODE=rapid; SCAN_PATH=.; FAILURE_POLICY=report-only
            WRITEBACK=false; TIMEOUT=1800
          }

          run_contract() {
            : > "$RUNNER_TEMP/out.txt"
            : > "$RUNNER_TEMP/env.txt"
            code=0
            GITHUB_EVENT_NAME="$EVENT" GITHUB_REF="$REF" \
            GITHUB_REPOSITORY=NVIDIA/security-workflows \
            GITHUB_ENV="$RUNNER_TEMP/env.txt" GITHUB_OUTPUT="$RUNNER_TEMP/out.txt" \
            ACTIONS_ID_TOKEN_REQUEST_URL="$OIDC_URL" \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN="$OIDC_TOKEN" \
            SCANNER_IMAGE_REF="$IMAGE_REF" SCANNER_IMAGE_ALLOWED_REGISTRY="$ALLOWED_REGISTRY" \
            CHARON_CLIENT_VERSION="$CLIENT_VERSION" \
            CHARON_PROXY_SERVER="$CHARON_PROXY" CHARON_JOIN_TOKEN="$CHARON_JOIN" \
            CHARON_APP_NAME="$CHARON_APP" CHARON_LOCAL_PORT="$CHARON_PORT" \
            NV_VAULT_URL="$VAULT_URL" NVCR_VAULT_ROLE=role NVCR_VAULT_JWT_PATH=jwt-path \
            NVCR_VAULT_NAMESPACE=namespace NVCR_VAULT_SECRET_PATH=secret/path \
            INPUT_NSPECT_ID="$NSPECT_ID" \
            INPUT_REGISTERED_BRANCH="$REGISTERED_BRANCH" INPUT_SBOM_NAME="$SBOM_NAME" \
            INPUT_SCAN_MODE="$SCAN_MODE" INPUT_SCAN_PATH="$SCAN_PATH" \
            INPUT_FAILURE_POLICY="$FAILURE_POLICY" INPUT_WRITEBACK="$WRITEBACK" \
            INPUT_TIMEOUT="$TIMEOUT" \
              bash "$CONTRACT" > "$RUNNER_TEMP/log.txt" 2>&1 || code=$?
          }

          contract_output() { sed -n "s/^$1=//p" "$RUNNER_TEMP/out.txt"; }

          # expect_ok <name> [<output-key> <expected-value>]
          expect_ok() {
            local name="$1" key="${2:-}" want="${3:-}"
            run_contract
            if [ "$code" -ne 0 ]; then
              echo "::error::${name}: expected the contract to accept this, exited ${code}"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            if [ -n "$key" ]; then
              local got; got="$(contract_output "$key")"
              if [ "$got" != "$want" ]; then
                echo "::error::${name}: ${key} was '${got}', expected '${want}'"
                failures=$((failures+1)); return
              fi
              echo "✓ ${name} (${key}=${got})"; return
            fi
            echo "✓ ${name}"
          }

          # expect_rejected <name> <substring the operator-facing error must contain>
          expect_rejected() {
            local name="$1" needle="$2"
            run_contract
            if [ "$code" -eq 0 ]; then
              echo "::error::${name}: expected the contract to reject this, but it succeeded"
              failures=$((failures+1)); return
            fi
            if ! grep -q '::error::' "$RUNNER_TEMP/log.txt"; then
              echo "::error::${name}: failed without an actionable ::error:: message"
              failures=$((failures+1)); return
            fi
            if ! grep -qF "$needle" "$RUNNER_TEMP/log.txt"; then
              echo "::error::${name}: error did not mention '${needle}'. Got: $(grep -m1 '::error::' "$RUNNER_TEMP/log.txt")"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name} — $(grep -m1 '::error::' "$RUNNER_TEMP/log.txt" | sed 's/^::error:://' | cut -c1-110)"
          }

          reset_case; expect_ok "a valid rapid contract is accepted" resolved_mode rapid
          reset_case; SCAN_MODE=auto; REF=refs/heads/main
          expect_ok  "auto on the registered branch resolves to persistent" resolved_mode persistent
          reset_case; SCAN_MODE=auto; REF=refs/heads/topic
          expect_ok  "auto off the registered branch resolves to rapid" resolved_mode rapid
          reset_case; SCAN_MODE=persistent; WRITEBACK=true; SBOM_NAME=ghf-oss-example
          expect_ok  "inventory write-back is accepted on a persistent scan" resolved_mode persistent
          reset_case; SCAN_MODE=persistent; SBOM_NAME="Example Product SBOM 2.1"
          expect_ok  "an SBOM name selects the registration of a persistent scan" resolved_mode persistent
          reset_case; CLIENT_VERSION=17.1.2
          expect_ok  "a pinned tunnel client version is accepted"
          reset_case; expect_ok "scan_path '.' slugs to root" artifact_slug root
          reset_case; SCAN_PATH=src/vendor/pkg
          expect_ok  "a nested scan_path slugs into an artifact-safe name" artifact_slug src-vendor-pkg

          # Fork-authored code must never reach a job holding OIDC.
          reset_case; EVENT=pull_request
          expect_rejected "pull_request is refused"        "not a trusted trigger"
          reset_case; EVENT=pull_request_target
          expect_rejected "pull_request_target is refused" "not a trusted trigger"

          # vars resolve against the caller, so a missing one must be named, not left to
          # surface as the Vault action's "Input required and not supplied: url".
          reset_case; VAULT_URL=
          expect_rejected "a missing Vault variable is named" "NV_VAULT_URL"

          # Workflow-owned tunnel settings are still shape-checked before they reach the tbot config.
          reset_case; CHARON_PROXY=
          expect_rejected "an empty Charon proxy is rejected" "host:port"
          reset_case; CHARON_PROXY=proxy.example.invalid:99999
          expect_rejected "a Charon proxy port above the TCP range is rejected" "port from 1 to 65535"
          reset_case; CHARON_PROXY=proxy.example.invalid/path:443
          expect_rejected "a malformed Charon proxy is rejected" "host:port"
          reset_case; CHARON_JOIN="$(printf 'charon\nrunners')"
          expect_rejected "a Charon join token with a control character is rejected" "JOIN_TOKEN"
          reset_case; CHARON_APP="-charon"
          expect_rejected "a Charon app name with a leading dash is rejected" "APP_NAME"
          reset_case; CHARON_PORT=80
          expect_rejected "a privileged Charon local port is rejected" "unprivileged TCP port"
          reset_case; CHARON_PORT=not-a-port
          expect_rejected "a non-numeric Charon local port is rejected" "unprivileged TCP port"

          # The scanner image is pinned by digest in the workflow; no tag or other registry passes.
          reset_case; IMAGE_REF="$PINNED_IMAGE"
          expect_ok       "the workflow's pinned scanner image is accepted"
          reset_case; IMAGE_REF="${IMAGE_PATH}:charon-stable"
          expect_rejected "a tag reference is rejected"            "pinned by sha256 digest"
          reset_case; IMAGE_REF="${IMAGE_PATH}:latest@sha256:${DIGEST}"
          expect_rejected "a tag alongside the digest is rejected" "pinned by sha256 digest"
          reset_case; IMAGE_REF="${IMAGE_PATH}@sha256:${DIGEST:0:12}"
          expect_rejected "a truncated digest is rejected"         "pinned by sha256 digest"
          reset_case; IMAGE_REF="registry.invalid/0000000000000000/pulse/pulse-oss-cli@sha256:${DIGEST}"
          expect_rejected "a foreign registry is rejected"         "pinned by sha256 digest"
          # Anchoring and literal-dot: neither a host in front nor a lookalike matches.
          reset_case; IMAGE_REF="registry.invalid/${IMAGE_PATH}@sha256:${DIGEST}"
          expect_rejected "the allowed host behind another host is rejected" "pinned by sha256 digest"
          reset_case; IMAGE_REF="nvcrXio/0000000000000000/pulse/pulse-oss-cli@sha256:${DIGEST}"
          expect_rejected "a lookalike host is rejected"           "pinned by sha256 digest"

          reset_case; CLIENT_VERSION=latest
          expect_rejected "a non-semver tunnel client version is rejected" "bare semantic version"
          reset_case; CLIENT_VERSION=1.2.3-..%2Fevil
          expect_rejected "a traversal in the client version is rejected"  "bare semantic version"

          reset_case; OIDC_URL=
          expect_rejected "a caller without id-token: write is rejected" "id-token: write"

          reset_case; NSPECT_ID=NSPECT-BAD
          expect_rejected "a malformed nSpect id is rejected" "must be a valid nSpect ID"

          # Unregistered lane: an empty nspect_id selects --no-nspect, which the CLI allows
          # only for a rapid scan with no inventory write-back.
          reset_case; NSPECT_ID=; SCAN_MODE=rapid
          expect_ok       "an empty nSpect id is accepted for a rapid scan" resolved_mode rapid
          reset_case; NSPECT_ID=; SCAN_MODE=auto; REF=refs/heads/main
          expect_ok       "auto stays rapid without a registration, even on the registered ref" resolved_mode rapid
          reset_case; NSPECT_ID=; SCAN_MODE=persistent
          expect_rejected "a persistent scan without a registration is rejected" "needs an nspect_id"
          reset_case; NSPECT_ID=; SCAN_MODE=rapid; WRITEBACK=true
          expect_rejected "write-back without a registration is rejected" "available only for a persistent scan"
          reset_case; NSPECT_ID=; SBOM_NAME=ghf-oss-example
          expect_rejected "an SBOM name without a registration is rejected" "needs an nspect_id"
          reset_case; REGISTERED_BRANCH=../../etc
          expect_rejected "a traversal in registered_branch is rejected" "registered_branch is invalid"
          reset_case; SCAN_MODE=turbo
          expect_rejected "an unknown scan_mode is rejected"   "scan_mode must be"
          reset_case; FAILURE_POLICY=warn
          expect_rejected "an unknown failure_policy is rejected" "failure_policy must be"
          reset_case; TIMEOUT=30
          expect_rejected "a timeout below the floor is rejected"   "between 60 and 3600"
          reset_case; TIMEOUT=7200
          expect_rejected "a timeout above the ceiling is rejected" "between 60 and 3600"
          reset_case; TIMEOUT=abc
          expect_rejected "a non-numeric timeout is rejected"       "between 60 and 3600"

          # A persistent scan owns stable backend state, so only the registered ref may run one.
          reset_case; SCAN_MODE=persistent; REF=refs/heads/topic
          expect_rejected "a persistent scan off the registered ref is rejected" "persistent scan requires"
          reset_case; SCAN_MODE=rapid; WRITEBACK=true
          expect_rejected "write-back without a persistent scan is rejected" "available only for a persistent scan"
          reset_case; SCAN_MODE=persistent; WRITEBACK=true
          expect_rejected "write-back without an SBOM name is rejected" "inventory_writeback needs sbom_name"

          # A pull-request mirror carries pull-request content, so it is RAPID-only.
          MIRROR=refs/heads/pull-request/42
          reset_case; REF="$MIRROR"; SCAN_MODE=auto
          expect_ok       "auto on a pull-request mirror resolves to rapid" resolved_mode rapid
          reset_case; REF="$MIRROR"; SBOM_NAME=ghf-oss-example
          expect_ok       "a registered rapid scan runs on a pull-request mirror" resolved_mode rapid
          reset_case; REF="$MIRROR"; SCAN_MODE=persistent
          expect_rejected "a persistent scan on a pull-request mirror is rejected" "RAPID-only"
          reset_case; REF="$MIRROR"; SCAN_MODE=rapid; WRITEBACK=true
          expect_rejected "write-back on a pull-request mirror is rejected" "RAPID-only"
          # Without this, auto would resolve to persistent on the mirror it names.
          reset_case; REF="$MIRROR"; SCAN_MODE=auto; REGISTERED_BRANCH=pull-request/42
          expect_rejected "a mirror named as registered_branch is rejected" "cannot be a copy-pr-bot"

          reset_case; SBOM_NAME="-x"
          expect_rejected "an SBOM name that reads as an option is rejected" "sbom_name must"
          reset_case; SBOM_NAME="$(printf 'ghf-oss\nexample')"
          expect_rejected "a control character in the SBOM name is rejected" "sbom_name must"
          reset_case; SBOM_NAME="$(printf 'a%.0s' $(seq 256))"
          expect_rejected "an SBOM name over 255 characters is rejected" "sbom_name must"

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} contract case(s) failed"
            exit 1
          fi
          echo "All contract cases passed."

      - name: Assert scan_path cannot escape the checkout
        env:
          SCAN_PATH_GATE: ${{ runner.temp }}/scan-path.sh
        run: |
          set -uo pipefail
          failures=0
          # `outside` is a SIBLING of the workspace, not a child, and it exists. A traversal
          # case must be refused for traversing — if the escape target did not exist, the
          # gate would refuse it for being missing and the test would pass even with the
          # traversal guard deleted.
          sandbox="$RUNNER_TEMP/sandbox"
          workspace="$sandbox/ws"
          rm -rf "$sandbox"
          mkdir -p "$workspace/pkg/nested" "$workspace/contained" "$sandbox/outside"
          : > "$workspace/pkg/manifest.txt"
          : > "$workspace/plain-file"
          : > "$sandbox/outside/unreviewed.txt"
          ln -s "$workspace/pkg" "$workspace/link-to-pkg"
          ln -s "$workspace/contained" "$workspace/contained/self"

          # The escaping link lives in its own workspace. Left in the shared one it would sit
          # under `.` and, correctly, make the repository-root case unscannable — masking the
          # root case behind the escape case.
          escape_workspace="$sandbox/ws-escape"
          mkdir -p "$escape_workspace/escaping"
          ln -s "$sandbox/outside" "$escape_workspace/escaping/way-out"

          # run_gate <scan-path> [workspace]
          run_gate() {
            : > "$RUNNER_TEMP/out.txt"
            code=0
            GITHUB_WORKSPACE="${2:-$workspace}" INPUT_SCAN_PATH="$1" \
              GITHUB_OUTPUT="$RUNNER_TEMP/out.txt" \
              bash "$SCAN_PATH_GATE" > "$RUNNER_TEMP/log.txt" 2>&1 || code=$?
            container_path="$(sed -n 's/^container_path=//p' "$RUNNER_TEMP/out.txt")"
          }

          expect_path() {
            local name="$1" path="$2" want="$3"
            run_gate "$path"
            if [ "$code" -ne 0 ]; then
              echo "::error::${name}: expected acceptance, exited ${code}"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            if [ "$container_path" != "$want" ]; then
              echo "::error::${name}: container_path was '${container_path}', expected '${want}'"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name} (${container_path})"
          }

          # The refusal reason is asserted, not just the refusal. Several guards here overlap,
          # so a test that only checks "was refused" stays green when the guard it names is
          # deleted and a later one happens to catch the case for an unrelated reason.
          expect_refused() {
            local name="$1" path="$2" needle="$3" where="${4:-$workspace}"
            run_gate "$path" "$where"
            if [ "$code" -eq 0 ]; then
              echo "::error::${name}: expected refusal, but the path was accepted as '${container_path}'"
              failures=$((failures+1)); return
            fi
            if ! grep -qF "$needle" "$RUNNER_TEMP/log.txt"; then
              echo "::error::${name}: refused, but not for the expected reason '${needle}'. Got: $(grep -m1 '::error::' "$RUNNER_TEMP/log.txt")"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name} — $(grep -m1 '::error::' "$RUNNER_TEMP/log.txt" | sed 's/^.*::error:://' | cut -c1-110)"
          }

          expect_path "the repository root maps to the mount root" "." /workspace
          expect_path "a subdirectory maps under the mount"        "pkg" /workspace/pkg
          expect_path "a nested subdirectory maps under the mount" "pkg/nested" /workspace/pkg/nested
          expect_path "a link that stays inside the tree is allowed" "contained" /workspace/contained

          expect_refused "an empty scan_path"      ""                  "scan_path is empty"
          expect_refused "an absolute scan_path"   "/etc"              "must be repository-relative"
          expect_refused "a traversal to a real directory outside the checkout" \
            "../outside"       "must be repository-relative"
          expect_refused "an embedded traversal to a real directory" \
            "pkg/../../outside" "must be repository-relative"
          expect_refused "a path that does not exist"  "no-such-directory" "does not exist in the checkout"
          expect_refused "a file rather than a directory" "plain-file"  "must select a directory"
          expect_refused "a symlink as the scan root"  "link-to-pkg"    "selects a symbolic link"
          expect_refused "a control character in the path" "$(printf 'pkg\tnested')" "control characters"
          expect_refused "a symlink under the root escaping it" \
            "escaping" "escapes the scanned tree" "$escape_workspace"
          # A link out of the tree anywhere under the scan root blocks the scan, so a
          # repository holding one cannot scan `.` until it is removed or scoped around.
          expect_refused "the repository root when any link under it escapes" \
            "." "escapes the scanned tree" "$escape_workspace"

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} scan_path case(s) failed"
            exit 1
          fi
          echo "All scan_path cases passed."

      - name: Assert scanner failure log sanitizer redacts credentials
        env:
          SANITIZER: ${{ runner.temp }}/log-sanitizer.py
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/log-sanitizer"
          rm -rf "$work"
          mkdir -p "$work/out"
          cat > "$work/raw.log" <<'LOG'
          ERROR: request failed
          Authorization: Basic ZmFrZS11c2VyOmZha2UtcGFzcw==
          Authorization: Token fake-token-value
          Proxy-Authorization: Bearer fake-proxy-token
          Authorization: Bearer  fake-two-space-token
          Cookie: session=fake-session; csrftoken=fake-csrf
          Set-Cookie: auth=fake-cookie; HttpOnly; Secure
          2026-10-22T17:00:00.123Z DEBUG Cookie: session=fake-ts-session; csrftoken=fake-ts-csrf
          {"headers": {"Cookie": "session=fake-json-session; csrftoken=fake-json-csrf", "Accept": "application/json"}}
          {'set-cookie': 'sid=fake-dict-sid; theme=fake-dict-theme'}
          send: b'GET /x HTTP/1.1\r\nCookie: a=fake-wire-a; b=fake-wire-b\r\n'
          Download: https://example.invalid/object?X-Amz-Credential=fake-credential&X-Amz-Signature=fake-signature&X-Amz-Security-Token=fake-security-token
          GCS: https://storage.example.invalid/object?X-Goog-Credential=fake-google-credential&X-Goog-Signature=fake-google-signature
          Azure: https://blob.example.invalid/object?sig=fake-azure-signature&se=2099-01-01
          LOG
          # Built at run time so no JWT-shaped literal is committed.
          jwt="eyJ$(printf 'a%.0s' $(seq 12)).$(printf 'b%.0s' $(seq 12)).$(printf 'c%.0s' $(seq 12))"
          printf '2026-10-22T17:00:01Z Authorization: Bearer %s\n' "$jwt" >> "$work/raw.log"

          RAW_LOG="$work/raw.log" OUTPUT_DIR="$work/out" \
          ACTIONS_ID_TOKEN_REQUEST_TOKEN=fake-actions-token \
          ACTIONS_ID_TOKEN_REQUEST_URL=https://token.actions.example.invalid/request \
          SENSITIVE_NSPECT_ID=NSPECT-TEST-1234 \
          SENSITIVE_SBOM_NAME=ghf-test-sbom \
          SCANNER_IMAGE_REF=nvcr.io/example/pulse:test \
            python3 "$SANITIZER"

          sanitized="$work/out/scanner-failure.log"
          test -s "$sanitized"

          forbidden=(
            'ZmFrZS11c2VyOmZha2UtcGFzcw=='
            'fake-token-value'
            'fake-proxy-token'
            'fake-two-space-token'
            'fake-session'
            'fake-csrf'
            'fake-cookie'
            'fake-credential'
            'fake-signature'
            'fake-security-token'
            'fake-google-credential'
            'fake-google-signature'
            'fake-azure-signature'
            'fake-ts-session'
            'fake-ts-csrf'
            'fake-json-session'
            'fake-json-csrf'
            'fake-dict-sid'
            'fake-dict-theme'
            'fake-wire-a'
            'fake-wire-b'
            "$jwt"
          )
          for value in "${forbidden[@]}"; do
            if grep -qF "$value" "$sanitized"; then
              echo "::error::sanitized scanner failure log still contains credential fixture: ${value}"
              cat "$sanitized"
              exit 1
            fi
          done

          # Leak checks also pass on an empty log; require diagnostics and redacted lines to remain.
          required=(
            'ERROR: request failed'
            'Authorization: Basic [REDACTED]'
            'Proxy-Authorization: Bearer [REDACTED]'
            'Authorization: Bearer  [REDACTED]'
            'Cookie: [REDACTED]'
            'Set-Cookie: [REDACTED]'
            'DEBUG Cookie: [REDACTED]'
            '{"headers": {"Cookie": "[REDACTED]", "Accept": "application/json"}}'
            "{'set-cookie': '[REDACTED]'}"
            '\nCookie: [REDACTED]'
            'Authorization: Bearer [REDACTED_JWT]'
            'X-Amz-Signature=[REDACTED]'
          )
          for value in "${required[@]}"; do
            if ! grep -qF "$value" "$sanitized"; then
              echo "::error::sanitized scanner failure log lost safe content: ${value}"
              cat "$sanitized"
              exit 1
            fi
          done
          if grep -qE 'line removed|\[REDACTED\]\]' "$sanitized"; then
            echo "::error::sanitized scanner failure log dropped a redacted line or doubled a redaction marker"
            cat "$sanitized"
            exit 1
          fi
          echo "Scanner failure log sanitizer redacted auth headers, cookies, and signed URL credentials, and kept the rest readable."

      - name: Assert log text never turns a failed scan into a pass
        env:
          CLASSIFY: ${{ runner.temp }}/classify.sh
        run: |
          set -uo pipefail
          failures=0
          work="$RUNNER_TEMP/classify"
          rm -rf "$work"
          mkdir -p "$work/out"

          # run_classify <exit-code> <scanner output>
          run_classify() {
            printf '%s\n' "$2" > "$work/raw.log"
            printf 'ERROR: sanitized scanner reason\n' > "$work/out/scanner-failure.log"
            : > "$work/github-output"
            code=0
            SCANNER_STATUS="$1" PULSE_OSS_RAW_LOG="$work/raw.log" PULSE_OSS_OUTPUT_DIR="$work/out" \
              GITHUB_OUTPUT="$work/github-output" \
              bash "$CLASSIFY" > "$work/log.txt" 2>&1 || code=$?
            effective="$(sed -n 's/^effective_status=//p' "$work/github-output")"
            category="$(sed -n 's/^diagnostic_category=//p' "$work/github-output")"
          }

          # expect_classified <name> <exit-code> <scanner output> <effective-status> <category>
          expect_classified() {
            local name="$1" want_status="$4" want_category="$5"
            run_classify "$2" "$3"
            if [ "$code" -ne 0 ]; then
              echo "::error::${name}: the classifier itself failed, exit ${code}"
              cat "$work/log.txt"; failures=$((failures+1)); return
            fi
            if [ "$effective" != "$want_status" ] || [ "$category" != "$want_category" ]; then
              echo "::error::${name}: got status='${effective}' category='${category}', expected status='${want_status}' category='${want_category}'"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name} (${effective}, ${category})"
          }

          expect_classified "a clean scan stays clean" \
            0 "Scan completed." 0 none
          expect_classified "findings on a completed scan are a policy outcome" \
            0 "FAILURE_POLICY_VIOLATION: 3 components violate policy" 0 vulnerability-policy
          expect_classified "a policy violation accounts for Detect's status-code line" \
            0 $'rapid scan is failed with status code 3\nFAILURE_POLICY_VIOLATION' 0 vulnerability-policy
          expect_classified "a backend failure behind a zero exit is caught" \
            0 "rapid scan is failed with status code 500" 70 downstream-scan-error

          # Finding text followed by a request failure, exit 1: the scan failed and stays failed.
          expect_classified "finding text never lowers a non-zero exit" \
            1 $'FAILURE_POLICY_VIOLATION\nHTTP 503 Service Unavailable' 1 scanner-error
          expect_classified "a findings summary never lowers a non-zero exit" \
            1 "Scan job found 3 vulnerabilities" 1 scanner-error
          expect_classified "a backend failure keeps its own exit code" \
            2 "stateless scan is failed with status code 502" 2 downstream-scan-error
          expect_classified "a named failure keeps its category under finding text" \
            1 $'FAILURE_POLICY_VIOLATION\nCharon request failed: HTTP 403' 1 charon-gateway-error

          # The status file keeps the scanner's own exit code beside the effective one.
          run_classify 0 "rapid scan is failed with status code 500"
          if python3 -c 'import json, sys; s = json.load(open(sys.argv[1])); sys.exit((s["scanner_exit_code"], s["effective_status"]) != (0, 70))' \
              "$work/out/scanner-status.json"; then
            echo "✓ scanner-status.json records the raw exit code apart from the effective status"
          else
            echo "::error::scanner-status.json does not keep the raw exit code apart from the effective status"
            failures=$((failures+1))
          fi
          if grep -qF "::error::Scanner: ERROR: sanitized scanner reason" "$work/log.txt"; then
            echo "✓ a failed scan puts the scanner's own reason in the log"
          else
            echo "::error::a failed scan did not surface the sanitized scanner error line"
            failures=$((failures+1))
          fi

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} classification case(s) failed"
            exit 1
          fi
          echo "All classification cases passed."

      - name: Assert the report validator fails closed on unsafe reports
        env:
          REPORT_GATE: ${{ runner.temp }}/report.sh
        run: |
          set -uo pipefail
          failures=0
          fixtures="$RUNNER_TEMP/report-fixtures"
          rm -rf "$fixtures"

          # Credential-shaped fixtures are built here rather than committed, so the repository's
          # own secret scan has nothing to find in this file.
          python3 - "$fixtures" <<'PY'
          import base64, json, pathlib, sys

          def b64(raw):
              return base64.urlsafe_b64encode(raw.encode()).decode().rstrip("=")

          jwt = ".".join(b64(part) for part in (
              '{"alg":"HS256","typ":"JWT"}', '{"sub":"contract-test"}', "not-a-real-signature"))
          opaque = b64("contract-test-value-not-a-real-credential")

          fixtures = {
              "empty": [],
              "findings": {"Data": [{"Severity": "HIGH", "Package Name": "left-pad"},
                                    {"Severity": "high", "Package Name": "right-pad"},
                                    {"Severity": "Low", "Package Name": "mid-pad"}]},
              "unsupported-shape": {"summary": "no findings list here"},
              # The envelope newer scanners emit. "filtered" has the allowlist and approved
              # exceptions applied; "raw" has not, so enforcement must read "filtered".
              "envelope-empty": {"raw": [], "filtered": [],
                                 "nspectVerified": False, "exceptionTrackerChecked": False},
              "envelope-findings": {"raw": [{"Severity": "HIGH", "Package Name": "left-pad"},
                                            {"Severity": "LOW", "Package Name": "right-pad"}],
                                    "filtered": [{"Severity": "HIGH", "Package Name": "left-pad"}],
                                    "nspectVerified": True, "exceptionTrackerChecked": True},
              "envelope-all-excepted": {"raw": [{"Severity": "CRITICAL", "Package Name": "mid-pad"}],
                                        "filtered": [],
                                        "nspectVerified": True, "exceptionTrackerChecked": True},
              "envelope-verified": {"raw": [], "filtered": [],
                                    "nspectVerified": True, "exceptionTrackerChecked": True},
              "credential-key": {"Data": [{"Severity": "LOW", "api_token": "redacted-by-test"}]},
              "credential-key-camel": {"Data": [{"Severity": "LOW", "clientSecret": "redacted-by-test"}]},
              "jwt-value": {"Data": [{"Severity": "LOW", "evidence": jwt}]},
              "bearer-value": {"Data": [{"Severity": "LOW", "evidence": "Bearer " + opaque}]},
              "signed-url": {"Data": [{"Severity": "LOW",
                                       "evidence": "https://example.invalid/a?access_token=" + opaque}]},
          }
          root = pathlib.Path(sys.argv[1])
          for name, payload in fixtures.items():
              directory = root / name
              directory.mkdir(parents=True)
              (directory / "vulnerability-report.json").write_text(json.dumps(payload))
          (root / "missing").mkdir(parents=True)
          malformed = root / "malformed"
          malformed.mkdir(parents=True)
          (malformed / "vulnerability-report.json").write_text("{not json")
          PY

          # $2 sets nspect_id, selecting the registered lane; empty is the unregistered one.
          run_gate() {
            : > "$RUNNER_TEMP/out.txt"
            code=0
            PULSE_OSS_OUTPUT_DIR="$fixtures/$1" GITHUB_OUTPUT="$RUNNER_TEMP/out.txt" \
              INPUT_NSPECT_ID="${2:-}" \
              bash "$REPORT_GATE" > "$RUNNER_TEMP/log.txt" 2>&1 || code=$?
          }

          gate_output() { sed -n "s/^$1=//p" "$RUNNER_TEMP/out.txt"; }

          expect_accepted() {
            local name="$1" fixture="$2" want_count="$3" want_breakdown="$4" nspect="${5:-}"
            run_gate "$fixture" "$nspect"
            if [ "$code" -ne 0 ]; then
              echo "::error::${name}: expected acceptance, exited ${code}"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            local got_count got_breakdown
            got_count="$(gate_output finding_count)"
            got_breakdown="$(gate_output severity_breakdown)"
            if [ "$got_count" != "$want_count" ] || [ "$got_breakdown" != "$want_breakdown" ]; then
              echo "::error::${name}: got count='${got_count}' breakdown='${got_breakdown}', expected count='${want_count}' breakdown='${want_breakdown}'"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name} (${got_count} finding(s); ${got_breakdown})"
          }

          expect_refused() {
            local name="$1" fixture="$2" nspect="${3:-}"
            run_gate "$fixture" "$nspect"
            if [ "$code" -eq 0 ]; then
              echo "::error::${name}: expected the validator to refuse this report, but it passed"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name} — $(grep -m1 '::error::' "$RUNNER_TEMP/log.txt" | sed 's/^.*::error:://' | cut -c1-110)"
          }

          expect_unfiltered() {
            local name="$1" want="$2" got
            got="$(gate_output unfiltered_count)"
            if [ "$got" != "$want" ]; then
              echo "::error::${name}: got unfiltered_count='${got}', expected '${want}'"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name} (unfiltered: ${got:-not reported})"
          }

          expect_accepted "a clean report reports zero findings" empty 0 "not reported"
          expect_accepted "severities are tallied case-insensitively" findings 3 "high: 2, low: 1"

          # The envelope schema, and the guarantee that enforcement reads the filtered list.
          expect_accepted "an empty envelope reports zero findings" envelope-empty 0 "not reported"
          expect_accepted "an envelope counts only filtered findings" envelope-findings 1 "high: 1"
          expect_unfiltered "the envelope surfaces the pre-exception count" 2
          expect_accepted "a fully excepted envelope blocks nothing" envelope-all-excepted 0 "not reported"
          expect_unfiltered "an excepted finding is still surfaced" 1

          expect_refused "a missing report"                    missing
          expect_refused "a malformed report"                  malformed
          expect_refused "a report with no findings list"      unsupported-shape
          expect_refused "a credential-like field name"        credential-key
          expect_refused "a camelCase credential-like field"   credential-key-camel
          expect_refused "an embedded JWT"                     jwt-value
          expect_refused "an embedded bearer token"            bearer-value
          expect_refused "a signed URL"                        signed-url

          # An empty findings list is only a pass if the backend was actually consulted.
          expect_refused "an unverified envelope on a registered scan" envelope-empty NSPECT-0000-0000
          expect_accepted "a verified envelope on a registered scan" envelope-verified 0 "not reported" NSPECT-0000-0000
          expect_accepted "an unverified envelope passes unregistered" envelope-empty 0 "not reported"

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} report-validation case(s) failed"
            exit 1
          fi
          echo "All report-validation cases passed."

      - name: Assert enforcement blocks and warns per failure_policy
        env:
          ENFORCE: ${{ runner.temp }}/enforce.sh
        run: |
          set -uo pipefail
          failures=0

          # run <policy> <findings> <report-status> <effective-status> [category] [unfiltered] -> sets $code
          run_enforce() {
            code=0
            FAILURE_POLICY="$1" FINDING_COUNT="$2" REPORT_STATUS="$3" EFFECTIVE_STATUS="$4" \
              DIAGNOSTIC_CATEGORY="${5:-none}" UNFILTERED_COUNT="${6:-}" \
              bash "$ENFORCE" > "$RUNNER_TEMP/log.txt" 2>&1 || code=$?
          }

          # expect <pass|fail> <name> <policy> <findings> <report-status> <effective-status> [category] [unfiltered]
          expect() {
            local want="$1" name="$2"; shift 2
            run_enforce "$@"
            if [ "$want" = pass ] && [ "$code" -ne 0 ]; then
              echo "::error::${name}: expected the job to pass, exited ${code}"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            if [ "$want" = fail ] && [ "$code" -eq 0 ]; then
              echo "::error::${name}: expected the job to FAIL, but enforcement passed it"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            echo "✓ ${name}"
          }

          # assert_message <name> <substring> <policy> <findings> <report-status> <status> [category] [unfiltered]
          # Several branches here fail closed, so an exit code alone does not prove the right
          # one fired — and which one fired is what the operator reads to diagnose the run.
          assert_message() {
            local name="$1" needle="$2"; shift 2
            run_enforce "$@"
            if grep -qF "$needle" "$RUNNER_TEMP/log.txt"; then
              echo "✓ ${name}"; return
            fi
            echo "::error::${name}: expected the outcome to be reported as '${needle}'. Got: $(grep -m1 -E '::(error|warning|notice)::' "$RUNNER_TEMP/log.txt")"
            failures=$((failures+1))
          }

          # This is the negative a live job cannot express: the pass signal is a failing job.
          expect fail "fail-on-vulnerability blocks on a finding" \
            fail-on-vulnerability 10 success 0
          expect pass "fail-on-vulnerability passes a clean scan" \
            fail-on-vulnerability 0 success 0
          expect pass "report-only warns on findings instead of blocking" \
            report-only 10 success 0
          expect pass "report-only passes a clean scan" \
            report-only 0 success 0

          # Fail-closed: neither policy may pass a scan that did not produce a safe report.
          expect fail "an aborted scan blocks under report-only" \
            report-only 0 skipped "" none
          expect fail "a scanner error blocks under report-only" \
            report-only 0 skipped 70 downstream-scan-error
          expect fail "a scanner error blocks under fail-on-vulnerability" \
            fail-on-vulnerability 0 skipped 70 downstream-scan-error
          expect fail "an unsafe report blocks under report-only" \
            report-only 0 failure 0
          expect fail "an unsafe report blocks under fail-on-vulnerability" \
            fail-on-vulnerability 0 failure 0

          # Findings never rescue a failed scan, under either policy.
          expect fail "a failed scan blocks under report-only even with findings" \
            report-only 10 success 1 scanner-error
          expect fail "a failed scan blocks under fail-on-vulnerability even with findings" \
            fail-on-vulnerability 10 success 1 scanner-error

          # A policy violation must be accounted for by the report, before or after exceptions.
          expect fail "a policy violation with an empty report is not a pass" \
            report-only 0 success 0 vulnerability-policy
          expect pass "a policy violation whose findings were all excepted passes" \
            report-only 0 success 0 vulnerability-policy 1
          expect pass "a policy violation with findings warns under report-only" \
            report-only 10 success 0 vulnerability-policy
          expect fail "a policy violation with findings blocks under fail-on-vulnerability" \
            fail-on-vulnerability 10 success 0 vulnerability-policy

          # Several branches fail closed, so the message shows which one fired.
          assert_message "a failed scan is reported as the cause, not its findings" \
            "(scanner-error)" fail-on-vulnerability 10 success 1 scanner-error
          assert_message "an unexplained policy violation says so" \
            "holds no findings to account for it" report-only 0 success 0 vulnerability-policy
          assert_message "a blocked scan names the policy it violated" \
            "violate failure_policy=fail-on-vulnerability" fail-on-vulnerability 10 success 0
          assert_message "report-only findings surface as a warning" \
            "::warning::"          report-only 10 success 0
          assert_message "a clean scan says so explicitly" \
            "no vulnerability findings" report-only 0 success 0
          assert_message "an aborted scan is reported as never having completed" \
            "did not run to completion" report-only 0 skipped "" none
          assert_message "a scanner failure names its diagnostic category" \
            "(downstream-scan-error)" report-only 0 skipped 70 downstream-scan-error

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} enforcement case(s) failed"
            exit 1
          fi
          echo "All enforcement cases passed."

  # Security suite — preflight gating contract.
  #
  # The suite's companion-input errors (enable-* without the input that scan needs) are
  # rejections, so asserting them through a real suite call would redden the run. Extracted
  # and driven here instead, which also back-fills coverage for the pre-existing SAST case.
  # ============================================================================
  security-suite-preflight-contract:
    name: Security suite preflight — contract tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.x'

      - name: Extract the preflight from security-suite.yml
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python - <<'PY'
          import os, pathlib, yaml
          workflow = yaml.safe_load(pathlib.Path(".github/workflows/security-suite.yml").read_text())
          steps = {step["name"]: step for step in workflow["jobs"]["preflight"]["steps"]}
          pathlib.Path(os.environ["RUNNER_TEMP"], "preflight.sh").write_text(
              steps["Report suite selection"]["run"])
          PY
          test -s "$RUNNER_TEMP/preflight.sh"

      - name: Assert the preflight names every missing companion input
        env:
          PREFLIGHT: ${{ runner.temp }}/preflight.sh
        run: |
          set -uo pipefail
          failures=0

          # run_preflight <secret> <vuln> <malware> <sast> <nspect-id> <languages> -> sets $code
          run_preflight() {
            code=0
            ENABLE_SECRET_SCAN="$1" ENABLE_VULN_SCAN="$2" ENABLE_MALWARE_SCAN="$3" \
              ENABLE_SAST_SCAN="$4" NSPECT_ID="$5" SAST_LANGUAGES="$6" \
              bash "$PREFLIGHT" > "$RUNNER_TEMP/log.txt" 2>&1 || code=$?
          }

          expect_pass() {
            local name="$1"; shift
            run_preflight "$@"
            if [ "$code" -ne 0 ]; then
              echo "::error::${name}: expected the preflight to pass, exited ${code}"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            echo "✓ ${name}"
          }

          expect_fail() {
            local name="$1" needle="$2"; shift 2
            run_preflight "$@"
            if [ "$code" -eq 0 ]; then
              echo "::error::${name}: expected the preflight to fail, but it passed"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            if ! grep -qF "$needle" "$RUNNER_TEMP/log.txt"; then
              echo "::error::${name}: error did not mention '${needle}'"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            echo "✓ ${name}"
          }

          # A suite that enables nothing warns and stays green — it is useless, not broken.
          run_preflight false false false false '' ''
          if [ "$code" -ne 0 ]; then
            echo "::error::an empty suite selection must warn, not fail"; failures=$((failures+1))
          elif ! grep -q '::warning::' "$RUNNER_TEMP/log.txt"; then
            echo "::error::an empty suite selection must emit a warning"; failures=$((failures+1))
          else
            echo "✓ an empty suite selection warns and stays green"
          fi

          expect_pass "enable-vuln-scan needs no companion input" false true  false false '' ''
          expect_pass "a complete malware selection is accepted"  false false true  false NSPECT-ABCD-1234 ''
          expect_pass "a complete SAST selection is accepted"     false false false true  '' '["actions"]'
          expect_pass "secret-only needs no companion input"      true  false false false '' ''

          expect_fail "enable-malware-scan without an nSpect id is refused" \
            nspect-id             false false true  false '' ''
          expect_fail "enable-sast-scan without languages is refused" \
            sast-languages        false false false true  '' ''

          # Both missing inputs are reported in a single run.
          run_preflight false false true true '' ''
          if [ "$code" -eq 0 ]; then
            echo "::error::two missing companion inputs must fail"; failures=$((failures+1))
          elif ! grep -qF nspect-id "$RUNNER_TEMP/log.txt" \
             || ! grep -qF sast-languages "$RUNNER_TEMP/log.txt"; then
            echo "::error::both missing companion inputs must be named in one run"
            cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1))
          else
            echo "✓ two missing companion inputs are both named in one run"
          fi

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} preflight case(s) failed"
            exit 1
          fi
          echo "All preflight cases passed."

  # ============================================================================
  # Vulnerability scan (Pulse OSS) — live integration.
  #
  # Ungated on purpose: these run on every push, so a regression in the scan surfaces here
  # rather than behind a variable somebody has to remember to flip. That makes the scan's
  # prerequisites hard requirements for this repository, not optional extras — the Vault
  # variables must be visible, the pinned scanner image must be pullable with the credentials
  # they issue, and the triggering ref must appear in this repository's Charon tenant
  # allowed_refs. Charon authorizes per ref, and a ref it does not list is refused as an
  # nSpect HTTP 403, so CI covers only the refs the tenant lists: pushes to main and the
  # copy-pr-bot refs/heads/pull-request/* mirrors.
  #
  # scan_mode is pinned to rapid rather than left on auto: auto resolves to persistent on
  # main, and a self-test must not create or update project state in the vulnerability
  # backend. Only the detection job uploads a report — artifact names carry the scan-path
  # slug, and two jobs scanning `.` in one run would otherwise collide on the same name.
  # ============================================================================

  # POSITIVE: a real scan of this repository's own manifests runs to completion.
  # It asserts the transport chain and a valid report, NOT a finding count — a repository's
  # real finding count is not a stable assertion, and a clean result here is indistinguishable
  # from nothing having been resolved. The detection job below is what proves detection.
  vuln-scan-pulse-oss-positive:
    name: Vulnerability scan (Pulse OSS) — positive
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/vuln-scan-pulse-oss.yml
    with:
      scan_mode: rapid
      failure_policy: report-only

  # NEGATIVE (detection): ci_test_setup plants a manifest pinning a dependency with published
  # advisories, so a zero-finding result is a defect rather than good news. report-only keeps
  # the job GREEN; the assertion below is what converts a silent zero into a hard error.
  vuln-scan-pulse-oss-detection:
    name: Vulnerability scan (Pulse OSS) — negative (must report findings, staying green)
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/vuln-scan-pulse-oss.yml
    with:
      scan_mode: rapid
      failure_policy: report-only
      ci_test_setup: true
      scan_path: .pulse-oss-selftest
      build: true  # Maven resolves its dependency graph only through a build
      upload_report: true

  vuln-scan-assert-outcomes:
    name: Vulnerability scan — assert both outcomes
    needs: [vuln-scan-pulse-oss-positive, vuln-scan-pulse-oss-detection]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a completed positive scan and a detected finding
        env:
          POSITIVE_MODE: ${{ needs.vuln-scan-pulse-oss-positive.outputs.resolved_mode }}
          POSITIVE_EXIT: ${{ needs.vuln-scan-pulse-oss-positive.outputs.scanner_exit_code }}
          POSITIVE_DIGEST: ${{ needs.vuln-scan-pulse-oss-positive.outputs.scanner_image_digest }}
          DETECTION_COUNT: ${{ needs.vuln-scan-pulse-oss-detection.outputs.finding_count }}
          DETECTION_DIGEST: ${{ needs.vuln-scan-pulse-oss-detection.outputs.scanner_image_digest }}
        run: |
          set -euo pipefail
          failures=0
          if ! [[ "$POSITIVE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || [ "$POSITIVE_DIGEST" != "$DETECTION_DIGEST" ]; then
            echo "::error::The scans did not record the pinned scanner digest (positive '${POSITIVE_DIGEST}', detection '${DETECTION_DIGEST}')."
            failures=$((failures + 1))
          fi
          if [ "$POSITIVE_MODE" != rapid ]; then
            echo "::error::The positive scan resolved to '${POSITIVE_MODE}', not rapid. A self-test must not create backend state."
            failures=$((failures + 1))
          fi
          if [ "$POSITIVE_EXIT" != 0 ]; then
            echo "::error::The positive scan reported scanner exit '${POSITIVE_EXIT}'."
            failures=$((failures + 1))
          fi
          if ! [[ "$DETECTION_COUNT" =~ ^[0-9]+$ ]] || (( DETECTION_COUNT < 1 )); then
            echo "::error::The vulnerable fixture reported '${DETECTION_COUNT:-nothing}'. A clean result here means the scan resolved no components, not that the dependency is safe."
            failures=$((failures + 1))
          fi
          [ "$failures" -eq 0 ] || exit 1
          echo "::notice::Transport proven (positive scan completed) and detection proven (${DETECTION_COUNT} finding(s) from the controlled fixture) with scanner ${POSITIVE_DIGEST}."

  # Suite passthrough for the vulnerability scan. Separate from security-suite-dogfood, which
  # stays behind ENABLE_PULSE_INTEGRATION for the secret scan.
  security-suite-vuln-dogfood:
    name: Security suite (vulnerability scan) — self test
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/security-suite.yml
    with:
      enable-vuln-scan: true
      vuln-scan-mode: rapid
      vuln-failure-policy: report-only

  # ============================================================================
  # Malware scan (Pulse) — contract tests.
  #
  # Runs the four gate scripts extracted by step name from malware-scan-pulse.yml. Covers what
  # a live scan cannot: rejection paths, every exit-code and report-status pairing, and
  # blocking verdicts, whose expected outcome is a failing job.
  # ============================================================================
  malware-scan-contract:
    name: Malware scan — contract tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.x'

      - name: Extract the gates from malware-scan-pulse.yml
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python - <<'PY'
          import os, pathlib, yaml
          workflow = yaml.safe_load(pathlib.Path(".github/workflows/malware-scan-pulse.yml").read_text())
          job = workflow["jobs"]["pulse-malware"]
          steps = {step["name"]: step for step in job["steps"]}
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          for filename, step_name in {
              "contract.sh": "Validate scan contract",
              "classify.sh": "Classify scan result",
              "report.sh": "Validate scan report",
              "enforce.sh": "Enforce scan result",
          }.items():
              # A renamed step raises KeyError rather than leaving its gate untested.
              (temp / filename).write_text(steps[step_name]["run"])
          # Read the allowed registry from the workflow rather than duplicating it.
          (temp / "job-env.sh").write_text(
              "ALLOWED_REGISTRY=%s\n" % job["env"]["SCANNER_IMAGE_ALLOWED_REGISTRY"])
          PY
          for f in contract.sh classify.sh report.sh enforce.sh job-env.sh; do
            test -s "$RUNNER_TEMP/$f"
          done

      - name: Assert the scan contract accepts and rejects the right inputs
        env:
          CONTRACT: ${{ runner.temp }}/contract.sh
        run: |
          set -uo pipefail
          # shellcheck disable=SC1091
          . "$RUNNER_TEMP/job-env.sh"
          failures=0
          # Placeholder namespace: the guard checks only the registry host, and the internal
          # path is kept out of this public repository.
          IMAGE_PATH="${ALLOWED_REGISTRY}/0000000000000000/pulse/pulse-malware-scanner-cli"
          GOOD_IMAGE="${IMAGE_PATH}:1.2.0-alpha6"
          GOOD_SHA=0123456789abcdef0123456789abcdef01234567

          # Each case starts from a valid contract and overrides only the field under test.
          reset_case() {
            EVENT=push; REPOSITORY=NVIDIA/security-workflows; SHA="$GOOD_SHA"
            IMAGE_REF="$GOOD_IMAGE"; CLIENT_VERSION=auto
            OIDC_URL=https://oidc.example.invalid/token; OIDC_TOKEN=placeholder-not-a-real-token
            VAULT_URL=https://vault.example.invalid
            CHARON_PROXY=proxy.example.invalid:443
            CHARON_JOIN=charon-test-token; CHARON_APP=charon-test-app; CHARON_PORT=8888
            NSPECT_ID=NSPECT-ABCD-1234; FAILURE_POLICY=strict
          }

          run_contract() {
            : > "$RUNNER_TEMP/out.txt"
            : > "$RUNNER_TEMP/env.txt"
            code=0
            GITHUB_EVENT_NAME="$EVENT" GITHUB_REPOSITORY="$REPOSITORY" GITHUB_SHA="$SHA" \
            GITHUB_ENV="$RUNNER_TEMP/env.txt" GITHUB_OUTPUT="$RUNNER_TEMP/out.txt" \
            ACTIONS_ID_TOKEN_REQUEST_URL="$OIDC_URL" \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN="$OIDC_TOKEN" \
            SCANNER_IMAGE_REF="$IMAGE_REF" SCANNER_IMAGE_ALLOWED_REGISTRY="$ALLOWED_REGISTRY" \
            CHARON_CLIENT_VERSION="$CLIENT_VERSION" \
            NV_VAULT_URL="$VAULT_URL" NVCR_VAULT_ROLE=role NVCR_VAULT_JWT_PATH=jwt-path \
            NVCR_VAULT_NAMESPACE=namespace NVCR_VAULT_SECRET_PATH=secret/path \
            CHARON_PROXY_SERVER="$CHARON_PROXY" \
            CHARON_JOIN_TOKEN="$CHARON_JOIN" CHARON_APP_NAME="$CHARON_APP" \
            CHARON_LOCAL_PORT="$CHARON_PORT" \
            INPUT_NSPECT_ID="$NSPECT_ID" INPUT_FAILURE_POLICY="$FAILURE_POLICY" \
              bash "$CONTRACT" > "$RUNNER_TEMP/log.txt" 2>&1 || code=$?
          }

          # contract_value <key> [out|env] — the step's outputs, or what it exported.
          contract_value() { sed -n "s/^$1=//p" "$RUNNER_TEMP/${2:-out}.txt"; }

          # expect_ok <name> [<key> <expected-value> [out|env]]
          expect_ok() {
            local name="$1" key="${2:-}" want="${3:-}" file="${4:-out}"
            run_contract
            if [ "$code" -ne 0 ]; then
              echo "::error::${name}: expected the contract to accept this, exited ${code}"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            if [ -n "$key" ]; then
              local got; got="$(contract_value "$key" "$file")"
              if [ "$got" != "$want" ]; then
                echo "::error::${name}: ${key} was '${got}', expected '${want}'"
                failures=$((failures+1)); return
              fi
              echo "✓ ${name} (${key}=${got})"; return
            fi
            echo "✓ ${name}"
          }

          # expect_rejected <name> <expected error substring>
          expect_rejected() {
            local name="$1" needle="$2"
            run_contract
            if [ "$code" -eq 0 ]; then
              echo "::error::${name}: expected the contract to reject this, but it succeeded"
              failures=$((failures+1)); return
            fi
            if ! grep -q '::error::' "$RUNNER_TEMP/log.txt"; then
              echo "::error::${name}: failed without an actionable ::error:: message"
              failures=$((failures+1)); return
            fi
            if ! grep -qF "$needle" "$RUNNER_TEMP/log.txt"; then
              echo "::error::${name}: error did not mention '${needle}'. Got: $(grep -m1 '::error::' "$RUNNER_TEMP/log.txt")"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name} — $(grep -m1 '::error::' "$RUNNER_TEMP/log.txt" | sed 's/^::error:://' | cut -c1-110)"
          }

          reset_case; expect_ok "the scan target is this run's repository" \
            repository_uri git@github.com:NVIDIA/security-workflows.git
          reset_case; expect_ok "the scan target is this run's commit" commit_sha "$GOOD_SHA"
          reset_case; FAILURE_POLICY=malicious-only
          expect_ok  "failure_policy malicious-only is accepted"
          reset_case; CLIENT_VERSION=17.1.2
          expect_ok  "a pinned tunnel client version is accepted"
          reset_case; IMAGE_REF="${IMAGE_PATH}:1.2.0"
          expect_ok  "an alternative valid tag is accepted"

          # Two calls in one run must not collide on artifact or container names.
          reset_case; run_contract; first="$(contract_value call_id)"
          run_contract; second="$(contract_value call_id)"
          if ! [[ "$first" =~ ^[0-9a-f]{8}$ ]] || [ "$first" = "$second" ]; then
            echo "::error::call_id must be 8 hex characters and differ per call; got '${first}' then '${second}'"
            failures=$((failures+1))
          else
            echo "✓ each call draws its own call_id (${first}, ${second})"
          fi

          # Fork-authored code must never reach a job holding OIDC.
          reset_case; EVENT=pull_request
          expect_rejected "pull_request is refused"        "not a trusted trigger"
          reset_case; EVENT=pull_request_target
          expect_rejected "pull_request_target is refused" "not a trusted trigger"

          # A missing variable is named before the Vault action or the tunnel fails on it.
          reset_case; VAULT_URL=
          expect_rejected "a missing Vault variable is named" "NV_VAULT_URL"
          reset_case; CHARON_PROXY=
          expect_rejected "a missing Charon proxy variable is named" \
            "Missing Actions variable(s): CHARON_PROXY_SERVER."

          reset_case; IMAGE_REF="registry.invalid/0000000000000000/pulse/pulse-malware-scanner-cli:1.2.0"
          expect_rejected "a foreign registry is rejected"        "hosted on"
          # The registry match is anchored and its dot is literal.
          reset_case; IMAGE_REF="registry.invalid/${GOOD_IMAGE}"
          expect_rejected "the allowed host behind another host is rejected" "hosted on"
          reset_case; IMAGE_REF="nvcrXio/0000000000000000/pulse/pulse-malware-scanner-cli:1.2.0"
          expect_rejected "a lookalike host is rejected"          "hosted on"
          reset_case; IMAGE_REF=":1.2.0"
          expect_rejected "an unset image variable is rejected"   "MALWARE_SCAN_PULSE_IMAGE"
          reset_case; IMAGE_REF="${IMAGE_PATH}:"
          expect_rejected "an unset tag variable is rejected"     "MALWARE_SCAN_PULSE_IMAGE_TAG"
          # A tag cannot carry a second reference.
          reset_case; IMAGE_REF="${IMAGE_PATH}:latest@sha256:${GOOD_SHA}${GOOD_SHA:0:24}"
          expect_rejected "a tag smuggling a digest is rejected"  "carry a valid tag"

          reset_case; CLIENT_VERSION=latest
          expect_rejected "a non-semver tunnel client version is rejected" "bare semantic version"
          reset_case; CLIENT_VERSION=1.2.3-..%2Fevil
          expect_rejected "a traversal in the client version is rejected"  "bare semantic version"

          # Charon values are interpolated into tbot's YAML config and must match their shapes.
          reset_case; CHARON_PROXY=proxy.example.invalid:99999
          expect_rejected "a Charon proxy port above the TCP range is rejected" "port from 1 to 65535"
          reset_case; CHARON_PROXY=proxy.example.invalid/path:443
          expect_rejected "a malformed Charon proxy is rejected" \
            "CHARON_PROXY_SERVER must be a host:port value"
          reset_case; CHARON_PROXY=proxy.example.invalid
          expect_rejected "a Charon proxy without a port is rejected" \
            "CHARON_PROXY_SERVER must be a host:port value"
          reset_case; CHARON_JOIN="$(printf 'charon\nrunners')"
          expect_rejected "a Charon join token with a control character is rejected" "JOIN_TOKEN"
          reset_case; CHARON_APP="-charon"
          expect_rejected "a Charon app name with a leading dash is rejected" "APP_NAME"
          reset_case; CHARON_PORT=80
          expect_rejected "a privileged Charon local port is rejected" "unprivileged TCP port"
          reset_case; CHARON_PORT=not-a-port
          expect_rejected "a non-numeric Charon local port is rejected" "unprivileged TCP port"

          reset_case; OIDC_URL=
          expect_rejected "a caller without id-token: write is rejected" "id-token: write"

          reset_case; NSPECT_ID=NSPECT-BAD
          expect_rejected "a malformed nSpect id is rejected" "must be a valid nSpect ID"
          # The CLI accepts uppercase IDs only.
          reset_case; NSPECT_ID=NSPECT-abcd-1234
          expect_rejected "a lowercase nSpect id is rejected" "must be a valid nSpect ID"
          reset_case; FAILURE_POLICY=warn
          expect_rejected "an unknown failure_policy is rejected" "failure_policy must be"

          # The scan target comes from the run context but is still validated before the
          # service clones it.
          reset_case; SHA=0123456
          expect_rejected "an abbreviated commit SHA is rejected" "full 40-character commit SHA"
          reset_case; REPOSITORY=NVIDIA/nested/path
          expect_rejected "a nested repository path is rejected" "not a repository the scanner accepts"
          reset_case; REPOSITORY=NVIDIA/..
          expect_rejected "a dot-dot repository name is rejected" "not a repository the scanner accepts"

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} contract case(s) failed"
            exit 1
          fi
          echo "All contract cases passed."

      - name: Assert classification reconciles the exit code with the report
        env:
          CLASSIFY: ${{ runner.temp }}/classify.sh
        run: |
          set -uo pipefail
          failures=0
          cases="$RUNNER_TEMP/classify-cases"
          rm -rf "$cases"

          # Credential-shaped fixtures are generated at run time so the repository's secret scan
          # has nothing to flag.
          python3 - "$cases" <<'PY'
          import base64, json, pathlib, sys

          def b64(raw):
              return base64.urlsafe_b64encode(raw.encode()).decode().rstrip("=")

          jwt = ".".join(b64(part) for part in (
              '{"alg":"HS256","typ":"JWT"}', '{"sub":"contract-test"}', "not-a-real-signature"))
          opaque = b64("contract-test-value-not-a-real-credential")
          cli_log = json.dumps({"level": "info", "msg": "source-code scan submitted",
                                "scan_id": "0f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0",
                                "versionCLI": "1.2.0-alpha6"}) + "\n"
          cases = {
              # name: (report status, or None for no report; raw scanner output)
              "clean": ("CLEAN", "✅\tFetched report for source-code malware scan."),
              "malicious": ("MALICIOUS", "✅\tVerified nSpect ID 'NSPECT-ABCD-1234'.\n"
                                         "❌\tSource-code scan is MALICIOUS."),
              "suspicious": ("SUSPICIOUS", "❌\tSource-code scan is SUSPICIOUS."),
              "failed": ("FAILED", "❌\tSource-code scan FAILED."),
              "analyzing": ("ANALYZING", "❌\tSource-code scan has unknown status: ANALYZING"),
              "injected": ("CLEAN\nverdict=MALICIOUS", "✅\tFetched report."),
              "no-report": (None, "❌\tFailed to submit source-code scan request."),
              "connectivity": (None, "❌\tFailed to connect to dependent services."),
              "panic": (None, "panic: output-dir must be set with equals sign\n\n"
                              "goroutine 1 [running]:"),
              "old-image": (None, 'Error: unknown command "source-code-scan" for '
                                  '"pulse-malware-scanner-cli"'),
              "leaky": (None, "❌\tnSpect ID 'NSPECT-ABCD-1234' rejected: Authorization: Bearer "
                              + opaque + " with token " + jwt),
          }
          root = pathlib.Path(sys.argv[1])
          for name, (status, raw) in cases.items():
              directory = root / name
              directory.mkdir(parents=True)
              if status is not None:
                  (directory / "malware_report.json").write_text(
                      json.dumps({"success": True, "data": {"status": status, "report": []}}))
              (directory / "pulse-cli.log").write_text(cli_log)
              (directory / "raw.log").write_text(raw + "\n")
          malformed = root / "malformed"
          malformed.mkdir(parents=True)
          (malformed / "malware_report.json").write_text("{not json")
          (malformed / "raw.log").write_text("\n")

          # A distinct value per position, so a leaked value identifies the pattern that missed it.
          fake = {name: b64(f"contract-test-{name}") for name in (
              "token", "proxy", "session", "csrf", "cookie", "amz-credential", "amz-signature",
              "amz-security-token", "goog-credential", "goog-signature", "azure-signature",
              "cli-authorization", "cli-cookie")}
          fake["basic"] = base64.b64encode(b"contract-test-user:contract-test-pass").decode()
          headers = root / "headers"
          headers.mkdir(parents=True)
          (headers / "raw.log").write_text("\n".join((
              "❌\tFailed to connect to dependent services.",
              "Authorization: Basic " + fake["basic"],
              "Authorization: Token " + fake["token"],
              "Proxy-Authorization: Bearer " + fake["proxy"],
              f"Cookie: session={fake['session']}; csrftoken={fake['csrf']}",
              f"Set-Cookie: auth={fake['cookie']}; HttpOnly; Secure",
              "Download: https://objects.example.invalid/blob"
              f"?X-Amz-Credential={fake['amz-credential']}&X-Amz-Signature={fake['amz-signature']}"
              f"&X-Amz-Security-Token={fake['amz-security-token']}",
              "GCS: https://storage.example.invalid/blob"
              f"?X-Goog-Credential={fake['goog-credential']}&X-Goog-Signature={fake['goog-signature']}",
              f"Azure: https://blob.example.invalid/blob?sig={fake['azure-signature']}&se=2099-01-01",
          )) + "\n")
          (headers / "pulse-cli.log").write_text(cli_log + json.dumps({
              "level": "error", "msg": "request failed",
              "authorization": "Bearer " + fake["cli-authorization"],
              "cookie": "session=" + fake["cli-cookie"]}) + "\n")
          (root / "headers.forbidden").write_text("\n".join(fake.values()) + "\n")
          PY

          # run_classify <case> <scanner-exit> -> sets $code
          run_classify() {
            : > "$RUNNER_TEMP/out.txt"
            code=0
            SCANNER_EXIT="$2" PULSE_MALWARE_OUTPUT_DIR="$cases/$1" \
              PULSE_MALWARE_RAW_LOG="$cases/$1/raw.log" INPUT_NSPECT_ID=NSPECT-ABCD-1234 \
              GITHUB_OUTPUT="$RUNNER_TEMP/out.txt" \
              bash "$CLASSIFY" > "$RUNNER_TEMP/log.txt" 2>&1 || code=$?
          }

          classify_output() { sed -n "s/^$1=//p" "$RUNNER_TEMP/out.txt"; }

          # expect_class <name> <case> <scanner-exit> <completed>/<verdict>/<category>
          expect_class() {
            local name="$1" want="$4"
            run_classify "$2" "$3"
            if [ "$code" -ne 0 ]; then
              echo "::error::${name}: classification itself failed, exited ${code}"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            local got
            got="$(classify_output completed)/$(classify_output verdict)/$(classify_output diagnostic_category)"
            if [ "$got" != "$want" ]; then
              echo "::error::${name}: got ${got}, expected ${want}"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name} (${got})"
          }

          # A verdict stands only where the exit code and the report agree.
          expect_class "exit 0 with a CLEAN report is a CLEAN verdict" \
            clean 0 true/CLEAN/none
          expect_class "exit 5 with a MALICIOUS report is a MALICIOUS verdict" \
            malicious 5 true/MALICIOUS/none
          expect_class "exit 5 with a SUSPICIOUS report is a SUSPICIOUS verdict" \
            suspicious 5 true/SUSPICIOUS/none
          # Exit 5 is shared, so only the report can tell a failed scan from a detection.
          expect_class "exit 5 with a FAILED report is a scan failure" \
            failed 5 false/FAILED/scan-failed
          expect_class "exit 5 without a report is a scan error" \
            no-report 5 false/unavailable/scan-error
          expect_class "exit 5 with a malformed report is a scan error" \
            malformed 5 false/unavailable/scan-error
          expect_class "exit 5 with a status the CLI does not know is unexpected" \
            analyzing 5 false/ANALYZING/unexpected-status
          # Disagreement fails closed in both directions.
          expect_class "exit 0 with a MALICIOUS report does not stand" \
            malicious 0 false/MALICIOUS/unexpected-status
          expect_class "exit 5 with a CLEAN report does not stand" \
            clean 5 false/CLEAN/unexpected-status
          expect_class "exit 0 without a report does not pass" \
            no-report 0 false/unavailable/report-unavailable
          expect_class "a status that is not a bare word is unrecognized" \
            injected 0 false/unrecognized/unexpected-status
          expect_class "exit 2 is a backend connectivity failure" \
            connectivity 2 false/unavailable/backend-connectivity
          expect_class "a panic is a crash, not a connectivity failure" \
            panic 2 false/unavailable/scanner-crashed
          expect_class "exit 4 is a timeout" \
            no-report 4 false/unavailable/timeout
          expect_class "exit 6 is a configuration or authorization error" \
            no-report 6 false/unavailable/configuration-or-authorization-error
          expect_class "an image without source-code-scan is named as such" \
            old-image 1 false/unavailable/scanner-version-unsupported
          expect_class "any other exit is a scanner error" \
            no-report 1 false/unavailable/scanner-error

          run_classify injected 0
          if [ "$(grep -c '^verdict=' "$RUNNER_TEMP/out.txt")" -ne 1 ]; then
            echo "::error::a multi-line report status must not add step outputs"
            failures=$((failures+1))
          else
            echo "✓ a multi-line report status adds no step outputs"
          fi

          # Clear the copy kept by the earlier disagreeing-exit-code case.
          rm -f "$cases/clean/scanner-output.log" "$cases/clean/pulse-cli.sanitized.log"
          run_classify clean 0
          if [ "$(classify_output scan_id)" != 0f1e2d3c-4b5a-6978-8796-a5b4c3d2e1f0 ] \
            || [ "$(classify_output scanner_version)" != 1.2.0-alpha6 ]; then
            echo "::error::the Pulse scan ID and scanner version must be read from pulse-cli.log"
            failures=$((failures+1))
          elif [ -e "$cases/clean/scanner-output.log" ]; then
            echo "::error::a CLEAN verdict must not keep a copy of the scanner output"
            failures=$((failures+1))
          else
            echo "✓ a CLEAN scan records the audit join key and keeps no output copy"
          fi

          run_classify malicious 5
          if ! grep -q '::stop-commands::' "$RUNNER_TEMP/log.txt"; then
            echo "::error::scanner output must be printed with workflow commands stopped"
            failures=$((failures+1))
          elif grep -qF NSPECT-ABCD-1234 "$cases/malicious/scanner-output.log" "$RUNNER_TEMP/log.txt"; then
            echo "::error::the nSpect ID must be redacted from the kept and the printed scanner output"
            failures=$((failures+1))
          else
            echo "✓ a detection prints redacted scanner output with workflow commands stopped"
          fi

          run_classify leaky 6
          if grep -qE 'eyJ|Bearer [^[]|NSPECT-ABCD-1234' \
            "$cases/leaky/scanner-output.log" "$RUNNER_TEMP/log.txt"; then
            echo "::error::credential-shaped scanner output must be redacted before it is kept or printed"
            failures=$((failures+1))
          elif ! grep -q '^::error::Scanner: ' "$RUNNER_TEMP/log.txt"; then
            echo "::error::a failed scan must surface an ::error:: excerpt"
            failures=$((failures+1))
          else
            echo "✓ a failed scan surfaces a redacted ::error:: excerpt"
          fi

          # Fully redacted output is kept; it is withheld only if a credential survives redaction.
          run_classify headers 2
          kept=("$cases/headers/scanner-output.log" "$cases/headers/pulse-cli.sanitized.log")
          if grep -qF -f "$cases/headers.forbidden" "${kept[@]}" "$RUNNER_TEMP/log.txt"; then
            echo "::error::header, cookie and signed-URL credentials must be redacted before they are kept or printed"
            failures=$((failures+1))
          elif grep -q 'output suppressed' "${kept[@]}"; then
            echo "::error::fully redacted output must be kept, not withheld as if a credential survived"
            failures=$((failures+1))
          elif ! grep -qF 'Authorization: Basic [REDACTED]' "${kept[0]}" \
            || ! grep -qF 'Cookie: [REDACTED]' "${kept[0]}" \
            || grep -qF '[REDACTED]]' "${kept[@]}"; then
            echo "::error::each credential must be replaced in place by a single [REDACTED] marker"
            failures=$((failures+1))
          else
            echo "✓ header, cookie and signed-URL credentials are redacted in place, not withheld"
          fi

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} classification case(s) failed"
            exit 1
          fi
          echo "All classification cases passed."

      - name: Assert the report validator counts, redacts and fails closed
        env:
          REPORT_GATE: ${{ runner.temp }}/report.sh
        run: |
          set -uo pipefail
          failures=0
          fixtures="$RUNNER_TEMP/report-fixtures"
          rm -rf "$fixtures"

          # Credential-shaped fixtures are generated at run time so the repository's secret scan
          # has nothing to flag.
          python3 - "$fixtures" <<'PY'
          import base64, json, pathlib, sys

          def b64(raw):
              return base64.urlsafe_b64encode(raw.encode()).decode().rstrip("=")

          jwt = ".".join(b64(part) for part in (
              '{"alg":"HS256","typ":"JWT"}', '{"sub":"contract-test"}', "not-a-real-signature"))

          def report(status, items=None, **extra):
              data = {"status": status, "metadata": {"nspect_id": "NSPECT-ABCD-1234"}, **extra}
              if items is not None:
                  data["report"] = items
              return {"success": True, "data": data}

          fixtures = {
              "clean": report("CLEAN", allowlist_applied=True, cache_info={"is_cached": True}),
              "malicious": report("MALICIOUS", [
                  {"classification": "MALICIOUS"}, {"classification": "malicious"},
                  {"classification": "SUSPICIOUS"}, {"classification": "GOODWARE"},
                  {"classification": None}]),
              "status-mismatch": report("MALICIOUS", []),
              "no-data": {"success": False, "errors": ["upstream"]},
              "items-not-a-list": report("CLEAN", {"classification": "GOODWARE"}),
              "credential-key": report("CLEAN", [{"classification": "GOODWARE",
                                                  "api_token": "redacted-by-test"}]),
              "jwt-value": report("CLEAN", [{"classification": "GOODWARE", "evidence": jwt}]),
          }
          root = pathlib.Path(sys.argv[1])
          for name, payload in fixtures.items():
              directory = root / name
              directory.mkdir(parents=True)
              (directory / "malware_report.json").write_text(json.dumps(payload))
          (root / "missing").mkdir(parents=True)
          malformed = root / "malformed"
          malformed.mkdir(parents=True)
          (malformed / "malware_report.json").write_text("{not json")
          PY

          # run_gate <fixture> <expected-verdict> [upload-report] -> sets $code
          run_gate() {
            : > "$RUNNER_TEMP/out.txt"
            code=0
            PULSE_MALWARE_OUTPUT_DIR="$fixtures/$1" EXPECTED_VERDICT="$2" \
              INPUT_UPLOAD_REPORT="${3:-false}" INPUT_NSPECT_ID=NSPECT-ABCD-1234 \
              GITHUB_OUTPUT="$RUNNER_TEMP/out.txt" \
              bash "$REPORT_GATE" > "$RUNNER_TEMP/log.txt" 2>&1 || code=$?
          }

          gate_output() { sed -n "s/^$1=//p" "$RUNNER_TEMP/out.txt"; }

          # expect_accepted <name> <fixture> <verdict> <flagged> <breakdown>
          expect_accepted() {
            local name="$1" want_count="$4" want_breakdown="$5"
            run_gate "$2" "$3"
            if [ "$code" -ne 0 ]; then
              echo "::error::${name}: expected acceptance, exited ${code}"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            local got_count got_breakdown
            got_count="$(gate_output flagged_count)"
            got_breakdown="$(gate_output classification_breakdown)"
            if [ "$got_count" != "$want_count" ] || [ "$got_breakdown" != "$want_breakdown" ]; then
              echo "::error::${name}: got count='${got_count}' breakdown='${got_breakdown}', expected count='${want_count}' breakdown='${want_breakdown}'"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name} (${got_count} flagged; ${got_breakdown})"
          }

          # expect_refused <name> <fixture> <verdict>
          expect_refused() {
            local name="$1"
            run_gate "$2" "$3"
            if [ "$code" -eq 0 ]; then
              echo "::error::${name}: expected the validator to refuse this report, but it passed"
              failures=$((failures+1)); return
            fi
            echo "✓ ${name} — $(grep -m1 '::error::' "$RUNNER_TEMP/log.txt" | sed 's/^.*::error:://' | cut -c1-110)"
          }

          expect_accepted "a CLEAN report with no items" clean CLEAN 0 "no items reported"
          expect_accepted "classifications are tallied case-insensitively" malicious MALICIOUS 3 \
            "goodware: 1, malicious: 2, suspicious: 1, unspecified: 1"

          run_gate clean CLEAN
          if [ "$(gate_output allowlist_applied)/$(gate_output cached)" != true/true ]; then
            echo "::error::the allowlist and cache state must be read from the report"
            failures=$((failures+1))
          else
            echo "✓ the allowlist and cache state are read from the report"
          fi

          expect_refused "a missing report"                    missing CLEAN
          expect_refused "a malformed report"                  malformed CLEAN
          expect_refused "a report without a data object"      no-data CLEAN
          expect_refused "a report status that contradicts the verdict" status-mismatch CLEAN
          expect_refused "report items that are not a list"    items-not-a-list CLEAN

          # The artifact copy is written only on request, with the nSpect ID redacted, and never
          # for a credential-shaped report.
          run_gate malicious MALICIOUS false
          if [ "$(gate_output artifact_ready)" != false ] \
            || [ -e "$fixtures/malicious/malware-scan-report.json" ]; then
            echo "::error::no artifact copy may be written unless upload_report is true"
            failures=$((failures+1))
          else
            echo "✓ no artifact copy is written without upload_report"
          fi
          run_gate malicious MALICIOUS true
          if [ "$(gate_output artifact_ready)" != true ]; then
            echo "::error::upload_report must produce an artifact copy"
            failures=$((failures+1))
          elif grep -qF NSPECT-ABCD-1234 "$fixtures/malicious/malware-scan-report.json"; then
            echo "::error::the artifact copy must not carry the nSpect ID"
            failures=$((failures+1))
          else
            echo "✓ the artifact copy is written with the nSpect ID redacted"
          fi
          for fixture in credential-key jwt-value; do
            run_gate "$fixture" CLEAN true
            if [ "$code" -ne 0 ]; then
              echo "::error::${fixture}: a credential-shaped report must withhold the artifact, not fail the verdict"
              failures=$((failures+1))
            elif [ "$(gate_output artifact_ready)" != false ] \
              || [ -e "$fixtures/$fixture/malware-scan-report.json" ]; then
              echo "::error::${fixture}: a credential-shaped report must not reach an artifact"
              failures=$((failures+1))
            elif ! grep -q '::warning::' "$RUNNER_TEMP/log.txt"; then
              echo "::error::${fixture}: withholding the artifact must warn"
              failures=$((failures+1))
            else
              echo "✓ ${fixture}: the artifact is withheld with a warning and the verdict stands"
            fi
          done

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} report-validation case(s) failed"
            exit 1
          fi
          echo "All report-validation cases passed."

      - name: Assert enforcement blocks and warns per failure_policy
        env:
          ENFORCE: ${{ runner.temp }}/enforce.sh
        run: |
          set -uo pipefail
          failures=0

          # run_enforce <policy> <scanner-exit> <completed> <verdict> <report-status> [category]
          run_enforce() {
            code=0
            FAILURE_POLICY="$1" SCANNER_EXIT="$2" SCAN_COMPLETED="$3" VERDICT="$4" \
              REPORT_STATUS="$5" DIAGNOSTIC_CATEGORY="${6:-none}" FLAGGED_COUNT=2 \
              bash "$ENFORCE" > "$RUNNER_TEMP/log.txt" 2>&1 || code=$?
          }

          # expect <pass|fail> <name> <run_enforce arguments...>
          expect() {
            local want="$1" name="$2"; shift 2
            run_enforce "$@"
            if [ "$want" = pass ] && [ "$code" -ne 0 ]; then
              echo "::error::${name}: expected the job to pass, exited ${code}"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            if [ "$want" = fail ] && [ "$code" -eq 0 ]; then
              echo "::error::${name}: expected the job to FAIL, but enforcement passed it"
              cat "$RUNNER_TEMP/log.txt"; failures=$((failures+1)); return
            fi
            echo "✓ ${name}"
          }

          # assert_message <name> <substring> <run_enforce arguments...>
          # Several branches fail closed, so the message identifies which one fired.
          assert_message() {
            local name="$1" needle="$2"; shift 2
            run_enforce "$@"
            if grep -qF "$needle" "$RUNNER_TEMP/log.txt"; then
              echo "✓ ${name}"; return
            fi
            echo "::error::${name}: expected the outcome to be reported as '${needle}'. Got: $(grep -m1 -E '::(error|warning|notice)::' "$RUNNER_TEMP/log.txt")"
            failures=$((failures+1))
          }

          expect pass "strict passes a CLEAN verdict" \
            strict 0 true CLEAN success
          expect pass "malicious-only passes a CLEAN verdict" \
            malicious-only 0 true CLEAN success
          # Blocking outcomes, which a live job cannot assert.
          expect fail "strict blocks a SUSPICIOUS verdict" \
            strict 5 true SUSPICIOUS success
          expect pass "malicious-only warns on a SUSPICIOUS verdict instead of blocking" \
            malicious-only 5 true SUSPICIOUS success
          expect fail "strict blocks a MALICIOUS verdict" \
            strict 5 true MALICIOUS success
          expect fail "malicious-only still blocks a MALICIOUS verdict" \
            malicious-only 5 true MALICIOUS success
          expect fail "an unrecognized policy blocks a SUSPICIOUS verdict" \
            warn 5 true SUSPICIOUS success

          # Fail-closed: neither policy may pass a scan without a verdict or a valid report.
          expect fail "a scan that never ran blocks" \
            strict "" false unavailable skipped
          expect fail "a failed scan blocks under strict" \
            strict 5 false FAILED skipped scan-failed
          expect fail "a failed scan blocks under malicious-only" \
            malicious-only 5 false FAILED skipped scan-failed
          expect fail "a transport failure blocks under malicious-only" \
            malicious-only 2 false unavailable skipped backend-connectivity
          expect fail "a CLEAN verdict with an invalid report blocks" \
            strict 0 true CLEAN failure
          expect fail "a SUSPICIOUS verdict with an invalid report blocks under malicious-only" \
            malicious-only 5 true SUSPICIOUS failure

          assert_message "MALICIOUS is named even when the report is invalid" \
            "MALICIOUS verdict"          malicious-only 5 true MALICIOUS failure
          assert_message "a strict block names the policy it violated" \
            "violates failure_policy=strict" strict 5 true SUSPICIOUS success
          assert_message "malicious-only surfaces a SUSPICIOUS verdict as a warning" \
            "::warning::"                malicious-only 5 true SUSPICIOUS success
          assert_message "a CLEAN scan says so explicitly" \
            "Pulse malware scan: CLEAN." strict 0 true CLEAN success
          assert_message "a scan without a verdict names its diagnostic category" \
            "(scan-failed)"              strict 5 false FAILED skipped scan-failed
          assert_message "a scan that never ran is reported as such" \
            "did not run to completion"  strict "" false unavailable skipped

          if [ "$failures" -ne 0 ]; then
            echo "::error::${failures} enforcement case(s) failed"
            exit 1
          fi
          echo "All enforcement cases passed."

  # ============================================================================
  # Malware scan (Pulse) — live integration.
  #
  # Gated on ENABLE_PULSE_INTEGRATION, shared with the secret-scan live jobs. Requires
  # NSPECT_ID, the CHARON_* variables, an image tag with the source-code-scan command, and a
  # Charon tenant that lists the triggering ref and the scan's routes.
  #
  # Proves transport and a CLEAN verdict only. Detection needs a ProdSec-approved sample,
  # which cannot sit on a branch this job expects to scan clean.
  # ============================================================================
  malware-scan-pulse-positive:
    name: Malware scan (Pulse) — positive
    if: ${{ vars.ENABLE_PULSE_INTEGRATION == 'true' }}
    permissions:
      id-token: write
    uses: ./.github/workflows/malware-scan-pulse.yml
    with:
      nspect_id: ${{ vars.NSPECT_ID }}

  malware-scan-assert-outcome:
    name: Malware scan — assert the verdict reached the caller
    needs: malware-scan-pulse-positive
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a CLEAN verdict and the audit join key in the workflow outputs
        env:
          VERDICT: ${{ needs.malware-scan-pulse-positive.outputs.verdict }}
          SCANNER_EXIT: ${{ needs.malware-scan-pulse-positive.outputs.scanner_exit_code }}
          FLAGGED_COUNT: ${{ needs.malware-scan-pulse-positive.outputs.flagged_count }}
          SCAN_ID: ${{ needs.malware-scan-pulse-positive.outputs.scan_id }}
        run: |
          set -euo pipefail
          failures=0
          if [ "$VERDICT" != CLEAN ] || [ "$SCANNER_EXIT" != 0 ] || [ "$FLAGGED_COUNT" != 0 ]; then
            echo "::error::Expected verdict CLEAN, scanner exit 0 and no flagged items; got '${VERDICT}', '${SCANNER_EXIT}', '${FLAGGED_COUNT}'."
            failures=$((failures + 1))
          fi
          if [ -z "$SCAN_ID" ] || [ "$SCAN_ID" = unavailable ]; then
            echo "::error::The Pulse scan ID did not reach the caller, so the run cannot be joined to the server-side record."
            failures=$((failures + 1))
          fi
          [ "$failures" -eq 0 ] || exit 1
          echo "::notice::Transport proven: a CLEAN verdict for this commit reached the caller with Pulse scan ${SCAN_ID}."

  # Suite passthrough for the malware scan, behind the same gate.
  security-suite-malware-dogfood:
    name: Security suite (malware scan) — self test
    if: ${{ vars.ENABLE_PULSE_INTEGRATION == 'true' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/security-suite.yml
    with:
      enable-malware-scan: true
      nspect-id: ${{ vars.NSPECT_ID }}
