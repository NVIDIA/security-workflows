#
# Security Workflows — Vulnerability Scan (Pulse OSS) reusable workflow.
#
# Runs the Pulse open source CLI from nvcr.io, reaching nSpect and the
# vulnerability backend through the Charon application tunnel on loopback. GitHub OIDC is the
# only identity presented — no SSA, service, or backend credential enters the job.
#
# The calling repository must have an nv-gha-runners grant and must see the Vault variables

name: Vulnerability Scan (Pulse OSS)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label to run on (an nv-gha-runners label).
        type: string
        required: false
        default: linux-amd64-cpu4
      nspect_id:
        description: >-
          nSpect ID for the calling repository (NSPECT-xxxx-xxxx), normally from the NSPECT_ID repository variable.
          Leave it empty to run unregistered: the scan reports findings in the job without recording them against a registration,
          which is the only lane available to a repository that has no nSpect registration.
          Unregistered runs are rapid-only and cannot write inventory, because both need a registration to write against.
        type: string
        required: false
        default: ''
      registered_branch:
        description: Default or release branch registered in nSpect. Never a pull-request/* mirror.
        type: string
        required: false
        default: main
      sbom_name:
        description: >-
          SBOM name of the nSpect registration to scan against, passed to the CLI as --sbom-name.
          The repository, registered_branch and SBOM name together select one registration, so set
          this when the registered branch carries more than one SBOM entry. Needs nspect_id, and is
          required with inventory_writeback so that a write lands on the registration named here.
        type: string
        required: false
        default: ''
      scan_path:
        description: Repository-relative directory to scan.
        type: string
        required: false
        default: .
      scan_mode:
        description: >-
          Scan family to run. Allowed:
          - auto (default) — persistent on the registered branch, rapid everywhere else.
          - persistent — creates or updates the project/version in the backend. Only on the
            registered branch; refused on pull-request/* mirrors, which are rapid-only.
          - rapid — reports findings without creating persistent state.
        type: string
        required: false
        default: auto
      build:
        description: >-
          Enable scanner build mode, for ecosystems whose dependency graph is only resolvable through a build (Maven, Go).
        type: boolean
        required: false
        default: false
      python_wheels_artifact:
        description: Current-run artifact containing runtime wheels for Python 3.12 on Linux amd64. Requires python_project, build false and the registered_branch ref.
        type: string
        required: false
        default: ''
      python_project:
        description: Installed Python distribution to inspect from the supplied wheels. Uses PIP-only dependency analysis.
        type: string
        required: false
        default: ''
      snippet_scan:
        description: Enable snippet matching for a registered-branch persistent scan. Not available with RAPID or inventory_writeback.
        type: boolean
        required: false
        default: false
      detect_properties:
        description: JSON object of supported Detect tuning properties. See docs/vuln-scan for the allowed names and values.
        type: string
        required: false
        default: '{}'
      show_console:
        description: Print the credential-redacted, destination-abstracted scanner log. Off by default; redaction cannot be disabled.
        type: boolean
        required: false
        default: false
      debug_logging:
        description: Enable Pulse debug logging. Console output remains controlled by show_console and always redacted.
        type: boolean
        required: false
        default: false
      failure_policy:
        description: >-
          Pipeline failure behavior on findings. The scan always produces the full report;
          this input only decides whether findings fail the job, and is applied to the validated
          report — the CLI always runs with --no-fail, so its exit code reports only whether the
          scan itself succeeded. Allowed:
          - report-only (default) — findings warn; scanner and transport errors still fail.
          - fail-on-vulnerability — any reported finding fails the job.
        type: string
        required: false
        default: report-only
      inventory_writeback:
        description: Publish results to nSpect inventory (persistent scans only). Requires sbom_name.
        type: boolean
        required: false
        default: false
      upload_report:
        description: Upload the validated vulnerability report as a 3-day artifact.
        type: boolean
        required: false
        default: false
      timeout_seconds:
        description: Scanner timeout in seconds (60-3600).
        type: number
        required: false
        default: 1800
      ci_test_setup:
        description: >-
          CI self-test only. When true — and only when the caller is NVIDIA/security-workflows —
          a disposable Maven fixture pinning a known-vulnerable dependency is written to
          .pulse-oss-selftest/ in the checked-out tree, so the detection path can be exercised
          end-to-end through this reusable workflow. Pass scan_path: .pulse-oss-selftest and
          build: true alongside it. The fixture is generated at run time and never committed,
          so this repository's own dependency graph stays clean.
          It is inert in every other repository. Never enable in production consumers.
        type: boolean
        required: false
        default: false
    outputs:
      resolved_mode:
        description: Scan family selected after applying auto behavior.
        value: ${{ jobs.pulse-oss.outputs.resolved_mode }}
      finding_count:
        description: Number of findings in the validated report.
        value: ${{ jobs.pulse-oss.outputs.finding_count }}
      scanner_exit_code:
        description: Scanner process exit code.
        value: ${{ jobs.pulse-oss.outputs.scanner_exit_code }}
      scanner_image_digest:
        description: Digest of the scanner image the run executed.
        value: ${{ jobs.pulse-oss.outputs.scanner_image_digest }}

permissions:
  contents: read
  id-token: write  # minted twice over: Vault for the registry, Charon for the scan

jobs:
  pulse-oss:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 75  # headroom above the 3600s maximum scanner timeout
    defaults:
      run:
        shell: bash
    outputs:
      resolved_mode: ${{ steps.contract.outputs.resolved_mode }}
      finding_count: ${{ steps.report.outputs.finding_count }}
      scanner_exit_code: ${{ steps.scanner.outputs.exit_code }}
      scanner_image_digest: ${{ steps.image.outputs.digest }}
    env:
      # Approved stable release 0.5.3-charon.11 (charon-stable since 2026-10-27). Pinned by digest
      # because the scanner receives the job's OIDC request credentials; callers cannot substitute it.
      SCANNER_IMAGE_REF: nvcr.io/0898940053369630/pulse/pulse-oss-cli@sha256:44481e18efdf384fc212eea3a300ae001385e10d1e2d05e92a8a7d350b328c60
      SCANNER_IMAGE_ALLOWED_REGISTRY: nvcr.io
      CHARON_PROXY_SERVER: ext-nv-prd-apps.teleport.sh:443
      CHARON_JOIN_TOKEN: charon-gha-runners
      CHARON_APP_NAME: charon
      CHARON_LOCAL_PORT: "8888"
      CHARON_CLIENT_VERSION: ${{ vars.VULN_SCAN_TUNNEL_CLIENT_VERSION || 'auto' }}
    steps:
      - name: Validate scan contract
        id: contract
        env:
          INPUT_NSPECT_ID: ${{ inputs.nspect_id }}
          INPUT_REGISTERED_BRANCH: ${{ inputs.registered_branch }}
          INPUT_SBOM_NAME: ${{ inputs.sbom_name }}
          INPUT_SCAN_MODE: ${{ inputs.scan_mode }}
          INPUT_SCAN_PATH: ${{ inputs.scan_path }}
          INPUT_FAILURE_POLICY: ${{ inputs.failure_policy }}
          INPUT_WRITEBACK: ${{ inputs.inventory_writeback }}
          INPUT_TIMEOUT: ${{ inputs.timeout_seconds }}
          INPUT_BUILD: ${{ inputs.build }}
          INPUT_PYTHON_WHEELS_ARTIFACT: ${{ inputs.python_wheels_artifact }}
          INPUT_PYTHON_PROJECT: ${{ inputs.python_project }}
          INPUT_SNIPPET_SCAN: ${{ inputs.snippet_scan }}
          INPUT_DETECT_PROPERTIES: ${{ inputs.detect_properties }}
          NV_VAULT_URL: ${{ vars.NV_VAULT_URL }}
          NVCR_VAULT_ROLE: ${{ vars.NVCR_VAULT_ROLE }}
          NVCR_VAULT_JWT_PATH: ${{ vars.NVCR_VAULT_JWT_PATH }}
          NVCR_VAULT_NAMESPACE: ${{ vars.NVCR_VAULT_NAMESPACE }}
          NVCR_VAULT_SECRET_PATH: ${{ vars.NVCR_VAULT_SECRET_PATH }}
        run: |
          set -euo pipefail

          # Fork-authored code must not reach a job holding OIDC on an untrusted event.
          # Consumers trigger this on push, including the copy-pr-bot mirrored
          # pull-request/N refs.
          case "$GITHUB_EVENT_NAME" in
            pull_request|pull_request_target)
              echo "::error::${GITHUB_EVENT_NAME} is not a trusted trigger for this scan. Call it from push, schedule, or workflow_dispatch."
              exit 1
              ;;
          esac

          # Name the missing variable rather than letting the Vault action fail on
          # "Input required and not supplied: url". vars resolves against the caller.
          missing=()
          for name in NV_VAULT_URL NVCR_VAULT_ROLE NVCR_VAULT_JWT_PATH \
            NVCR_VAULT_NAMESPACE NVCR_VAULT_SECRET_PATH; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing Actions variable(s): ${missing[*]}. They must be visible to the calling repository — ask the GitHub-First platform team to provision them for this organization."
            exit 1
          fi

          # The quotes matter: a quoted subexpression is literal, so the '.' in the host is a
          # dot rather than "any character" and nvcrXio is not a match. The path class excludes
          # '@' and ':', so a tag cannot ride along with the digest.
          if [[ ! "$SCANNER_IMAGE_REF" =~ ^"$SCANNER_IMAGE_ALLOWED_REGISTRY"/[A-Za-z0-9][A-Za-z0-9._/-]*@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The scanner image must be an ${SCANNER_IMAGE_ALLOWED_REGISTRY} reference pinned by sha256 digest."
            exit 1
          fi
          # The value reaches teleport-actions/setup, which builds a download URL from it.
          # '..' is rejected on top of the semver shape so no traversal sequence can survive
          # the pre-release field, which does accept dots and dashes.
          if [[ "$CHARON_CLIENT_VERSION" != auto ]] \
            && { [[ ! "$CHARON_CLIENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] \
              || [[ "$CHARON_CLIENT_VERSION" == *".."* ]]; }; then
            echo "::error::VULN_SCAN_TUNNEL_CLIENT_VERSION must be a bare semantic version, or unset to resolve it from the proxy."
            exit 1
          fi
          # Workflow-owned, but these feed the tbot config and loopback URLs, so their shape is checked.
          if [[ ! "$CHARON_PROXY_SERVER" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*:[0-9]{1,5}$ ]]; then
            echo "::error::CHARON_PROXY_SERVER must be a host:port value."
            exit 1
          fi
          charon_proxy_port="${CHARON_PROXY_SERVER##*:}"
          if (( 10#$charon_proxy_port < 1 || 10#$charon_proxy_port > 65535 )); then
            echo "::error::CHARON_PROXY_SERVER must use a TCP port from 1 to 65535."
            exit 1
          fi
          if [[ ! "$CHARON_JOIN_TOKEN" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]]; then
            echo "::error::CHARON_JOIN_TOKEN must be a simple token name with no whitespace or control characters."
            exit 1
          fi
          if [[ ! "$CHARON_APP_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::CHARON_APP_NAME must be a simple application name."
            exit 1
          fi
          if [[ ! "$CHARON_LOCAL_PORT" =~ ^[0-9]+$ ]] \
            || (( 10#$CHARON_LOCAL_PORT < 1024 || 10#$CHARON_LOCAL_PORT > 65535 )); then
            echo "::error::CHARON_LOCAL_PORT must be an unprivileged TCP port from 1024 to 65535."
            exit 1
          fi
          # Set only when the caller granted id-token: write, so presence is the grant check.
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" \
            || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub OIDC is unavailable. The caller must grant id-token: write."
            exit 1
          fi

          # Empty selects the unregistered lane below; anything present must be well formed.
          if [[ -n "$INPUT_NSPECT_ID" ]] \
            && [[ ! "$INPUT_NSPECT_ID" =~ ^NSPECT-[A-Za-z0-9]{4}-[A-Za-z0-9]{4}$ ]]; then
            echo "::error::nspect_id must be a valid nSpect ID (NSPECT-xxxx-xxxx), or empty to run unregistered."
            exit 1
          fi
          if [[ ! "$INPUT_REGISTERED_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,254}$ ]] \
            || [[ "$INPUT_REGISTERED_BRANCH" == *".."* ]] \
            || [[ "$INPUT_REGISTERED_BRANCH" == */ ]]; then
            echo "::error::registered_branch is invalid."
            exit 1
          fi
          # A mirror is never a registration, and naming one would let auto resolve to
          # persistent on the mirror itself.
          if [[ "$INPUT_REGISTERED_BRANCH" == pull-request/* ]]; then
            echo "::error::registered_branch cannot be a copy-pr-bot pull-request/* mirror."
            exit 1
          fi
          case "$INPUT_SCAN_MODE" in auto|persistent|rapid) ;;
            *) echo "::error::scan_mode must be auto, persistent, or rapid."; exit 1 ;;
          esac
          case "$INPUT_FAILURE_POLICY" in report-only|fail-on-vulnerability) ;;
            *) echo "::error::failure_policy must be report-only or fail-on-vulnerability."; exit 1 ;;
          esac
          if [[ ! "$INPUT_TIMEOUT" =~ ^[0-9]+$ ]] \
            || (( 10#$INPUT_TIMEOUT < 60 || 10#$INPUT_TIMEOUT > 3600 )); then
            echo "::error::timeout_seconds must be a whole number between 60 and 3600."
            exit 1
          fi

          resolved_mode="$INPUT_SCAN_MODE"
          if [[ "$resolved_mode" == auto ]]; then
            # Without a registration there is nothing for a persistent scan to own, so auto
            # resolves to rapid on every ref rather than to persistent on the registered one.
            if [[ -n "$INPUT_NSPECT_ID" && "$GITHUB_REF" == "refs/heads/$INPUT_REGISTERED_BRANCH" ]]; then
              resolved_mode=persistent
            else
              resolved_mode=rapid
            fi
          fi
          # The CLI rejects these combinations itself with a usage error; failing here names
          # the input that is wrong instead of surfacing an exit code from inside the container.
          if [[ -z "$INPUT_NSPECT_ID" && "$resolved_mode" != rapid ]]; then
            echo "::error::scan_mode ${INPUT_SCAN_MODE} needs an nspect_id. An unregistered scan is rapid-only."
            exit 1
          fi
          # copy-pr-bot mirrors each pull request to refs/heads/pull-request/<n>, so that ref
          # carries pull-request content and may run only a rapid scan, which records nothing.
          if [[ "$GITHUB_REF" == refs/heads/pull-request/* ]] \
            && [[ "$resolved_mode" != rapid || "$INPUT_WRITEBACK" == true ]]; then
            echo "::error::Pull request mirrors (refs/heads/pull-request/*) are RAPID-only. Use scan_mode auto or rapid, with inventory_writeback false."
            exit 1
          fi
          # A persistent scan owns a stable project/version, so only the registered ref may run one.
          if [[ "$resolved_mode" == persistent && "$GITHUB_REF" != "refs/heads/$INPUT_REGISTERED_BRANCH" ]]; then
            echo "::error::A persistent scan requires the checked-out ref to be refs/heads/${INPUT_REGISTERED_BRANCH}."
            exit 1
          fi
          if [[ "$INPUT_WRITEBACK" == true && "$resolved_mode" != persistent ]]; then
            echo "::error::inventory_writeback is available only for a persistent scan."
            exit 1
          fi
          if [[ -n "$INPUT_SBOM_NAME" ]]; then
            if [[ -z "$INPUT_NSPECT_ID" ]]; then
              echo "::error::sbom_name selects an nSpect registration, so it needs an nspect_id."
              exit 1
            fi
            # A leading '-' would be read as an option rather than as the value of --sbom-name.
            if [[ ! "$INPUT_SBOM_NAME" =~ ^[A-Za-z0-9][^[:cntrl:]]{0,254}$ ]]; then
              echo "::error::sbom_name must start with a letter or digit, hold no control characters, and be at most 255 characters."
              exit 1
            fi
          fi
          # A write must land on a named registration, not on whichever the backend selects.
          if [[ "$INPUT_WRITEBACK" == true && -z "$INPUT_SBOM_NAME" ]]; then
            echo "::error::inventory_writeback needs sbom_name, so the write lands on the registration named there."
            exit 1
          fi

          if [[ -n "${INPUT_PYTHON_WHEELS_ARTIFACT:-}${INPUT_PYTHON_PROJECT:-}" ]]; then
            if [[ ! "${INPUT_PYTHON_WHEELS_ARTIFACT:-}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] \
              || [[ ! "${INPUT_PYTHON_PROJECT:-}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "::error::Set both python_wheels_artifact and python_project to simple names."
              exit 1
            fi
            # Installed wheels can contain executable code. This first version uses only
            # the selected regular branch, never pull-request mirrors or arbitrary setup.
            if [[ "$GITHUB_REF" != "refs/heads/$INPUT_REGISTERED_BRANCH" || "${INPUT_BUILD:-false}" == true ]]; then
              echo "::error::Prebuilt Python setup requires the registered_branch ref and build false."
              exit 1
            fi
          fi

          if [[ "${INPUT_SNIPPET_SCAN:-false}" == true ]] \
            && [[ "$resolved_mode" != persistent || "$INPUT_WRITEBACK" == true ]]; then
            echo "::error::snippet_scan requires a registered-branch persistent scan with inventory_writeback false."
            exit 1
          fi

          # Parse data, never shell fragments. The workflow owns identity, paths, engines,
          # result waiting and timeout; no property may bypass those controls.
          RESOLVED_MODE="$resolved_mode" python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          def unique_object(pairs):
              """Reject duplicate property names instead of silently taking the last value."""
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("duplicate property")
                  result[key] = value
              return result

          try:
              raw = os.environ.get("INPUT_DETECT_PROPERTIES", "{}")
              if len(raw) > 8192:
                  raise ValueError("oversized properties")
              properties = json.loads(raw, object_pairs_hook=unique_object)
              if not isinstance(properties, dict):
                  raise ValueError("not an object")
              # The string-valued settings below are bounded lists/names, not executables
              # or command arguments. Unknown spellings are deliberately not normalized.
              strings = {
                  "detect.included.detector.types", "detect.excluded.detector.types",
                  "detect.required.detector.types", "detect.excluded.directories",
                  "detect.accuracy.required", "detect.pip.project.name",
                  "detect.pip.project.version.name", "detect.maven.excluded.scopes",
                  "detect.gradle.included.configurations", "detect.poetry.dependency.groups.excluded",
                  "detect.uv.dependency.groups.excluded", "detect.npm.dependency.types.excluded",
              }
              booleans = {"detect.pip.only.project.tree", "detect.excluded.directories.defaults.disabled"}
              full_only = {
                  "detect.blackduck.signature.scanner.individual.file.matching": {"NONE", "SOURCE", "BINARY", "ALL"},
                  "detect.blackduck.signature.scanner.reduced.persistence": {"DEFAULT", "RETAIN_UNMATCHED", "DISCARD_UNMATCHED"},
                  "detect.blackduck.signature.scanner.license.search": {True, False},
                  "detect.blackduck.signature.scanner.copyright.search": {True, False},
                  "detect.blackduck.signature.scanner.memory": None,
              }
              detector_types = set("BITBAKE CARGO CARTHAGE COCOAPODS CONAN CONDA CPAN CRAN DART GIT GO_MOD GO_DEP GO_VNDR GO_VENDOR GO_GRADLE GRADLE HEX IVY LERNA MAVEN NPM NUGET PACKAGIST PEAR PIP PNPM POETRY RUBYGEMS SBT SETUPTOOLS SWIFT YARN CLANG XCODE OPAM UV RUSH".split())
              settings = {"DETECT_TIMEOUT": str(int(os.environ["INPUT_TIMEOUT"]))}
              # Wheel scans own the interpreter, project and detector selection.
              python_owned = {
                  "detect.included.detector.types", "detect.excluded.detector.types",
                  "detect.required.detector.types", "detect.detector.search.depth",
                  "detect.accuracy.required",
                  "detect.pip.project.name", "detect.pip.project.version.name", "detect.pip.only.project.tree",
              }
              if os.environ.get("INPUT_PYTHON_WHEELS_ARTIFACT") and python_owned.intersection(properties):
                  raise ValueError("property conflicts with prepared Python environment")
              if os.environ["RESOLVED_MODE"] == "persistent":
                  settings["DETECT_WAIT_FOR_RESULTS"] = "true"
              if os.environ.get("INPUT_SNIPPET_SCAN") == "true":
                  settings["DETECT_BLACKDUCK_SIGNATURE_SCANNER_SNIPPET_MATCHING"] = "SNIPPET_MATCHING"
              for name, value in properties.items():
                  if name in strings:
                      if not isinstance(value, str) or not value or len(value) > 512:
                          raise ValueError("invalid string")
                      if any(not (character.isascii() and (character.isalnum() or character in "_.,/*?+@ -"))
                             for character in value):
                          raise ValueError("invalid characters")
                  elif name in booleans:
                      if not isinstance(value, bool):
                          raise ValueError("not a boolean")
                  elif name == "detect.detector.search.depth":
                      if type(value) is not int or not 0 <= value <= 100:
                          raise ValueError("invalid search depth")
                  elif name in full_only:
                      if os.environ["RESOLVED_MODE"] != "persistent":
                          raise ValueError("full-scan property in RAPID")
                      choices = full_only[name]
                      if choices is None:
                          if type(value) is not int or not 1 <= value <= 65536:
                              raise ValueError("invalid scanner memory")
                      elif name.endswith(("license.search", "copyright.search")):
                          if not isinstance(value, bool):
                              raise ValueError("not a boolean")
                      elif not isinstance(value, str) or value not in choices:
                          raise ValueError("invalid enum")
                  else:
                      raise ValueError("unsupported property")
                  if name.endswith("detector.types") or name == "detect.accuracy.required":
                      allowed = detector_types | ({"ALL", "NONE"} if name == "detect.accuracy.required" else set())
                      if not set(value.split(",")) <= allowed:
                          raise ValueError("invalid detector list")
                  if name == "detect.npm.dependency.types.excluded" \
                          and not set(value.split(",")) <= {"NONE", "DEV", "PEER", "OPTIONAL"}:
                      raise ValueError("invalid NPM dependency type")
                  settings[name.upper().replace(".", "_")] = str(value).lower() if isinstance(value, bool) else str(value)
              destination = Path(os.environ["RUNNER_TEMP"]) / "pulse-oss-detect.env"
              destination.write_text("".join(f"{key}={value}\n" for key, value in sorted(settings.items())), encoding="utf-8")
              destination.chmod(0o600)
          except (ValueError, TypeError):
              raise SystemExit("::error::detect_properties must contain only supported names and typed values. See the scan guide.") from None
          PY

          # Private Docker config, so the registry login can be destroyed on its own.
          docker_config="$RUNNER_TEMP/pulse-oss-docker"
          install -d -m 700 "$docker_config"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"

          {
            printf 'resolved_mode=%s\n' "$resolved_mode"
            printf 'project_name=%s\n' "${GITHUB_REPOSITORY#*/}"
            printf 'project_version=%s\n' "$INPUT_REGISTERED_BRANCH"
          } >> "$GITHUB_OUTPUT"

          # Artifact names must differ when one run calls this workflow more than once, so
          # they carry the scan path. Artifact names reject / \ : < > | * ? " and CR/LF.
          slug="$(printf '%s' "$INPUT_SCAN_PATH" | tr -c 'A-Za-z0-9._-' '-' \
            | sed -e 's/-\{2,\}/-/g' -e 's/^-//' -e 's/-$//')"
          if [[ -z "$slug" || "$slug" == "." ]]; then
            slug=root
          fi
          # Runtime variants can inspect the same source path in parallel.
          if [[ -n "${INPUT_PYTHON_WHEELS_ARTIFACT:-}" ]]; then
            variant="$(printf '%s\n' "$INPUT_PYTHON_WHEELS_ARTIFACT" "$INPUT_PYTHON_PROJECT" | sha256sum | cut -c1-12)"
            slug="$slug-$variant"
          fi
          printf 'artifact_slug=%s\n' "$slug" >> "$GITHUB_OUTPUT"

      - name: Checkout scan source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false  # don't leave GITHUB_TOKEN in .git for the scanned tree

      # CI self-test only. Writes a manifest with a known-vulnerable pin so the detection path
      # can be exercised end-to-end; committing one would put a deliberate CVE in a public
      # repository's dependency graph. Inert for every downstream consumer even if the flag is passed.
      # Runs before the scan-path validation below, which requires the directory to exist.
      - name: (self-test) Create disposable vulnerable-dependency fixture
        if: ${{ inputs.ci_test_setup && github.repository == 'NVIDIA/security-workflows' }}
        env:
          FIXTURE_DIR: ${{ github.workspace }}/.pulse-oss-selftest
        run: |
          set -euo pipefail
          echo "::warning::ci_test_setup is enabled — planting a disposable vulnerable-dependency fixture for CI self-test."
          mkdir -p "$FIXTURE_DIR"
          cat > "$FIXTURE_DIR/pom.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.nvidia.securityworkflows.selftest</groupId>
            <artifactId>vuln-scan-detection-fixture</artifactId>
            <version>1.0.0</version>
            <!-- Pinned to a version with published advisories so a zero-finding result is a
                 defect rather than good news. No dependency code is ever executed. -->
            <dependencies>
              <dependency>
                <groupId>org.apache.logging.log4j</groupId>
                <artifactId>log4j-core</artifactId>
                <version>2.14.1</version>
              </dependency>
            </dependencies>
          </project>
          XML

      - name: Validate scan path
        id: source
        env:
          INPUT_SCAN_PATH: ${{ inputs.scan_path }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import os
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          raw = os.environ["INPUT_SCAN_PATH"].strip()

          def fail(message):
              """Reject unsafe scan roots without evaluating repository code."""
              raise SystemExit(f"::error::{message}")

          if not raw:
              fail("scan_path is empty.")
          if any(ord(character) < 32 or ord(character) == 127 for character in raw):
              fail("scan_path contains unsupported control characters.")
          candidate = Path(raw)
          if candidate.is_absolute() or ".." in candidate.parts:
              fail("scan_path must be repository-relative and cannot contain '..'.")

          unresolved = workspace / candidate
          if unresolved.is_symlink():
              fail("scan_path selects a symbolic link.")
          try:
              root = unresolved.resolve(strict=True)
          except FileNotFoundError:
              fail("scan_path does not exist in the checkout.")
          if root != workspace and workspace not in root.parents:
              fail("scan_path resolves outside the checkout.")
          if not root.is_dir():
              fail("scan_path must select a directory.")

          # A link out of the scanned tree would smuggle unreviewed content into the mount.
          for entry in root.rglob("*"):
              if entry.is_symlink():
                  target = entry.resolve(strict=False)
                  if target != root and root not in target.parents:
                      fail("A symbolic link under scan_path escapes the scanned tree.")

          relative = root.relative_to(workspace).as_posix()
          container_path = "/workspace" if relative == "." else f"/workspace/{relative}"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"container_path={container_path}\n")
          PY

      # Audience here is Vault's, not Charon's — each request mints its own token, so both
      # identities live under the single id-token: write grant.
      - name: Download Python runtime wheels
        if: inputs.python_wheels_artifact != ''
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6
        with:
          name: ${{ inputs.python_wheels_artifact }}
          path: ${{ runner.temp }}/pulse-oss-python-wheels

      - name: Validate Python runtime wheels
        if: inputs.python_wheels_artifact != ''
        env:
          WHEELHOUSE: ${{ runner.temp }}/pulse-oss-python-wheels
          INPUT_PYTHON_PROJECT: ${{ inputs.python_project }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import configparser
          import os
          import re
          import stat
          import zipfile
          from email.parser import BytesParser
          from pathlib import Path, PurePosixPath

          def normalized(name):
              """Compare distribution names using Python package-name normalization."""
              return re.sub(r"[-_.]+", "-", name).lower()

          try:
              root = Path(os.environ["WHEELHOUSE"])
              wheels = list(root.iterdir())
              if root.is_symlink() or not wheels:
                  raise ValueError("empty or linked artifact")
              projects = set()
              for wheel in wheels:
                  if wheel.is_symlink() or not wheel.is_file() or wheel.suffix != ".whl":
                      raise ValueError("artifact must contain only flat wheel files")
                  with zipfile.ZipFile(wheel) as archive:
                      metadata = []
                      for member in archive.infolist():
                          path = PurePosixPath(member.filename)
                          parts = path.parts
                          if (not parts or path.is_absolute() or ".." in parts or "\\" in member.filename
                                  or stat.S_ISLNK(member.external_attr >> 16)):
                              raise ValueError("unsafe wheel member")
                          if parts[0].endswith(".data"):
                              if len(parts) < 3 or parts[1] not in {"purelib", "platlib"}:
                                  raise ValueError("wheel scripts/data schemes are not supported")
                              parts = parts[2:]
                          if (parts[0].lower().split(".")[0] in {"pip", "venv", "ensurepip", "sitecustomize", "usercustomize"}
                                  or path.name in {"sitecustomize.py", "usercustomize.py"}):
                              raise ValueError("wheel changes Python startup or tooling")
                          if path.name == "entry_points.txt":
                              entries = configparser.ConfigParser()
                              entries.read_string(archive.read(member).decode("utf-8"))
                              for group in ("console_scripts", "gui_scripts"):
                                  for name in entries[group] if entries.has_section(group) else ():
                                      if (not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", name)
                                              or name.lower().startswith(("pip", "python"))):
                                          raise ValueError("wheel replaces a Python executable")
                          if len(parts) == 2 and parts[0].endswith(".dist-info") and parts[1] == "METADATA":
                              metadata.append(BytesParser().parsebytes(archive.read(member)))
                      if len(metadata) != 1 or not metadata[0].get("Name"):
                          raise ValueError("missing package identity")
                      name = normalized(metadata[0]["Name"])
                      if name in projects or name in {"pip", "setuptools", "wheel"}:
                          raise ValueError("duplicate distribution or packaging-tool replacement")
                      projects.add(name)
              if normalized(os.environ["INPUT_PYTHON_PROJECT"]) not in projects:
                  raise ValueError("selected project is absent from wheelhouse")
          except (OSError, ValueError, KeyError, zipfile.BadZipFile, configparser.Error):
              raise SystemExit("::error::Invalid wheel artifact: supply the selected project and its runtime wheels, without scripts or Python startup/tool replacements.") from None
          print("Python runtime wheel artifact validated.")
          PY

      - name: Import nvcr.io credentials from Vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b  # v3.4.0
        with:
          url: ${{ vars.NV_VAULT_URL }}
          role: ${{ vars.NVCR_VAULT_ROLE }}
          method: jwt
          path: ${{ vars.NVCR_VAULT_JWT_PATH }}
          jwtGithubAudience: https://token.actions.githubusercontent.com
          namespace: ${{ vars.NVCR_VAULT_NAMESPACE }}
          secrets: |
            ${{ vars.NVCR_VAULT_SECRET_PATH }} username | NVCR_IO_USERNAME ;
            ${{ vars.NVCR_VAULT_SECRET_PATH }} password | NVCR_IO_PASSWORD

      - name: Log in to nvcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: nvcr.io
          username: ${{ env.NVCR_IO_USERNAME }}
          password: ${{ env.NVCR_IO_PASSWORD }}
          logout: false

      - name: Pull Pulse OSS scanner image
        id: image
        run: |
          set -euo pipefail
          if ! docker image inspect "$SCANNER_IMAGE_REF" >/dev/null 2>&1; then
            docker pull "$SCANNER_IMAGE_REF" >/dev/null
          fi
          # Record the digest from the pulled image itself, not only from the reference.
          digest="${SCANNER_IMAGE_REF##*@}"
          repo_digests="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$SCANNER_IMAGE_REF")"
          if ! grep -qxF "${SCANNER_IMAGE_REF%@*}@${digest}" <<< "$repo_digests"; then
            echo "::error::The pulled scanner image does not carry the pinned digest ${digest}."
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Log out of nvcr.io
        if: always()
        run: docker logout nvcr.io >/dev/null 2>&1 || true

      - name: Prepare Python scan environment
        if: inputs.python_wheels_artifact != ''
        env:
          WHEELHOUSE: ${{ runner.temp }}/pulse-oss-python-wheels
          INPUT_PYTHON_PROJECT: ${{ inputs.python_project }}
        run: |
          set -euo pipefail
          umask 077
          suffix="$(python3 -I -c 'import secrets; print(secrets.token_hex(6))')"
          volume="pulse-oss-python-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$suffix"
          prepare_container="$volume-setup"
          environment_file="$(mktemp "$RUNNER_TEMP/pulse-oss-python.XXXXXX.env")"
          {
            printf 'PULSE_OSS_PYTHON_VOLUME=%s\n' "$volume"
            printf 'PULSE_OSS_PYTHON_PREP_CONTAINER=%s\n' "$prepare_container"
            printf 'PULSE_OSS_PYTHON_ENV_FILE=%s\n' "$environment_file"
          } >> "$GITHUB_ENV"
          docker volume create "$volume" >/dev/null
          # Root can initialize the empty volume, but gets no capabilities, network,
          # job identity or writable image/source. The actual scanner stays unprivileged.
          if ! docker run --name "$prepare_container" --pull never \
            --network none --read-only --user 0:0 \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --env PYTHON_PROJECT="$INPUT_PYTHON_PROJECT" \
            --volume "$WHEELHOUSE:/runtime-wheels:ro" \
            --volume "$volume:/scan-python:rw" \
            --entrypoint /opt/miniforge/bin/python \
            -i "$SCANNER_IMAGE_REF" -I - >/dev/null 2>&1 <<'PY'
          import os
          import subprocess
          from pathlib import Path

          os.umask(0o022)
          environment = {"PATH": "/opt/miniforge/bin:/usr/bin:/bin", "HOME": "/tmp",
                         "LANG": "C.UTF-8", "TMPDIR": "/tmp", "PIP_CONFIG_FILE": "/dev/null"}
          subprocess.run(["/opt/miniforge/bin/python", "-m", "venv", "/scan-python/venv"],
                         env=environment, check=True, capture_output=True, timeout=120)
          python = "/scan-python/venv/bin/python"
          wheels = sorted(map(str, Path("/runtime-wheels").glob("*.whl")))
          subprocess.run([python, "-I", "-m", "pip", "--isolated", "--disable-pip-version-check",
                          "install", "--no-index", "--no-cache-dir", "--only-binary=:all:", *wheels],
                         env=environment, check=True, capture_output=True, timeout=300)
          # Wheel installation does not execute .pth hooks. Remove them before
          # starting another venv process, so inspection never runs package startup code.
          for hook in Path("/scan-python/venv/lib").glob("python*/site-packages/*.pth"):
              hook.unlink()
          # Force one installed-project inspection, not unrelated sample requirements.
          Path("/scan-python/runtime-requirements.txt").write_text("", encoding="utf-8")
          subprocess.run([python, "-I", "-m", "pip", "check"], env=environment,
                         check=True, capture_output=True, timeout=60)
          subprocess.run([python, "-I", "-c", "from importlib.metadata import distribution; import sys; distribution(sys.argv[1])",
                          os.environ["PYTHON_PROJECT"]], env=environment,
                         check=True, capture_output=True, timeout=30)
          PY
          then
            echo "::error::Python setup failed. Supply compatible Python 3.12 Linux amd64 wheels for the project and every runtime dependency; pip check must pass."
            exit 1
          fi
          docker rm "$prepare_container" >/dev/null
          {
            echo 'DETECT_PYTHON_PATH=/scan-python/venv/bin/python'
            echo 'DETECT_PIP_PATH=/scan-python/venv/bin/pip'
            echo 'DETECT_INCLUDED_DETECTOR_TYPES=PIP'
            echo 'DETECT_DETECTOR_SEARCH_DEPTH=0'
            echo 'DETECT_PIP_REQUIREMENTS_PATH=/scan-python/runtime-requirements.txt'
            echo 'DETECT_PIP_ONLY_PROJECT_TREE=true'
            printf 'DETECT_PIP_PROJECT_NAME=%s\n' "$INPUT_PYTHON_PROJECT"
          } > "$environment_file"
          echo "Python scan environment prepared; runtime dependency checks passed."

      - name: Install Charon tunnel client
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6  # v1
        with:
          version: ${{ env.CHARON_CLIENT_VERSION }}
          # Required for version: auto — the action asks this proxy which client to install.
          # Harmless when the caller pinned a version.
          proxy: ${{ env.CHARON_PROXY_SERVER }}

      - name: Start Charon loopback tunnel
        run: |
          set -euo pipefail
          umask 077
          tbot_config="$(mktemp "${RUNNER_TEMP}/pulse-oss-tbot.XXXXXX.yaml")"
          tbot_log="$(mktemp "${RUNNER_TEMP}/pulse-oss-tbot.XXXXXX.log")"
          cat > "$tbot_config" <<EOF
          version: v2
          proxy_server: $CHARON_PROXY_SERVER
          onboarding:
            join_method: github
            token: $CHARON_JOIN_TOKEN
          storage:
            type: memory
          outputs: []
          services:
            - type: application-tunnel
              app_name: $CHARON_APP_NAME
              listen: tcp://127.0.0.1:$CHARON_LOCAL_PORT
          EOF

          tbot start -c "$tbot_config" > "$tbot_log" 2>&1 &
          tbot_pid=$!
          {
            printf 'PULSE_OSS_TBOT_CONFIG=%s\n' "$tbot_config"
            printf 'PULSE_OSS_TBOT_LOG=%s\n' "$tbot_log"
            printf 'PULSE_OSS_TBOT_PID=%s\n' "$tbot_pid"
          } >> "$GITHUB_ENV"

          for _ in {1..30}; do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${CHARON_LOCAL_PORT}/ready" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$tbot_pid" 2>/dev/null; then
              echo "::error::The Charon tunnel exited before it became ready."
              exit 1
            fi
            sleep 1
          done
          echo "::error::The Charon tunnel did not become ready within 30 seconds."
          exit 1

      - name: Pulse OSS vulnerability scan
        id: scanner
        env:
          RESOLVED_MODE: ${{ steps.contract.outputs.resolved_mode }}
          PROJECT_NAME: ${{ steps.contract.outputs.project_name }}
          PROJECT_VERSION: ${{ steps.contract.outputs.project_version }}
          CONTAINER_SCAN_PATH: ${{ steps.source.outputs.container_path }}
          INPUT_NSPECT_ID: ${{ inputs.nspect_id }}
          INPUT_REGISTERED_BRANCH: ${{ inputs.registered_branch }}
          INPUT_SBOM_NAME: ${{ inputs.sbom_name }}
          INPUT_BUILD: ${{ inputs.build }}
          INPUT_WRITEBACK: ${{ inputs.inventory_writeback }}
          INPUT_TIMEOUT: ${{ inputs.timeout_seconds }}
          INPUT_PYTHON_WHEELS_ARTIFACT: ${{ inputs.python_wheels_artifact }}
          INPUT_DEBUG_LOGGING: ${{ inputs.debug_logging }}
          INPUT_SHOW_CONSOLE: ${{ inputs.show_console }}
        run: |
          set -euo pipefail
          umask 077
          output_dir="$(mktemp -d "$RUNNER_TEMP/pulse-oss-scan.XXXXXX")"
          printf 'PULSE_OSS_OUTPUT_DIR=%s\n' "$output_dir" >> "$GITHUB_ENV"
          raw_log="$(mktemp "${RUNNER_TEMP}/pulse-oss-scanner.XXXXXX.log")"
          printf 'PULSE_OSS_RAW_LOG=%s\n' "$raw_log" >> "$GITHUB_ENV"
          container_name="pulse-oss-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The CLI rejects path separators here, so it writes into workdir /tmp instead.
          report_name="vulnerability-report.json"

          # Detect writes metadata beside source files. Give its unprivileged user a
          # writable copy, and register it before copying so failed setup is cleaned up.
          scan_root="$(mktemp -d "${RUNNER_TEMP}/pulse-oss-src.XXXXXX")"
          printf 'PULSE_OSS_SCAN_ROOT=%s\n' "$scan_root" >> "$GITHUB_ENV"
          cp -a "$GITHUB_WORKSPACE/." "$scan_root/"
          chmod -R a+rwX "$scan_root"
          # Never accept detailed status from the checkout or an earlier invocation.
          host_scan_path="$scan_root${CONTAINER_SCAN_PATH#/workspace}"
          rm -rf "$host_scan_path/bd_nspect"
          # Keep the fresh status directory runner-owned for cross-user cleanup.
          mkdir -m 777 "$host_scan_path/bd_nspect"

          {
            printf 'PULSE_OSS_CONTAINER=%s\n' "$container_name"
          } >> "$GITHUB_ENV"

          # Findings never set the exit code: the CLI always runs --no-fail, and the enforce step
          # applies failure_policy to the validated report. Under --fail the CLI exits 1 for
          # findings and for a failed scan alike, leaving only log text to tell them apart.

          # Pulse reads registration identity from both flags and environment variables.
          export PULSE_CHARON_URL="http://127.0.0.1:${CHARON_LOCAL_PORT}"

          command=(
            pulse --no-echo --no-color --no-clean --timeout "$INPUT_TIMEOUT"
            --charon-url "$PULSE_CHARON_URL"
          )
          if [[ "$INPUT_DEBUG_LOGGING" == true ]]; then
            command+=(--log-level debug)
          fi
          if [[ -n "$INPUT_NSPECT_ID" ]]; then
            export PULSE_NSPECT_ID="$INPUT_NSPECT_ID"
            export PULSE_REPO_URL="ssh://git@github.com/${GITHUB_REPOSITORY}.git"
            export PULSE_REPO_BRANCH="$INPUT_REGISTERED_BRANCH"
            command+=(
              --nspect-id "$PULSE_NSPECT_ID"
              --repo-url "$PULSE_REPO_URL"
              --repo-branch "$PULSE_REPO_BRANCH"
            )
            if [[ -n "$INPUT_SBOM_NAME" ]]; then
              command+=(--sbom-name "$INPUT_SBOM_NAME")
            fi
          else
            # Mutually exclusive with the registration flags: the CLI exits 2 if --nspect-id,
            # --repo-url, --repo-branch, --sbom-name or --override appears alongside it. The
            # PULSE_* variables stay unset, and docker omits an --env whose value is unset.
            command+=(--no-nspect)
          fi
          if [[ "$RESOLVED_MODE" == persistent ]]; then
            command+=(
              scan --project "$PROJECT_NAME" --project-version "$PROJECT_VERSION"
              --no-fail --vulnerability-report "$report_name"
            )
            if [[ "$INPUT_WRITEBACK" == true ]]; then
              command+=(--override)
            fi
          else
            command+=(rapidscan --no-fail --vulnerability-report "$report_name")
          fi
          if [[ "$INPUT_BUILD" == true ]]; then
            command+=(--build)
          else
            command+=(--no-build)
          fi
          command+=("$CONTAINER_SCAN_PATH")

          python_runtime=()
          if [[ -n "$INPUT_PYTHON_WHEELS_ARTIFACT" ]]; then
            python_runtime=(--env-file "$PULSE_OSS_PYTHON_ENV_FILE"
                            --volume "$PULSE_OSS_PYTHON_VOLUME:/scan-python:ro")
          fi

          # --network host is required: the scanner reaches Charon over the loopback tunnel.
          # The scan reads a dependency tree an untrusted contributor controls, so the
          # container gets no capabilities and cannot acquire any. The only thing it can
          # write to is the throwaway copy above.
          docker create \
            "${python_runtime[@]}" \
            --name "$container_name" \
            --network host \
            --workdir /tmp \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --env-file "$RUNNER_TEMP/pulse-oss-detect.env" \
            --env ACTIONS_ID_TOKEN_REQUEST_URL \
            --env ACTIONS_ID_TOKEN_REQUEST_TOKEN \
            --env CI=true \
            --env GITHUB_ACTIONS=true \
            --env PULSE_NSPECT_ID \
            --env PULSE_REPO_URL \
            --env PULSE_REPO_BRANCH \
            --env PULSE_CHARON_URL \
            --volume "$scan_root:/workspace:rw" \
            "$SCANNER_IMAGE_REF" \
            "${command[@]}" >/dev/null

          set +e
          docker start --attach "$container_name" > "$raw_log" 2>&1
          scanner_status=$?
          set -e

          report_copied=false
          status_copied=false
          if docker cp "$container_name:/tmp/$report_name" \
            "$output_dir/$report_name" >/dev/null 2>&1; then report_copied=true; fi
          if docker cp "$container_name:$CONTAINER_SCAN_PATH/bd_nspect/status.json" \
            "$output_dir/detect-status.json" >/dev/null 2>&1; then status_copied=true; fi

          # Keep a redacted copy of the scanner's output whatever the exit status. A scanner
          # can exit 0 and still leave no usable report, and this is then the only evidence.
          # Run outside the checkout, without caller Python modules or user-site imports.
          cd "$RUNNER_TEMP"
          RAW_LOG="$raw_log" OUTPUT_DIR="$output_dir" \
            SENSITIVE_NSPECT_ID="$INPUT_NSPECT_ID" SENSITIVE_SBOM_NAME="$INPUT_SBOM_NAME" \
            env -u PYTHONPATH -u PYTHONHOME PYTHONNOUSERSITE=1 python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlsplit, urlunsplit

          raw = Path(os.environ["RAW_LOG"]).read_text(encoding="utf-8", errors="replace")
          sensitive_values = (
              os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", ""),
              os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", ""),
              os.environ.get("SENSITIVE_NSPECT_ID", ""),
              os.environ.get("SENSITIVE_SBOM_NAME", ""),
              os.environ.get("SCANNER_IMAGE_REF", ""),
          )

          def mask_known_values(text):
              """Remove configured private values before and after log decoding."""
              for value in sensitive_values:
                  if value:
                      text = text.replace(value, "[REDACTED]")
              return text

          raw = mask_known_values(raw)

          secret_key = (
              r"(?:authorization|proxy[_ .-]?authorization|cookie|set[_ .-]?cookie|"
              r"x-charon-gha-token|"
              r"(?:[a-z0-9_-]+[.])?api[._ -]?(?:token|key)|(?:x[._ -]?)?api[._ -]?key|"
              r"access[._ -]?token|id[._ -]?token|refresh[._ -]?token|"
              r"ssa[._ -]?token|client[._ -]?secret|token|secret|password)"
          )
          auth_scheme = r"(?:basic|bearer|token)"

          def redact_literals(text):
              """Consume complete structured credential values, including nested JSON."""
              decoder = json.JSONDecoder()
              assignment = re.compile(rf"(?i)(?:--)?[\"']?{secret_key}[\"']?\s*[:=]\s*")
              pieces = []
              cursor = 0
              for match in assignment.finditer(text):
                  start = match.end()
                  if start < cursor or start == len(text):
                      continue
                  if re.match(r"\[REDACTED[A-Z_]*\](?=$|[\s\"',;}}\]])", text[start:]):
                      continue
                  if text[start] not in '{[\"\'':
                      # Bare header values are opaque, not JSON number/bool prefixes.
                      continue
                  try:
                      _, end = decoder.raw_decode(text, start)
                      if not re.match(r"[ \t]*(?:[,}\]]|\r?\n|$)", text[end:]):
                          raise ValueError("literal prefix is not a complete value")
                      replacement = '"[REDACTED]"'
                  except ValueError:
                      quoted = re.match(r"'(?:[^'\\]|\\.)*'", text[start:])
                      if quoted and re.match(r"[ \t]*(?:[,}\]]|\r?\n|$)", text[start + quoted.end():]):
                          end = start + quoted.end()
                          replacement = "'[REDACTED]'"
                      elif text[start] in '{[\"\'':
                          # An incomplete structured credential could continue on later
                          # lines. Retain earlier errors, but never publish that remainder.
                          pieces.append(text[cursor:start])
                          pieces.append("[remaining output withheld: malformed credential value]\n")
                          return "".join(pieces)
                      else:
                          continue
                  pieces.extend((text[cursor:start], replacement))
                  cursor = end
              pieces.append(text[cursor:])
              return "".join(pieces)

          raw = redact_literals(raw)
          # Decode debug separators only after valid quoted values were consumed.
          # Preserve JSON quote/backslash escapes so strings cannot end prematurely.
          for _ in range(3):
              raw = unquote(raw)
              raw = re.sub(r"\\u00([0-9a-fA-F]{2})",
                           lambda m: m[0] if int(m[1], 16) in (34, 39, 92) else chr(int(m[1], 16)), raw)
              raw = mask_known_values(raw)
              raw = redact_literals(raw)
          # Escaped keys outside valid JSON cannot be decoded safely as log text.
          uncertain = re.search(rf"(?im)^.*(?:\\[\"']|\\u00(?:22|27|5c)).*{secret_key}.*$", raw)
          if uncertain:
              raw = raw[:uncertain.start()] + "[remaining output withheld: escaped credential field]\n"
          signed_url_key = (
              r"(?:token|access_token|id_token|jwt|sig|signature|key|secret|"
              r"x-amz-(?:signature|credential|security-token)|"
              r"x-goog-(?:signature|credential)|x-ms-(?:sig|signature|se))"
          )

          # Like \b, but a header may also follow a literal "\n" escape, as in HTTP debug output.
          boundary = r"(?:(?<![A-Za-z0-9_])|(?<=\\[nrt]))"

          def redact_value(match):
              """Replace a header or cookie value while preserving useful context."""
              value = match.group(2)
              quote = value[0] if len(value) > 1 and value[0] in "\"'" and value[-1] == value[0] else ""
              return f"{match.group(1)}{quote}[REDACTED]{quote}"

          patterns = (
              (re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]"), ""),
              (re.compile(r"(?<![A-Za-z0-9_-])eyJ[A-Za-z0-9_-]{8,}\."
                          r"[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}(?![A-Za-z0-9_-])"),
               "[REDACTED_JWT]"),
              (re.compile(rf"(?im)^([ \t]*(?:proxy[-_ .]?)?authorization[ \t]*[:=][ \t]*"
                          rf"{auth_scheme}[ \t]+)[^\r\n]+"), r"\1[REDACTED]"),
              # Any position, quoted or not, so every cookie pair is redacted, not only the first.
              (re.compile(rf"""(?i)({boundary}(?:set[-_]?)?cookie["']?[ \t]*[:=][ \t]*)"""
                          r"""("(?:[^"\\\r\n]|\\.)*"|'(?:[^'\\\r\n]|\\.)*'|[^\r\n]*\S)"""),
               redact_value),
              (re.compile(rf"(?i)((?:--)?[\"']?{secret_key}[\"']?\s*[:=]\s*[\"']?"
                          rf"(?!(?:{auth_scheme}\s+)?\[REDACTED)(?:{auth_scheme}\s+)?)"
                          rf"[^\s\"',;}}\]]+"), r"\1[REDACTED]"),
              (re.compile(r"(?i)\b(basic|bearer|token)\s+[A-Za-z0-9._~+/=-]+"),
               r"\1 [REDACTED]"),
              (re.compile(rf"(?i)([?&]{signed_url_key}=)[^&#\s\"'<>)]+"),
               r"\1[REDACTED]"),
              (re.compile(r"(?i)(https?://)[^/@\s:]+:[^/@\s]+@"), r"\1[REDACTED]@"),
          )
          for pattern, replacement in patterns:
              raw = pattern.sub(replacement, raw)

          def alias_url(match):
              """Keep route/error context without publishing deployment authorities."""
              try:
                  url = urlsplit(match.group())
                  return urlunsplit((url.scheme, "scanner.example", url.path, url.query, url.fragment))
              except ValueError:
                  return "[URL]"

          raw = re.sub(r"(?:https?|ssh)://[^\s\"'<>]+", alias_url, raw, flags=re.IGNORECASE)
          raw = re.sub(r"(?i)\b(?:[a-z0-9-]+\.)*(?:nvidia\.com|blackduck\.com|teleport\.sh)\b",
                       "scanner.example", raw)
          raw = re.sub(r"(?i)black[ _-]?duck", "open-source-scanner", raw)

          # Any position, quoted or not; whitespace stays inside each lookahead to skip redacted values.
          marker = r"[\"']?\[REDACTED[A-Z_]*\]"
          residual_patterns = (
              re.compile(r"(?<![A-Za-z0-9_-])eyJ[A-Za-z0-9_-]{8,}\."
                         r"[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}(?![A-Za-z0-9_-])"),
              re.compile(rf"(?i){boundary}(?:proxy[-_ ]?)?authorization[\"']?[ \t]*[:=][ \t]*[\"']?"
                         rf"{auth_scheme}(?![ \t]*\[REDACTED[A-Z_]*\])[ \t]+\S"),
              re.compile(rf"(?i){boundary}(?:set[-_]?)?cookie[\"']?[ \t]*[:=](?![ \t]*{marker})[ \t]*\S"),
              # A cookie pair left after the marker means only part of the value was redacted.
              re.compile(rf"(?i){boundary}(?:set[-_]?)?cookie[\"']?[ \t]*[:=][ \t]*{marker}"
                         r"[^\r\n]*?[;,][ \t]*[\w.-]+="),
              re.compile(rf"(?i)[?&]{signed_url_key}=(?!\[REDACTED\])[^&#\s\"'<>)]+"),
              re.compile(rf"(?i){boundary}[\"']?{secret_key}[\"']?[ \t]*[:=]"
                         rf"(?![ \t]*[\"']?(?:{auth_scheme}[ \t]+)?\[REDACTED)[ \t]*\S"),
          )
          # Drop only matching lines so the remaining diagnostics stay visible.
          raw = "".join(
              "[line removed: credential-shaped content remained after redaction]\n"
              if any(pattern.search(line) for pattern in residual_patterns) else line
              for line in raw.splitlines(keepends=True)
          )

          limit = 2_000_000
          if len(raw) > limit:
              half = limit // 2
              raw = raw[:half] + "\n[... sanitized log truncated ...]\n" + raw[-half:]
          destination = Path(os.environ["OUTPUT_DIR"]) / "scanner-failure.log"
          destination.write_text(raw, encoding="utf-8")
          destination.chmod(0o600)
          PY

          if [[ "$INPUT_SHOW_CONSOLE" == true ]]; then
            echo "::group::Scanner output (redacted)"
            marker="$(python3 -I -c 'import secrets; print(secrets.token_hex(24))')"
            echo "::stop-commands::$marker"
            cat "$output_dir/scanner-failure.log"
            printf '\n::%s::\n' "$marker"
            echo "::endgroup::"
          fi

          printf 'exit_code=%s\n' "$scanner_status" >> "$GITHUB_OUTPUT"
          if [[ "$scanner_status" == 0 && ( "$report_copied" != true || "$status_copied" != true ) ]]; then
            echo "::error::The scanner's current report or detailed status could not be collected."
            exit 1
          fi

      - name: Verify prepared Python analysis
        if: always() && inputs.python_wheels_artifact != '' && steps.scanner.outcome == 'success' && steps.scanner.outputs.exit_code == '0'
        env:
          CONTAINER_SCAN_PATH: ${{ steps.source.outputs.container_path }}
          INPUT_PYTHON_PROJECT: ${{ inputs.python_project }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              root = Path(os.environ["PULSE_OSS_SCAN_ROOT"]) / os.environ["CONTAINER_SCAN_PATH"].removeprefix("/workspace").lstrip("/")
              status = json.loads((root / "bd_nspect/status.json").read_text())
              expected = {"detect.python.path": "/scan-python/venv/bin/python",
                          "detect.pip.path": "/scan-python/venv/bin/pip",
                          "detect.included.detector.types": "PIP",
                          "detect.detector.search.depth": "0",
                          "detect.pip.requirements.path": "/scan-python/runtime-requirements.txt",
                          "detect.pip.only.project.tree": "true",
                          "detect.pip.project.name": os.environ["INPUT_PYTHON_PROJECT"]}
              detectors = status.get("detectors", [])
              if (any(status.get("propertyValues", {}).get(key) != value for key, value in expected.items())
                      or status.get("issues", []) or not detectors
                      or not all(item.get("detectorType") == "PIP" and item.get("status") == "SUCCESS"
                                 and item.get("detectorAccuracy") == "HIGH" and item.get("extracted") is True
                                 for item in detectors)):
                  raise ValueError("prepared runtime was not inspected")
          except (OSError, ValueError, TypeError, AttributeError):
              raise SystemExit("::error::Detect did not confirm complete Python inspection using the prepared environment.") from None
          print("Detect confirmed the prepared Python environment and successful installed-package inspection.")
          PY

      # Log text may only make a result stricter. It names the cause of a failure, or catches
      # a backend failure the CLI exited 0 on; it never turns a non-zero exit into a pass.
      - name: Classify scan result
        id: classify
        if: always() && steps.scanner.outputs.exit_code != ''
        env:
          SCANNER_STATUS: ${{ steps.scanner.outputs.exit_code }}
        run: |
          set -euo pipefail
          RAW_LOG="$PULSE_OSS_RAW_LOG" OUTPUT_DIR="$PULSE_OSS_OUTPUT_DIR" python3 -I - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          raw = Path(os.environ["RAW_LOG"]).read_text(
              encoding="utf-8", errors="replace").lower()
          exit_code = int(os.environ["SCANNER_STATUS"])
          # Findings are reported, not failed on (the scan runs --no-fail), so these mark a
          # completed scan that found something. They explain nothing about a non-zero exit.
          policy_markers = (
              "failure_policy_violation",
              "scan job found",
          )
          # Detect exits 3 on a policy violation and the CLI then logs "scan is failed with
          # status code" for a scan that completed, so these count as a backend failure only
          # where no policy marker accounts for them.
          backend_markers = (
              "rapid scan is failed with status code",
              "stateless scan is failed with status code",
          )
          named = "none"
          for marker, candidate in (
              ("github oidc token request failed", "github-identity-error"),
              ("unable to obtain github oidc", "github-identity-error"),
              ("charon request failed", "charon-gateway-error"),
              ("registration verification failed", "registration-or-service-error"),
              ("nspect verification failed", "registration-or-service-error"),
              ("invalid nspect id", "registration-or-service-error"),
              ("is not registered", "registration-or-service-error"),
              ("operation timed out", "timeout"),
          ):
              if marker in raw:
                  named = candidate
                  break
          policy = any(marker in raw for marker in policy_markers)
          backend = any(marker in raw for marker in backend_markers)
          code_suffixes = re.findall(
              r"(?:rapid|stateless) scan is failed with status code([^\r\n]*)", raw)
          # Only Detect's known policy result is non-operational. Generic policy text
          # must never excuse another scanner/request code or a failure without a code.
          backend_failure = backend and (not code_suffixes or any(
              re.fullmatch(r"[:=\s]*3\.?\s*", suffix) is None for suffix in code_suffixes))
          policy = policy or bool(code_suffixes and not backend_failure)

          status = exit_code
          if exit_code != 0:
              if named != "none":
                  category = named
              elif backend:
                  category = "downstream-scan-error"
              else:
                  category = "scanner-error"
          elif backend_failure:
              category = "downstream-scan-error"
              status = 70
          elif policy:
              category = "vulnerability-policy"
          else:
              category = named

          output_dir = Path(os.environ["OUTPUT_DIR"])
          (output_dir / "scanner-status.json").write_text(
              json.dumps({"scanner_exit_code": exit_code, "effective_status": status,
                          "diagnostic_category": category}, sort_keys=True) + "\n",
              encoding="utf-8")
          (output_dir / "effective-status").write_text(str(status), encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"effective_status={status}\n")
              output.write(f"diagnostic_category={category}\n")
          PY
          effective_status="$(cat "$PULSE_OSS_OUTPUT_DIR/effective-status")"

          if [[ "$effective_status" -ne 0 ]]; then
            # Put the reason in the log. Downloading an artifact to read one line of
            # sanitized output is too slow a diagnosis for a failing pipeline.
            failure_log="$PULSE_OSS_OUTPUT_DIR/scanner-failure.log"
            excerpt="$(grep -m1 -iE '^[[:space:]]*error[: ]' "$failure_log" || true)"
            [[ -n "$excerpt" ]] \
              || excerpt="$(grep -v '^[[:space:]]*$' "$failure_log" | tail -n 1 || true)"
            # Escape annotation syntax; print the remaining log with commands disabled.
            annotation="${excerpt:0:500}"
            annotation="${annotation//%/%25}"
            annotation="${annotation//$'\r'/%0D}"
            annotation="${annotation//$'\n'/%0A}"
            echo "::error::Scanner: $annotation"
            echo "::group::Sanitized scanner output (last 40 lines)"
            marker="$(python3 -I -c 'import secrets; print(secrets.token_hex(24))')"
            echo "::stop-commands::$marker"
            [[ -z "$excerpt" ]] || printf '%s\n' "${excerpt:0:500}"
            tail -n 40 "$failure_log" || true
            printf '\n::%s::\n' "$marker"
            echo "::endgroup::"
          fi

      - name: Validate detailed analysis status
        id: analysis
        if: always() && steps.classify.outputs.effective_status == '0'
        env:
          INPUT_SNIPPET_SCAN: ${{ inputs.snippet_scan }}
          CONTAINER_SCAN_PATH: ${{ steps.source.outputs.container_path }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path

          try:
              status = json.loads((Path(os.environ["PULSE_OSS_OUTPUT_DIR"]) / "detect-status.json").read_text())
              fields = ("status", "detectors", "operations", "overallStatus", "issues")
              if (not isinstance(status, dict)
                      or any(not isinstance(status.get(key), list) for key in fields)
                      or not all(status[key] for key in ("status", "operations", "overallStatus"))):
                  raise ValueError("incomplete")
              if (any(not isinstance(item, dict) or item.get("status") != "SUCCESS"
                      for item in status["status"] + status["operations"])
                      or any(not isinstance(item, dict) or item.get("status") not in ("SUCCESS", "ATTEMPTED")
                             for item in status["detectors"])
                      or any(not isinstance(item, dict) or item.get("key") not in ("SUCCESS", "FAILURE_POLICY_VIOLATION")
                             for item in status["overallStatus"])
                      or any(not isinstance(item, dict) or item.get("type") == "EXCEPTION" for item in status["issues"])):
                  raise ValueError("analysis failure")
              if os.environ.get("INPUT_SNIPPET_SCAN") == "true":
                  root = os.environ["CONTAINER_SCAN_PATH"].rstrip("/") or "/"
                  signature_keys = {"SIGNATURE_SCAN", f"Signature scan on {root}",
                                    f"Signature scan / Snippet scan on {root}"}
                  if not any(item.get("key") in signature_keys for item in status["status"]):
                      raise ValueError("signature scan missing for the selected root")
          except (OSError, ValueError, TypeError):
              raise SystemExit("::error::Fresh Detect status is missing, incomplete or failed. A report alone is not a completed scan.") from None
          print("Detailed Detect status confirms completed analysis.")
          PY

      - name: Validate scan report
        id: report
        # A failed scanner leaves no report worth reading, so validating it would only report
        # the symptom and bury the cause.
        if: always() && steps.classify.outcome == 'success' && steps.classify.outputs.effective_status == '0' && steps.analysis.outcome == 'success'
        env:
          INPUT_NSPECT_ID: ${{ inputs.nspect_id }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="$PULSE_OSS_OUTPUT_DIR" python3 -I - <<'PY'
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path
          from urllib.parse import unquote, urlsplit, urlunsplit

          report = Path(os.environ["OUTPUT_DIR"]) / "vulnerability-report.json"
          diagnostic = Path(os.environ["OUTPUT_DIR"]) / "report-diagnostic.json"

          # Structure only — never values. A rejected report is the one thing a live scan
          # cannot be re-run to inspect, and the raw file may not have been credential-scanned.
          def describe(**fields):
              """Record structural failure evidence without report values or credentials."""
              diagnostic.write_text(json.dumps(fields, indent=2, sort_keys=True), encoding="utf-8")
              diagnostic.chmod(0o600)

          def publish(safe):
              """Permit rejected-report publication only after its credential check."""
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write(f"report_safe={'true' if safe else 'false'}\n")

          try:
              raw = report.read_bytes()
          except OSError:
              describe(exists=False, credential_scan="skipped")
              publish(False)
              raise SystemExit("::error::The scan report is missing or is not valid JSON.")

          try:
              payload = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError):
              describe(exists=True, bytes=len(raw), parsed=False, credential_scan="skipped")
              publish(False)
              raise SystemExit("::error::The scan report is missing or is not valid JSON.")

          jwt_value = re.compile(r"(?<![A-Za-z0-9_-])eyJ[A-Za-z0-9_-]{8,}\."
                                 r"[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}(?![A-Za-z0-9_-])")
          bearer_value = re.compile(r"\b(?:basic|bearer|token)\s+[A-Za-z0-9._~+/=-]{8,}", re.IGNORECASE)
          signed_url = re.compile(
              r"[?&](?:token|access_token|id_token|jwt|sig|signature|"
              r"x-amz-(?:signature|credential|security-token)|x-goog-(?:signature|credential)|"
              r"x-ms-(?:sig|signature|se)|key|secret)=", re.IGNORECASE)
          sensitive_key = re.compile(
              r"(^|_)(authorization|proxy_authorization|cookie|set_cookie|api_key|api_token|"
              r"token|secret|access_token|id_token|refresh_token|client_secret|password|"
              r"credential|x_charon_gha_token)($|_)")

          def normalized_key(value):
              """Recognize credential keys across supported naming conventions."""
              value = re.sub(r"([a-z0-9])([A-Z])", r"\1_\2", value)
              return re.sub(r"[^A-Za-z0-9]+", "_", value).strip("_").lower()

          def inspect(value):
              """Fail closed on credential-shaped fields or values throughout a report."""
              if isinstance(value, dict):
                  for key, child in value.items():
                      if sensitive_key.search(normalized_key(str(key))):
                          raise SystemExit(
                              "::error::The scan report contains a credential-like field.")
                      inspect(child)
              elif isinstance(value, list):
                  for child in value:
                      inspect(child)
              elif isinstance(value, str):
                  for _ in range(3):
                      value = unquote(value)
                      value = re.sub(r"\\u00([0-9a-fA-F]{2})", lambda m: chr(int(m[1], 16)), value)
                  if jwt_value.search(value) or bearer_value.search(value) or signed_url.search(value):
                      raise SystemExit("::error::The scan report contains a credential-like value.")

          try:
              inspect(payload)
          except SystemExit:
              describe(exists=True, bytes=len(raw), parsed=True, credential_scan="failed")
              publish(False)
              raise

          def abstract(value):
              """Keep report structure and findings while removing deployment destinations."""
              if isinstance(value, dict):
                  return {key: abstract(child) for key, child in value.items()}
              if isinstance(value, list):
                  return [abstract(child) for child in value]
              if not isinstance(value, str):
                  return value
              def alias_url(match):
                  """Preserve URL paths but replace identifying authorities."""
                  try:
                      url = urlsplit(match.group())
                      return urlunsplit((url.scheme, "scanner.example", url.path, url.query, url.fragment))
                  except ValueError:
                      return "[URL]"
              value = re.sub(r"(?:https?|ssh)://[^\s\"'<>]+", alias_url, value, flags=re.IGNORECASE)
              return re.sub(r"(?i)\b(?:[a-z0-9-]+\.)*(?:nvidia\.com|blackduck\.com|teleport\.sh)\b",
                            "scanner.example", value)

          payload = abstract(payload)
          report.write_text(json.dumps(payload, ensure_ascii=True) + "\n", encoding="utf-8")
          report.chmod(0o600)

          # Past the credential scan the payload is safe to publish for diagnosis.
          publish(True)

          # An empty findings list means "clean" only if the backend was actually consulted.
          # A registered scan whose envelope reports nspectVerified false was not verified
          # against its registration, and accepting that would turn a backend refusal into a
          # passing scan. Checked only when the scanner reports the field, so an older report
          # shape still validates, and only for the registered lane — unregistered scans
          # report false correctly, having deliberately skipped nSpect.
          if os.environ.get("INPUT_NSPECT_ID") and isinstance(payload, dict) \
                  and "nspectVerified" in payload and payload["nspectVerified"] is not True:
              describe(
                  exists=True,
                  bytes=len(raw),
                  parsed=True,
                  credential_scan="passed",
                  nspect_verified=payload["nspectVerified"],
              )
              raise SystemExit(
                  "::error::The scan reported nspectVerified=false for a registered scan. "
                  "Its findings were never verified against nspect_id, so the result is not "
                  "a pass. Check the Charon tenant grants and the nSpect registration.")

          findings = None
          unfiltered = None
          if isinstance(payload, dict):
              if "filtered" in payload or "raw" in payload:
                  if (not all(isinstance(payload.get(key), list) for key in ("raw", "filtered"))
                          or any(key in payload for key in ("Data", "data", "vulnerabilities", "items", "results"))):
                      raise SystemExit("::error::The report envelope is incomplete or mixes incompatible schemas.")
              for key in ("status", "scanStatus", "overallStatus"):
                  if key in payload and str(payload[key]).upper() not in ("SUCCESS", "COMPLETED", "COMPLETE"):
                      raise SystemExit("::error::The report does not describe a completed scan.")
          if isinstance(payload, list):
              findings = payload
          elif isinstance(payload, dict):
              # "filtered" first: newer scanners wrap the report as {raw, filtered, ...}, and
              # only "filtered" has the allowlist and approved exceptions applied. Enforcing on
              # "raw" would fail a build for findings ProdSec has already excepted.
              for key in ("filtered", "Data", "data", "vulnerabilities", "items", "results"):
                  if isinstance(payload.get(key), list):
                      findings = payload[key]
                      break
              if isinstance(payload.get("raw"), list):
                  unfiltered = len(payload["raw"])
          if findings is None:
              describe(
                  exists=True,
                  bytes=len(raw),
                  parsed=True,
                  credential_scan="passed",
                  top_level_type=type(payload).__name__,
                  top_level_keys=sorted(payload)[:50] if isinstance(payload, dict) else None,
              )
              raise SystemExit(
                  "::error::The scan report does not contain a supported findings list.")

          # Severity field names vary by report version, so tally whatever *severity key is there.
          severities = Counter()
          for finding in findings:
              if not isinstance(finding, dict):
                  continue
              for key, value in finding.items():
                  if normalized_key(str(key)).endswith("severity") and isinstance(value, str):
                      level = value.strip().lower() or "unspecified"
                      if level not in {"critical", "high", "medium", "moderate", "low", "negligible",
                                       "info", "informational", "unknown", "unspecified"}:
                          level = "other"
                      severities[level] += 1
                      break
          breakdown = ", ".join(
              f"{name}: {count}" for name, count in sorted(severities.items())
          ) or "not reported"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"finding_count={len(findings)}\n")
              output.write(f"severity_breakdown={breakdown}\n")
              # Surfaced for visibility only; enforcement reads finding_count.
              if unfiltered is not None and unfiltered != len(findings):
                  output.write(f"unfiltered_count={unfiltered}\n")
          PY

      - name: Write scan summary
        if: always()
        env:
          RESOLVED_MODE: ${{ steps.contract.outputs.resolved_mode || 'unavailable' }}
          FAILURE_POLICY: ${{ inputs.failure_policy }}
          WRITEBACK: ${{ inputs.inventory_writeback }}
          SCAN_PATH: ${{ inputs.scan_path }}
          BUILD_MODE: ${{ inputs.build }}
          FINDING_COUNT: ${{ steps.report.outputs.finding_count || 'unavailable' }}
          SEVERITY_BREAKDOWN: ${{ steps.report.outputs.severity_breakdown || 'unavailable' }}
          UNFILTERED_COUNT: ${{ steps.report.outputs.unfiltered_count }}
          REPORT_STATUS: ${{ steps.report.outcome }}
          DIAGNOSTIC_CATEGORY: ${{ steps.classify.outputs.diagnostic_category || 'none' }}
          SCANNER_EXIT: ${{ steps.scanner.outputs.exit_code || 'unavailable' }}
          SCANNER_DIGEST: ${{ steps.image.outputs.digest || 'unavailable' }}
        run: |
          {
            echo "## Vulnerability scan (Pulse OSS)"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Scanner image digest | \`$SCANNER_DIGEST\` |"
            echo "| Resolved mode | $RESOLVED_MODE |"
            echo "| Scan path | $SCAN_PATH |"
            echo "| Build mode | $BUILD_MODE |"
            echo "| Failure policy | $FAILURE_POLICY |"
            echo "| Inventory write-back | $WRITEBACK |"
            echo "| Scanner exit code | $SCANNER_EXIT |"
            echo "| Status-only diagnostic | $DIAGNOSTIC_CATEGORY |"
            echo "| Findings | $FINDING_COUNT |"
            # Only when the scanner filtered something, so a clean scan stays quiet.
            [[ -z "$UNFILTERED_COUNT" ]] \
              || echo "| Before allowlist and exceptions | $UNFILTERED_COUNT |"
            echo "| Severity breakdown | $SEVERITY_BREAKDOWN |"
            echo "| Report validation | $REPORT_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validated report
        if: always() && inputs.upload_report && steps.report.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pulse-oss-scan-${{ steps.contract.outputs.artifact_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULSE_OSS_OUTPUT_DIR }}/vulnerability-report.json
          if-no-files-found: error
          retention-days: 3

      # A scanner that exits 0 and then fails validation uploaded nothing at all, which
      # left the rejected report — the only evidence of why — discarded with the runner.
      - name: Upload report diagnostics
        if: always() && steps.report.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pulse-oss-report-diagnostic-${{ steps.contract.outputs.artifact_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULSE_OSS_OUTPUT_DIR }}/report-diagnostic.json
          if-no-files-found: warn
          retention-days: 3

      # Only once the credential scan has passed; an unparsable report never reached it.
      - name: Upload rejected report
        if: always() && inputs.upload_report && steps.report.outcome == 'failure' && steps.report.outputs.report_safe == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pulse-oss-rejected-report-${{ steps.contract.outputs.artifact_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PULSE_OSS_OUTPUT_DIR }}/vulnerability-report.json
          if-no-files-found: warn
          retention-days: 3

      - name: Upload sanitized failure diagnostics
        if: always() && (steps.classify.outputs.effective_status != '0' || steps.analysis.outcome == 'failure' || steps.report.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pulse-oss-scan-failure-${{ steps.contract.outputs.artifact_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PULSE_OSS_OUTPUT_DIR }}/scanner-status.json
            ${{ env.PULSE_OSS_OUTPUT_DIR }}/scanner-failure.log
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce scan result
        if: always()
        env:
          FAILURE_POLICY: ${{ inputs.failure_policy }}
          FINDING_COUNT: ${{ steps.report.outputs.finding_count || '0' }}
          UNFILTERED_COUNT: ${{ steps.report.outputs.unfiltered_count }}
          REPORT_STATUS: ${{ steps.report.outcome }}
          EFFECTIVE_STATUS: ${{ steps.classify.outputs.effective_status || '' }}
          DIAGNOSTIC_CATEGORY: ${{ steps.classify.outputs.diagnostic_category || 'unavailable' }}
        run: |
          set -euo pipefail
          # Fail closed: a missing, malformed, or credential-bearing report is never a pass.
          if [[ -z "$EFFECTIVE_STATUS" ]]; then
            echo "::error::The scan did not run to completion — no scanner exit code was recorded."
            exit 1
          fi
          # First, whatever the report holds: findings never excuse a failed scan, and naming
          # a missing report instead would send the reader after the symptom.
          if [[ "$EFFECTIVE_STATUS" != 0 ]]; then
            echo "::error::The Pulse OSS scan failed (${DIAGNOSTIC_CATEGORY}), so none of its output is trusted. See the sanitized scanner output under Classify scan result."
            exit 1
          fi
          if [[ "$REPORT_STATUS" != success ]]; then
            echo "::error::The scan did not produce a safe, valid report."
            exit 1
          fi
          # Keep the existing fail-closed policy when a backend violation has no findings.
          if [[ "$DIAGNOSTIC_CATEGORY" == vulnerability-policy ]] \
            && (( ${UNFILTERED_COUNT:-$FINDING_COUNT} == 0 )); then
            echo "::error::The scanner reported a policy violation, but the validated report holds no findings to account for it, so the result is not a pass."
            exit 1
          fi
          if [[ "$FAILURE_POLICY" == fail-on-vulnerability ]] && (( FINDING_COUNT > 0 )); then
            echo "::error::Pulse OSS scan: ${FINDING_COUNT} vulnerability finding(s) violate failure_policy=fail-on-vulnerability."
            exit 1
          fi
          if (( FINDING_COUNT > 0 )); then
            echo "::warning::Pulse OSS scan: ${FINDING_COUNT} vulnerability finding(s) do not block under failure_policy=report-only."
          else
            echo "::notice::Pulse OSS scan: no vulnerability findings."
          fi

      - name: Remove temporary scanner state
        if: always()
        run: |
          set -uo pipefail
          cleanup_failed=0
          if [[ -n "${PULSE_OSS_TBOT_PID:-}" ]]; then
            kill "$PULSE_OSS_TBOT_PID" 2>/dev/null || true
            wait "$PULSE_OSS_TBOT_PID" 2>/dev/null || true
          fi
          if [[ -n "${PULSE_OSS_CONTAINER:-}" ]]; then
            docker rm --force "$PULSE_OSS_CONTAINER" >/dev/null 2>&1 || cleanup_failed=1
            remaining="$(docker container ls --all --filter "name=^/${PULSE_OSS_CONTAINER}$" --format '{{.Names}}')" \
              || cleanup_failed=1
            [[ -z "$remaining" ]] || cleanup_failed=1
          fi
          # Keep the verified immutable image cached; it contains no per-job credentials.
          for path in "${PULSE_OSS_TBOT_CONFIG:-}" "${PULSE_OSS_TBOT_LOG:-}" \
            "${PULSE_OSS_RAW_LOG:-}" "${DOCKER_CONFIG:-}" "${PULSE_OSS_SCAN_ROOT:-}" \
            "$RUNNER_TEMP/pulse-oss-detect.env" "${PULSE_OSS_OUTPUT_DIR:-}" \
            "${PULSE_OSS_PYTHON_ENV_FILE:-}" "$RUNNER_TEMP/pulse-oss-python-wheels"; do
            [[ -n "$path" ]] || continue
            if [[ "$path" != "$RUNNER_TEMP/"* || "$path" == *"/../"* ]]; then
              echo "::error::Refusing cleanup outside the job's temporary directory."
              cleanup_failed=1
              continue
            fi
            rm -rf -- "$path" || cleanup_failed=1
          done
          # Remove the setup container before its private Python environment volume.
          if [[ -n "${PULSE_OSS_PYTHON_VOLUME:-}" ]]; then
            if docker container inspect "$PULSE_OSS_PYTHON_PREP_CONTAINER" >/dev/null 2>&1; then
              docker rm --force "$PULSE_OSS_PYTHON_PREP_CONTAINER" >/dev/null || cleanup_failed=1
            fi
            docker volume rm "$PULSE_OSS_PYTHON_VOLUME" >/dev/null || cleanup_failed=1
          fi
          if (( cleanup_failed )); then
            echo "::error::Temporary scanner state was not fully removed."
            exit 1
          fi
