#
# Security Workflows — Secret Scan (Pulse) reusable workflow.
#
# The CI enforcement lane for secret scanning. Runs the NVIDIA-licensed
# TruffleHog Enterprise engine from the SDS-maintained Pulse Secret Scanner
#
# Auth: the job mints a GitHub OIDC token, exchanges it at NVIDIA Vault for short-lived
# nvcr.io credentials, and logs in. No long-lived registry secret is stored in the repo
#
# Visibility: by default only the pass/fail gate is published. Detail is opt-in via
# `upload-sarif`, which sends redacted results to code scanning (maintainer-only).

name: Secret Scan (Pulse)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label to run on (an nv-gha-runners label).
        type: string
        required: false
        default: linux-amd64-cpu4
      extra-args:
        description: Additional scanner arguments.
        type: string
        required: false
        default: '--results=verified'
      fail-on-findings:
        description: Fail the workflow when secrets are found.
        type: boolean
        required: false
        default: true
      upload-sarif:
        description: >-
          Publish the redacted SARIF to GitHub code scanning (Security tab).
          Requires code scanning to be available — free on public repos, but needs GitHub Advanced Security on private/internal repos.
        type: boolean
        required: false
        default: false
      upload-artifact:
        description: >-
          Upload the redacted SARIF as a downloadable build artifact (works without GitHub Advanced Security).
          The raw findings JSON is never uploaded. WARNING: on a public repo, artifacts are world-downloadable.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write
  security-events: write  # only exercised when `upload-sarif: true` (capped by caller)
  actions: read           # codeql-action/upload-sarif reads the workflow run via the Actions API

jobs:
  pulse:
    runs-on: ${{ inputs.runs-on }}
    env:
      PULSE_IMAGE: ${{ vars.SECRET_SCAN_PULSE_IMAGE }}:${{ vars.SECRET_SCAN_PULSE_IMAGE_TAG }}
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false  # don't leave GITHUB_TOKEN in .git for the scanned tree

      - name: Import nvcr.io credentials from Vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b  # v3.4.0
        with:
          url: ${{ vars.NV_VAULT_URL }}
          role: ${{ vars.NVCR_VAULT_ROLE }}
          method: jwt
          path: ${{ vars.NVCR_VAULT_JWT_PATH }}
          jwtGithubAudience: https://token.actions.githubusercontent.com
          namespace: ${{ vars.NVCR_VAULT_NAMESPACE }}
          secrets: |
            ${{ vars.NVCR_VAULT_SECRET_PATH }} username | NVCR_IO_USERNAME ;
            ${{ vars.NVCR_VAULT_SECRET_PATH }} password | NVCR_IO_PASSWORD

      - name: Log in to nvcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: nvcr.io
          username: ${{ env.NVCR_IO_USERNAME }}
          password: ${{ env.NVCR_IO_PASSWORD }}

      - name: Pull Pulse Secret Scanner image
        run: docker pull "$PULSE_IMAGE"

      - name: Pulse secret scan
        env:
          # Passed into the container via `-e` (not `${{ }}` interpolation
          # into the runner shell) to avoid injection through the
          # `extra-args` input. Word-split into argv inside the container.
          EXTRA_ARGS: ${{ inputs.extra-args }}
        run: |
          # TruffleHog/Pulse has no native SARIF; capture JSON findings from
          # stdout (converted below). Write outside the checked-out tree
          # ($RUNNER_TEMP) so PR-committed files can't be picked up. stderr
          # stays in the log. `--fail` drives the exit code, interpreted here
          # per the Scanspect component.
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo \
            -e EXTRA_ARGS \
            --entrypoint bash \
            "$PULSE_IMAGE" \
            -lc 'pulse-secret-scanner filesystem /repo $EXTRA_ARGS --json --fail' \
            > "$RUNNER_TEMP/pulse-results.json"
          code=$?
          set -e
          echo "PULSE_EXIT=$code" >> "$GITHUB_ENV"

          case "$code" in
            0)   echo "::notice::Pulse secret scan: no secrets found." ;;
            189) echo "::notice::Pulse secret scan: all results allowlisted." ;;
            183) echo "::error::Pulse secret scan: verified/live secrets found — rotate immediately." ;;
            185) echo "::error::Pulse secret scan: unverified results found — review and allowlist if needed." ;;
            *)   echo "::error::pulse-secret-scanner exited with unexpected code ${code}." ;;
          esac

      # Clear the nvcr.io credentials from the runner's Docker config as soon as the last registry operation is done.
      - name: Log out of nvcr.io
        if: always()
        run: docker logout nvcr.io

      - name: Convert findings to SARIF
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          src = tmp / "pulse-results.json"
          results, rules = [], {}
          if src.exists():
              for raw in src.read_text(errors="replace").splitlines():
                  raw = raw.strip()
                  if not raw:
                      continue
                  try:
                      f = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(f, dict) or "DetectorName" not in f:
                      continue
                  detector = str(f.get("DetectorName") or "UnknownDetector")
                  verified = bool(f.get("Verified"))
                  meta = (f.get("SourceMetadata") or {}).get("Data") or {}
                  fpath = fline = None
                  for v in meta.values():
                      if isinstance(v, dict):
                          fpath = v.get("file") or fpath
                          fline = v.get("line") or fline
                  rules.setdefault(detector, {
                      "id": detector,
                      "name": detector,
                      "shortDescription": {"text": detector + " secret detector"},
                  })
                  locations = []
                  if fpath:
                      uri = str(fpath)
                      if uri.startswith("/repo/"):
                          uri = uri[len("/repo/"):]
                      locations = [{"physicalLocation": {
                          "artifactLocation": {"uri": uri},
                          "region": {"startLine": int(fline) if fline else 1},
                      }}]
                  results.append({
                      "ruleId": detector,
                      "level": "error" if verified else "warning",
                      "message": {"text": detector + (" verified" if verified else " unverified")
                                  + " secret detected (value redacted; see job log)."},
                      "locations": locations,
                  })
          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {"driver": {
                      "name": "Pulse Secret Scanner",
                      "informationUri": "https://github.com/NVIDIA/security-workflows",
                      "rules": list(rules.values()),
                  }},
                  "results": results,
              }],
          }
          (tmp / "pulse-results.sarif").write_text(json.dumps(sarif, indent=2))
          print("Wrote pulse-results.sarif with %d result(s)." % len(results))
          PY

      - name: Upload SARIF artifact
        if: ${{ always() && inputs.upload-artifact }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pulse-secret-scan-sarif
          path: ${{ runner.temp }}/pulse-results.sarif
          retention-days: 7
          if-no-files-found: warn

      - name: Upload SARIF to code scanning
        if: ${{ always() && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          sarif_file: ${{ runner.temp }}/pulse-results.sarif
          category: secret-scan-pulse

      - name: Enforce scan result
        if: always()
        env:
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          code="${PULSE_EXIT:-0}"
          # Clean / all-allowlisted -> pass.
          if [ "$code" = "0" ] || [ "$code" = "189" ]; then exit 0; fi
          # Anything other than a findings code is a real scanner error -> always fail.
          if [ "$code" != "183" ] && [ "$code" != "185" ]; then
            echo "::error::pulse-secret-scanner error (exit ${code})."
            exit "$code"
          fi
          # Findings: honour the fail-on-findings knob.
          if [ "$FAIL_ON_FINDINGS" = "true" ]; then exit "$code"; fi
          echo "::warning::fail-on-findings=false — findings detected but not failing the job."
          exit 0
