#
# Security Workflows — Secret Scan (Pulse) reusable workflow.
#
# Runs the NVIDIA-licensed TruffleHog Enterprise engine from the SDS-maintained Pulse Secret Scanner

name: Secret Scan (Pulse)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label to run on (an nv-gha-runners label).
        type: string
        required: false
        default: linux-amd64-cpu4
      failure_policy:
        description: >-
          Pipeline failure behavior on findings.
          The scan always surfaces every finding class i.e. verified, unknown, and unverified.
          This input only decides which classes fail the job.
          Allowed:
          - unverified (default) — keep the job green on exit 185 (unverified); fail on verified/live secrets (183).
          - strict — fail on any finding (verified 183 or unverified 185).
          - all — allow any finding; never fail the job (warn only).
        type: string
        required: false
        default: unverified
      ci_test_setup:
        description: >-
          CI self-test only. When true — and only when the caller is NVIDIA/security-workflows
          A disposable RSA key fixture is planted in the checked-out tree before the scan so the negative failure_policy
          paths can be exercised end-to-end through this reusable workflow.
          It is inert in every other repository. Never enable in production consumers.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write
  security-events: write  # publish SARIF to code scanning
  actions: read           # codeql-action/upload-sarif reads the workflow run via the Actions API

jobs:
  pulse:
    runs-on: ${{ inputs.runs-on }}
    env:
      PULSE_IMAGE: ${{ vars.SECRET_SCAN_PULSE_IMAGE }}:${{ vars.SECRET_SCAN_PULSE_IMAGE_TAG }}
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false  # don't leave GITHUB_TOKEN in .git for the scanned tree

      # CI self-test only. Plants a disposable finding so the negative failure_policy paths can be exercised end-to-end.
      # it is inert for every downstream consumer even if the flag is passed.
      - name: (self-test) Create disposable secret fixture
        if: ${{ inputs.ci_test_setup && github.repository == 'NVIDIA/security-workflows' }}
        run: |
          echo "::warning::ci_test_setup is enabled — planting a disposable RSA key fixture for CI self-test."
          mkdir -p "${{ github.workspace }}/.pulse-selftest"
          openssl genrsa -out "${{ github.workspace }}/.pulse-selftest/id_rsa" 2048 2>/dev/null

      - name: Import nvcr.io credentials from Vault
        uses: hashicorp/vault-action@4c06c5ccf5c0761b6029f56cfb1dcf5565918a3b  # v3.4.0
        with:
          url: ${{ vars.NV_VAULT_URL }}
          role: ${{ vars.NVCR_VAULT_ROLE }}
          method: jwt
          path: ${{ vars.NVCR_VAULT_JWT_PATH }}
          jwtGithubAudience: https://token.actions.githubusercontent.com
          namespace: ${{ vars.NVCR_VAULT_NAMESPACE }}
          secrets: |
            ${{ vars.NVCR_VAULT_SECRET_PATH }} username | NVCR_IO_USERNAME ;
            ${{ vars.NVCR_VAULT_SECRET_PATH }} password | NVCR_IO_PASSWORD

      - name: Log in to nvcr.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: nvcr.io
          username: ${{ env.NVCR_IO_USERNAME }}
          password: ${{ env.NVCR_IO_PASSWORD }}

      - name: Pull Pulse Secret Scanner image
        run: docker pull "$PULSE_IMAGE"

      - name: Pulse secret scan
        env:
          FAILURE_POLICY: ${{ inputs.failure_policy }}
        run: |
          # Capture scanner stdout/stderr to $RUNNER_TEMP (not the job log).
          # JSON findings are converted to SARIF in the next step.
          # `--fail` exit codes are interpreted in Enforce scan result.
          #
          # Always scan with the broadest result filter so every finding class (verified, unknown, unverified) reaches SARIF.
          # Enforcement is decided solely by failure_policy in the Enforce scan result step.
          case "$FAILURE_POLICY" in
            unverified|strict|all) ;;
            *)
              echo "::error::Invalid failure_policy value: ${FAILURE_POLICY}"
              exit 2
              ;;
          esac
          set +e
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -w /repo \
            --entrypoint pulse-secret-scanner \
            "$PULSE_IMAGE" \
            filesystem /repo --results=verified,unknown,unverified --json --fail \
            > "$RUNNER_TEMP/pulse-secret-scan-results.json" 2> "$RUNNER_TEMP/pulse-secret-scan-stderr.log"
          code=$?
          set -e
          echo "PULSE_EXIT=$code" >> "$GITHUB_ENV"
          case "$code" in
            0|189|183|185) echo "PULSE_SCAN_OK=true" >> "$GITHUB_ENV" ;;
          esac

          case "$code" in
            0)   echo "::notice::Pulse secret scan: no secrets found." ;;
            189) echo "::notice::Pulse secret scan: all results allowlisted." ;;
            183)
              if [ "$FAILURE_POLICY" = "all" ]; then
                echo "::warning::Pulse secret scan: verified/live secrets found — rotate immediately (failure_policy=all; not failing the job)."
              else
                echo "::error::Pulse secret scan: verified/live secrets found — rotate immediately."
              fi
              ;;
            185)
              if [ "$FAILURE_POLICY" = "strict" ]; then
                echo "::error::Pulse secret scan: unverified results found — review and allowlist if needed."
              else
                echo "::warning::Pulse secret scan: unverified results found — review and allowlist if needed."
              fi
              ;;
            *)   echo "::error::pulse-secret-scanner exited with unexpected code ${code}. stderr captured to \$RUNNER_TEMP/pulse-secret-scan-stderr.log" ;;
          esac

      # Clear the nvcr.io credentials from the runner's Docker config as soon as the last registry operation is done.
      - name: Log out of nvcr.io
        if: always()
        run: docker logout nvcr.io

      - name: Convert findings to SARIF
        if: env.PULSE_SCAN_OK == 'true'
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          tmp = pathlib.Path(os.environ["RUNNER_TEMP"])
          src = tmp / "pulse-secret-scan-results.json"
          results, rules = [], {}
          if src.exists():
              for raw in src.read_text(errors="replace").splitlines():
                  raw = raw.strip()
                  if not raw:
                      continue
                  try:
                      f = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  if not isinstance(f, dict) or "DetectorName" not in f:
                      continue
                  detector = str(f.get("DetectorName") or "UnknownDetector")
                  # Three-way verification state, mirroring Pulse/TruffleHog --results:
                  #   verified   — Verified == true
                  #   unknown    — verification attempted but errored/indeterminate
                  #   unverified — verification ran and did not confirm the secret
                  if bool(f.get("Verified")):
                      state = "verified"
                  elif f.get("VerificationError"):
                      state = "unknown"
                  else:
                      state = "unverified"
                  meta = (f.get("SourceMetadata") or {}).get("Data") or {}
                  fpath = fline = None
                  for v in meta.values():
                      if isinstance(v, dict):
                          fpath = v.get("file") or fpath
                          fline = v.get("line") or fline
                  rules.setdefault(detector, {
                      "id": detector,
                      "name": detector,
                      "shortDescription": {"text": detector + " secret detector"},
                  })
                  locations = []
                  if fpath:
                      uri = str(fpath)
                      if uri.startswith("/repo/"):
                          uri = uri[len("/repo/"):]
                      locations = [{"physicalLocation": {
                          "artifactLocation": {"uri": uri},
                          "region": {"startLine": int(fline) if fline else 1},
                      }}]
                  results.append({
                      "ruleId": detector,
                      # verified -> error; unknown/unverified -> warning. The three
                      # states stay distinct via the message text and properties.
                      "level": "error" if state == "verified" else "warning",
                      "message": {"text": "%s %s secret detected (value redacted)." % (detector, state)},
                      "locations": locations,
                      "properties": {"verificationState": state},
                  })
          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {"driver": {
                      "name": "Pulse Secret Scanner",
                      "informationUri": "https://github.com/NVIDIA/security-workflows",
                      "rules": list(rules.values()),
                  }},
                  "results": results,
              }],
          }
          (tmp / "pulse-secret-scan.sarif").write_text(json.dumps(sarif, indent=2))
          print("Wrote pulse-secret-scan.sarif with %d result(s)." % len(results))
          PY

      - name: Upload SARIF to code scanning
        if: env.PULSE_SCAN_OK == 'true'
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          sarif_file: ${{ runner.temp }}/pulse-secret-scan.sarif
          category: pulse-secret-scan

      - name: Enforce scan result
        if: always()
        env:
          FAILURE_POLICY: ${{ inputs.failure_policy }}
        run: |
          if [ -z "${PULSE_EXIT:-}" ]; then
            echo "::error::Pulse secret scan did not complete — exit code missing."
            exit 1
          fi
          code="${PULSE_EXIT}"
          # Clean / all-allowlisted -> pass.
          if [ "$code" = "0" ] || [ "$code" = "189" ]; then exit 0; fi

          # Anything other than a findings code is a real scanner error -> always fail.
          if [ "$code" != "183" ] && [ "$code" != "185" ]; then
            exit "$code"
          fi

          # Findings: honour failure_policy (names match the GitLab secret-scan component).
          # This step only decides the job exit code (no duplicate messages).
          #   unverified — fail on verified/live (183); pass on unverified (185)
          #   strict     — fail on verified (183) or unverified (185)
          #   all        — pass on findings (warn only)
          case "$FAILURE_POLICY" in
            unverified)
              if [ "$code" = "183" ]; then exit 183; fi
              exit 0
              ;;
            strict)
              exit "$code"
              ;;
            all)
              exit 0
              ;;
            *)
              echo "::error::Invalid failure_policy value: ${FAILURE_POLICY}"
              exit 2
              ;;
          esac
