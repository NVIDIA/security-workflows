name: Service route probe
description: Validate an approved service route without logging identity or response data.

inputs:
  service-label:
    description: Non-sensitive capability label used in status messages.
    required: true
  tunnel-proxy-server:
    description: Approved tunnel proxy host and port.
    required: true
  tunnel-join-token:
    description: Approved workload-identity join token.
    required: true
  tunnel-application:
    description: Approved gateway application name.
    required: true
  tunnel-local-port:
    description: Loopback port for the local application tunnel.
    required: true
  tunnel-client-command:
    description: Installed tunnel client executable.
    required: true
  tunnel-client-version:
    description: Pinned tunnel client version.
    required: true
  identity-audience:
    description: GitHub OIDC audience accepted by the gateway.
    required: true
  identity-header-name:
    description: Header used to send the GitHub OIDC token.
    required: true
  health-path:
    description: Gateway path for the service health endpoint.
    required: true

runs:
  using: composite
  steps:
    - name: Install service tunnel client
      uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1
      with:
        version: ${{ inputs.tunnel-client-version }}

    - name: Validate service route
      shell: bash
      env:
        SERVICE_LABEL: ${{ inputs.service-label }}
        TUNNEL_PROXY_SERVER: ${{ inputs.tunnel-proxy-server }}
        TUNNEL_JOIN_TOKEN: ${{ inputs.tunnel-join-token }}
        TUNNEL_APPLICATION: ${{ inputs.tunnel-application }}
        TUNNEL_LOCAL_PORT: ${{ inputs.tunnel-local-port }}
        TUNNEL_CLIENT_COMMAND: ${{ inputs.tunnel-client-command }}
        IDENTITY_AUDIENCE: ${{ inputs.identity-audience }}
        IDENTITY_HEADER_NAME: ${{ inputs.identity-header-name }}
        HEALTH_PATH: ${{ inputs.health-path }}
      run: |
        set -euo pipefail

        umask 077
        TUNNEL_CONFIG="$(mktemp "${RUNNER_TEMP}/service-route-config.XXXXXX")"
        TUNNEL_LOG="$(mktemp "${RUNNER_TEMP}/service-route-log.XXXXXX")"
        TUNNEL_PID=""
        export TUNNEL_CONFIG

        cleanup() {
          local status=$?
          trap - EXIT
          if [[ -n "$TUNNEL_PID" ]] && kill -0 "$TUNNEL_PID" 2>/dev/null; then
            kill "$TUNNEL_PID" 2>/dev/null || true
          fi
          if [[ -n "$TUNNEL_PID" ]]; then
            wait "$TUNNEL_PID" 2>/dev/null || true
          fi
          rm -f "$TUNNEL_CONFIG" "$TUNNEL_LOG"
          exit "$status"
        }
        trap cleanup EXIT

        python3 - <<'PY'
        import json
        import os
        import re
        from pathlib import Path


        def stop(message):
            print(f"::error::{message}")
            raise SystemExit(1)


        def validate_name(value, label):
            if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", value):
                stop(f"{label} configuration is invalid.")
            return value


        proxy = os.environ["TUNNEL_PROXY_SERVER"]
        try:
            host, raw_proxy_port = proxy.rsplit(":", 1)
            proxy_port = int(raw_proxy_port)
        except (ValueError, TypeError):
            stop("Tunnel proxy configuration is invalid.")
        labels = host.split(".")
        if (
            not labels
            or len(host) > 253
            or not 1 <= proxy_port <= 65535
            or any(
                not re.fullmatch(
                    r"[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?",
                    label,
                )
                for label in labels
            )
        ):
            stop("Tunnel proxy configuration is invalid.")

        join_token = validate_name(
            os.environ["TUNNEL_JOIN_TOKEN"], "Tunnel join token"
        )
        application = validate_name(
            os.environ["TUNNEL_APPLICATION"], "Tunnel application"
        )
        try:
            local_port = int(os.environ["TUNNEL_LOCAL_PORT"])
        except ValueError:
            stop("Tunnel local port configuration is invalid.")
        if not 1024 <= local_port <= 65535:
            stop("Tunnel local port configuration is invalid.")

        config = "\n".join(
            [
                "version: v2",
                f"proxy_server: {json.dumps(proxy)}",
                "onboarding:",
                "  join_method: github",
                f"  token: {json.dumps(join_token)}",
                "storage:",
                "  type: memory",
                "outputs: []",
                "services:",
                "  - type: application-tunnel",
                f"    app_name: {json.dumps(application)}",
                f"    listen: tcp://127.0.0.1:{local_port}",
                "",
            ]
        )
        Path(os.environ["TUNNEL_CONFIG"]).write_text(config, encoding="utf-8")
        PY

        if [[ ! "$TUNNEL_CLIENT_COMMAND" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]{0,255}$ ]] \
          || [[ "$TUNNEL_CLIENT_COMMAND" == *".."* ]]; then
          echo "::error::Service tunnel client configuration is invalid."
          exit 1
        fi
        if ! TUNNEL_CLIENT_PATH="$(command -v -- "$TUNNEL_CLIENT_COMMAND")"; then
          echo "::error::Service tunnel client is unavailable."
          exit 1
        fi
        "$TUNNEL_CLIENT_PATH" start -c "$TUNNEL_CONFIG" >"$TUNNEL_LOG" 2>&1 &
        TUNNEL_PID=$!

        python3 - <<'PY'
        import json
        import os
        import re
        import ssl
        import time
        from urllib.error import HTTPError
        from urllib.parse import urlencode
        from urllib.request import HTTPRedirectHandler, HTTPSHandler, Request, build_opener


        class NoRedirects(HTTPRedirectHandler):
            def redirect_request(self, req, fp, code, msg, headers, newurl):
                return None


        def stop(message):
            print(f"::error::{message}")
            raise SystemExit(1)


        def validate_label(value):
            if not re.fullmatch(r"[A-Za-z0-9 ._-]{1,64}", value):
                stop("Service label is invalid.")
            return value


        def validate_header_name(value):
            if not re.fullmatch(r"[A-Za-z0-9!#$%&'*+.^_`|~-]{1,128}", value):
                stop("Identity header configuration is invalid.")
            return value


        def validate_path(value):
            if not re.fullmatch(r"/[A-Za-z0-9._~/-]+", value):
                stop("Service health path is invalid.")
            segments = value.split("/")[1:]
            if "//" in value or any(part in {"", ".", ".."} for part in segments):
                stop("Service health path is invalid.")
            return value


        ssl_context = ssl.create_default_context()


        def opener():
            return build_opener(HTTPSHandler(context=ssl_context), NoRedirects())


        def request_status(
            url, token=None, header_name=None, method="GET", tolerate_transport=False
        ):
            headers = {"User-Agent": "Security-Workflow-Preflight/1.0"}
            if token is not None and header_name is not None:
                headers[header_name] = token
            request = Request(
                url,
                headers=headers,
                method=method,
            )
            try:
                with opener().open(request, timeout=20) as response:
                    return response.status
            except HTTPError as error:
                return error.code
            except Exception as error:
                if tolerate_transport:
                    return None
                stop(f"Service transport failed ({type(error).__name__}).")


        label = validate_label(os.environ["SERVICE_LABEL"])
        path = validate_path(os.environ["HEALTH_PATH"])
        header_name = validate_header_name(os.environ["IDENTITY_HEADER_NAME"])
        try:
            local_port = int(os.environ["TUNNEL_LOCAL_PORT"])
        except ValueError:
            stop("Tunnel local port configuration is invalid.")
        if not 1024 <= local_port <= 65535:
            stop("Tunnel local port configuration is invalid.")
        origin = f"http://127.0.0.1:{local_port}"

        for _ in range(30):
            ready_status = request_status(
                f"{origin}/ready", tolerate_transport=True
            )
            if ready_status is not None and 200 <= ready_status < 300:
                break
            time.sleep(1)
        else:
            stop("Service tunnel did not become ready.")

        audience = os.environ["IDENTITY_AUDIENCE"]
        if not re.fullmatch(r"[A-Za-z0-9._:/-]{1,256}", audience):
            stop("Identity audience configuration is invalid.")

        request_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
        request_token = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
        if not request_url or not request_token:
            stop("GitHub OIDC is unavailable for this job.")

        separator = "&" if "?" in request_url else "?"
        oidc_request = Request(
            request_url + separator + urlencode({"audience": audience}),
            headers={"Authorization": f"bearer {request_token}"},
        )
        try:
            with opener().open(oidc_request, timeout=20) as response:
                token = json.load(response).get("value", "")
        except Exception as error:
            stop(f"GitHub OIDC acquisition failed ({type(error).__name__}).")
        if not isinstance(token, str) or not token or token != token.strip():
            stop("GitHub OIDC returned an invalid token.")

        health_status = request_status(
            f"{origin}{path}", token, header_name, "GET"
        )
        print(f"{label} health check: HTTP {health_status}")
        if not 200 <= health_status < 300:
            stop(f"{label} health check failed.")

        denied_status = request_status(
            f"{origin}{path}", token, header_name, "POST"
        )
        print(f"{label} denied-method check: HTTP {denied_status}")
        if denied_status != 403:
            stop(f"{label} denied-method check did not return HTTP 403.")
        PY
