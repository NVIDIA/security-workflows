# actionlint configuration. Declares NVIDIA self-hosted runner labels so actionlint does not report them as unknown.

self-hosted-runner:
  labels:
    - linux-amd64-cpu4

# GitHub supports queue: max; actionlint 1.7.12 does not yet parse it.
# Remove this exact, file-scoped exception when upstream #654 is released.
paths:
  .github/workflows/vuln-scan-pulse-oss.yml:
    ignore:
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
